websocket_whatwg:
  websocket_whatwg:
    description: Return the WHATWG WebSocket spec token.
    details: |
      `websocket_whatwg.websocket_whatwg()` returns a parser-style token for the WHATWG WebSocket API.
    signature: 'websocket_whatwg.websocket_whatwg() -> object'
    params: []
    return_value: object
    examples:
    - 'websocket_whatwg.websocket_whatwg()'
    see: []
  connect:
    description: Open a WHATWG WebSocket connection to a URL.
    details: |
      `websocket_whatwg.connect(url)` returns a connection object with `connection_id`.
      On `wasm32` this uses the browser `WebSocket`; on native targets it uses
      `tokio-tungstenite` with TLS.
    signature: 'websocket_whatwg.connect(url: string) -> object'
    params:
    - name: url
      type: string
      description: the WebSocket URL to connect to
    return_value: object
    examples:
    - 'let conn = websocket_whatwg.connect("wss://example.com/")'
    see: []
  send:
    description: Send a message over a WHATWG WebSocket connection.
    details: |
      `websocket_whatwg.send(conn, msg)` queues a message on the connection.
      `msg` may be a string or an object with `text` or `binary` keys.
    signature: 'websocket_whatwg.send(conn: object, msg: any) -> null'
    params:
    - name: conn
      type: object
      description: the connection object
    - name: msg
      type: any
      description: the message to send
    return_value: null
    examples:
    - 'websocket_whatwg.send(conn, "hello")'
    see: []
  recv:
    description: Receive a message from a WHATWG WebSocket connection.
    details: |
      `websocket_whatwg.recv(conn)` returns the next queued message, or `null` if none.
    signature: 'websocket_whatwg.recv(conn: object) -> any'
    params:
    - name: conn
      type: object
      description: the connection object
    return_value: any
    examples:
    - 'websocket_whatwg.recv(conn)'
    see: []
  close:
    description: Close a WHATWG WebSocket connection.
    details: |
      `websocket_whatwg.close(conn)` closes the connection.
    signature: 'websocket_whatwg.close(conn: object) -> null'
    params:
    - name: conn
      type: object
      description: the connection object
    return_value: null
    examples:
    - 'websocket_whatwg.close(conn)'
    see: []
