[package]
name = "handl-lib-websocket-whatwg"
version.workspace = true
edition.workspace = true
description = "WHATWG WebSocket client module for the handl runtime."

[dependencies]
handl-vm.workspace = true
handl-vm-common.workspace = true
handl-vm-values-json.workspace = true
serde = "1"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "Event", "Blob"] }
