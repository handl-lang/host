[package]
name = "handl-plugin-ext-sdkgen"
version.workspace = true
edition.workspace = true
description = "`hnl sdkgen` CLI extension (ADR-0107)."
license.workspace = true
repository.workspace = true

[dependencies]
handl-language = { path = "../handl-language" }
handl-plugin-sdkgen = { path = "../plugin-sdkgen" }
handl-plugin-sdkgen-backend-c = { path = "../plugin-sdkgen-backend-c" }
handl-plugin-sdkgen-backend-webidl = { path = "../plugin-sdkgen-backend-webidl" }
handl-plugin-sdkgen-emitter-file = { path = "../plugin-sdkgen-emitter-file" }
# ADR-0128 Phase 1: the python emitter lives in the `python` repo;
# the root `[patch]` resolves the sibling checkout for local dev.
handl-plugin-sdkgen-emitter-python = { git = "https://github.com/handl-lang/python", rev = "c657921402adcfc2da17a11e24f1d6882a47276b" }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
