[package]
name = "handl-plugin-ext-sdkgen"
version.workspace = true
edition.workspace = true
description = "`hnl sdkgen` CLI extension (ADR-0107)."
license.workspace = true
repository.workspace = true

# ADR-0128 §0.1: each target is a feature — the host opts repo modules in
# on its own manifest. `python` implies `c`: the `python` target record
# names backend `c` (resolved through the registry, not a crate dep).
[features]
default = ["c", "webidl", "python", "cli"]
c = ["dep:handl-plugin-sdkgen-backend-c", "dep:handl-plugin-sdkgen-emitter-file"]
webidl = ["dep:handl-plugin-sdkgen-backend-webidl", "dep:handl-plugin-sdkgen-emitter-file"]
python = ["c", "dep:handl-plugin-sdkgen-emitter-python"]
# ADR-0128 Phase: the cli backend + hnl-cli emitter live in the `cli`
# repo; the root `[patch]` resolves the sibling checkout for local dev.
cli = ["dep:handl-plugin-sdkgen-cli"]

[dependencies]
handl-language = { workspace = true }
# PL-004 Phase 1: the core was renamed `handl-plugin-sdkgen` →
# `handl-plugin-codegen` and migrated to the kernel traits; this ext
# crate still drives the pre-rename API until the T-075/T-076 migration
# wave, so it consumes the pre-rename crate from git main — MUST stay
# `branch = "main"` (not a rev pin): the engine-sdkgen-* siblings dep
# on the same source and the types must unify.
handl-plugin-sdkgen = { git = "https://github.com/handl-lang/host", branch = "main" }
# ADR-0128 Phase 2: the c backend lives in the `c` repo; the root
# `[patch]` resolves the sibling checkout for local dev.
handl-plugin-sdkgen-backend-c = { git = "https://github.com/handl-lang/engine-sdkgen-c", branch = "main", optional = true }
# ADR-0128 Phase 5: the webidl backend lives in the `web` repo; the root
# `[patch]` resolves the sibling checkout for local dev.
handl-plugin-sdkgen-backend-webidl = { git = "https://github.com/handl-lang/engine-sdkgen-webidl", branch = "main", optional = true }
handl-plugin-sdkgen-emitter-file = { git = "https://github.com/handl-lang/engine-sdkgen-file", branch = "main", optional = true }
# ADR-0128 Phase 1: the python emitter lives in the `python` repo;
# the root `[patch]` resolves the sibling checkout for local dev.
handl-plugin-sdkgen-emitter-python = { git = "https://github.com/handl-lang/engine-sdkgen-python", branch = "main", optional = true }
handl-plugin-sdkgen-cli = { git = "https://github.com/handl-lang/engine-sdkgen-cli", branch = "main", optional = true }