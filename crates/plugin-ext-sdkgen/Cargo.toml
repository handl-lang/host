[package]
name = "handl-plugin-ext-sdkgen"
version.workspace = true
edition.workspace = true
description = "`hnl sdkgen` CLI extension (ADR-0107)."
license.workspace = true
repository.workspace = true

# ADR-0128 §0.1: each target is a feature — the host opts repo modules in
# on its own manifest. `python` implies `c`: the `python` target record
# names backend `c` (resolved through the registry, not a crate dep).
[features]
default = ["c", "webidl", "python"]
c = ["dep:handl-plugin-sdkgen-backend-c", "dep:handl-plugin-sdkgen-emitter-file"]
webidl = ["dep:handl-plugin-sdkgen-backend-webidl", "dep:handl-plugin-sdkgen-emitter-file"]
python = ["c", "dep:handl-plugin-sdkgen-emitter-python"]

[dependencies]
handl-language = { path = "../handl-language" }
handl-plugin-sdkgen = { path = "../plugin-sdkgen" }
# ADR-0128 Phase 2: the c backend lives in the `c` repo; the root
# `[patch]` resolves the sibling checkout for local dev.
handl-plugin-sdkgen-backend-c = { git = "https://github.com/handl-lang/c", branch = "main", optional = true }
# ADR-0128 Phase 5: the webidl backend lives in the `web` repo; the root
# `[patch]` resolves the sibling checkout for local dev.
handl-plugin-sdkgen-backend-webidl = { git = "https://github.com/handl-lang/web", branch = "main", optional = true }
handl-plugin-sdkgen-emitter-file = { path = "../plugin-sdkgen-emitter-file", optional = true }
# ADR-0128 Phase 1: the python emitter lives in the `python` repo;
# the root `[patch]` resolves the sibling checkout for local dev.
handl-plugin-sdkgen-emitter-python = { git = "https://github.com/handl-lang/python", branch = "main", optional = true }
