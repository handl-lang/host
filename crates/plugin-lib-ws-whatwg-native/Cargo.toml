[package]
name = "handl-plugin-lib-ws-whatwg-native"
version.workspace = true
edition.workspace = true
description = "Native WHATWG-style WebSocket client module for the handl runtime."

[dependencies]
handl-platform = { workspace = true }
handl-plugin-vm.workspace = true
handl-plugin-vm-common.workspace = true
handl-plugin-vm-values-json.workspace = true
serde = "1"
serde_json = "1"
base64.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
