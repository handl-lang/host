[package]
name = "handl-plugin-lib-unicode-native"
version.workspace = true
edition.workspace = true
description = "Native `unicode` module — Rust/ICU4X backend for the `unicode` contract"

[dependencies]
handl-platform = {path = "../platform" }
handl-plugin-lib-handl = { workspace = true }
handl-plugin-lib-char-native = {path = "../plugin-lib-char-native" }
handl-plugin-lib-unicode = {path = "../../.ref-crates/plugin-lib-unicode" }
handl-plugin-module = {path = "../plugin-module" }
serde_json = { workspace = true }
icu_casemap = { version = "2", features = ["compiled_data"] }
icu_normalizer = { version = "2", features = ["compiled_data"] }
icu_segmenter = { version = "2", features = ["compiled_data"] }
unicode-width = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
