[package]
name = "handl-plugin-ext-lint"
version.workspace = true
edition.workspace = true

[dependencies]
handl-platform = { path = "../platform" }
handl-plugin-ext-diag = { path = "../plugin-ext-diag", features = ["lang-span"] }
handl-plugin-ext-fmt = { path = "../plugin-ext-fmt" }
handl-plugin-engine-lint = { path = "../plugin-engine-lint" }
handl-plugin-engine-typecheck = { path = "../plugin-engine-typecheck" }
handl-language = { path = "../handl-language" }
serde_json = { workspace = true }

[dev-dependencies]
# Tests build the canonical LintContext from the kit — the same shape the
# host uses (ADR-0128 §0.8). Dev-only: only normal deps create the
# platform↔lang cycle.
handl-kit-canonical = { path = "../kit-canonical" }
handl-kit-data-canonical = { path = "../handl-kit-data-canonical" }
serde_json = { workspace = true }
