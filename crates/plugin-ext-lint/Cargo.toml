[package]
name = "handl-plugin-ext-lint"
version.workspace = true
edition.workspace = true
description = "`handl-plugin-ext-lint` — bootstrap linter for the v0.1 arrow surface syntax (ADR-0087, rules-as-data per ADR-0097)."
license.workspace = true
repository.workspace = true

[dependencies]
handl-platform = { path = "../platform" }
handl-plugin-ext-diag = { path = "../plugin-ext-diag", features = ["lang-span"] }
handl-plugin-ext-fmt = { path = "../plugin-ext-fmt" }
hnl-tool-lint = { git = "https://github.com/handl-lang/tool-lint", branch = "main" }
# PL-004 T-091: `fix_file` routes lint fixes through the codemod
# byte-splice path (`plan_byte_edits`) and the codegen lifecycle
# (`Engine::apply`/`revert`) — journaled, drift-checked writes.
hnl-tool-codemod = { workspace = true }
hnl-tool-codegen = { workspace = true }
hnl-tool-typecheck = { git = "https://github.com/handl-lang/tool-typecheck", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
handl-plugin-lib-handl = { path = "../plugin-lib-handl" }
handl-language = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests build the canonical LintContext from the kit — the same shape the
# host uses (ADR-0128 §0.8). Dev-only: only normal deps create the
# platform↔lang cycle.
handl-kit-prelude = { workspace = true }
handl-kit-data-prelude = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
