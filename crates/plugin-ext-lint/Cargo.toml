[package]
name = "handl-plugin-ext-lint"
version.workspace = true
edition.workspace = true
description = "`handl-plugin-ext-lint` — bootstrap linter for the v0.1 arrow surface syntax (ADR-0087, rules-as-data per ADR-0097)."
license.workspace = true
repository.workspace = true

[dependencies]
handl-platform = { path = "../platform" }
handl-plugin-ext-diag = { path = "../plugin-ext-diag", features = ["lang-span"] }
handl-plugin-ext-fmt = { path = "../plugin-ext-fmt" }
hnl-engine-lint = { git = "https://github.com/handl-lang/engine-lint", branch = "main" }
hnl-engine-typecheck = { git = "https://github.com/handl-lang/engine-typecheck", branch = "main" }
handl-language = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests build the canonical LintContext from the kit — the same shape the
# host uses (ADR-0128 §0.8). Dev-only: only normal deps create the
# platform↔lang cycle.
handl-kit-canonical = { workspace = true }
handl-kit-data-canonical = { workspace = true }
serde_json = { workspace = true }