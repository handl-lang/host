[package]
name = "handl-kit-canonical"
version = "0.1.0"
edition = "2024"

# ADR-0128 §0.5: the cranelift exec engine is a Cargo feature, not a hard
# link — `handl-plugin-engine-exec-cranelift` pulls 14 cranelift crates into
# every consumer (the LSP host, `plugin-compile-js`, parse-only embedders).
# `default = ["cranelift"]` keeps today's behavior; consumers opt out with
# `default-features = false` and can still wire an exec engine through the
# `EngineRegistry` contract (`Kit::new_with_registry` /
# `runtime_for_lang_with_registry`).
[features]
default = ["cranelift"]
cranelift = ["dep:handl-plugin-engine-exec-cranelift"]

[dependencies]
handl-kit-data-canonical = { workspace = true }
handl-runtime = { workspace = true }
handl-language = { workspace = true }
handl-plugin-engine-exec = { workspace = true }
handl-plugin-engine-lex-pattern = { workspace = true }
handl-plugin-engine-parse = { workspace = true }
handl-plugin-engine-parse-pratt = { workspace = true }
handl-plugin-engine-exec-tree-walk = { workspace = true }
handl-plugin-engine-exec-bytecode = { workspace = true }
handl-plugin-engine-exec-cranelift = { workspace = true, optional = true }
handl-plugin-engine-typecheck = { workspace = true }
handl-plugin-engine-typecheck-handl = { workspace = true }
handl-plugin-ext-diag = { workspace = true }
handl-platform = { workspace = true }
handl-plugin-lib-lang-lex = { workspace = true }
handl-plugin-lib-lang-parse = { workspace = true }
handl-plugin-lib-lang-eval = { workspace = true }
handl-plugin-lib-lang-typecheck = { workspace = true }
handl-plugin-lib-lang-compile = { workspace = true }
handl-plugin-lib-lang-run-compiled = { workspace = true }
handl-plugin-lib-stdlib = { path = "../plugin-lib-stdlib" }
handl-plugin-lib-handl = { workspace = true }
handl-plugin-lib-crypto = { workspace = true }
handl-plugin-lib-char-native = { workspace = true }
handl-plugin-ffi = { workspace = true }
handl-plugin-lib-tag = { workspace = true }
handl-plugin-module = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "perf"
harness = false
