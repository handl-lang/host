[package]
name = "handl-kit-canonical"
version = "0.1.0"
edition = "2024"
description = "Canonical kit backed by the data-driven runtime."
license.workspace = true
repository.workspace = true

# ADR-0128 §0.5/§0.9: the cranelift exec engine and the FFI surface are
# Cargo features, not hard links — `handl-plugin-engine-exec-cranelift`
# and `handl-plugin-ffi` pull 14 cranelift crates + libloading into every
# consumer (the LSP host, `plugin-compile-js`, parse-only embedders).
# `default = ["cranelift", "ffi"]` keeps today's behavior; consumers opt
# out with `default-features = false` and can still wire an exec engine
# through the `EngineRegistry` contract (`Kit::new_with_registry` /
# `runtime_for_lang_with_registry`). With `ffi` off the `ffi` module stays
# resolvable — its ops become stubs that raise a clear "not compiled in"
# error (`ffi.load`/`ffi.sym` keep their non-raising `{__tag__: "err"}`
# probe contract so dependent packages degrade gracefully).
#
# `cranelift` does not imply `ffi`: enabling `cranelift` alone still
# builds `handl-plugin-ffi` transitively (the engine's own FFI
# marshalling), but the `ffi` handl module only wires the real ops under
# the `ffi` feature.
[features]
default = ["cranelift", "ffi"]
cranelift = ["dep:handl-plugin-engine-exec-cranelift"]
ffi = ["dep:handl-plugin-ffi"]

[dependencies]
handl-kit-data-canonical = { workspace = true }
handl-runtime = { workspace = true }
handl-language = { workspace = true }
handl-plugin-engine-exec = { workspace = true }
handl-plugin-engine-lex-pattern = { workspace = true }
handl-plugin-engine-parse = { workspace = true }
handl-plugin-engine-parse-pratt = { workspace = true }
handl-plugin-engine-exec-tree-walk = { workspace = true }
handl-plugin-engine-exec-bytecode = { workspace = true }
handl-plugin-engine-exec-cranelift = { workspace = true, optional = true }
handl-plugin-engine-typecheck = { workspace = true }
handl-plugin-engine-typecheck-handl = { workspace = true }
handl-plugin-ext-diag = { workspace = true }
handl-platform = { workspace = true }
handl-plugin-lib-lang-lex = { workspace = true }
handl-plugin-lib-lang-parse = { workspace = true }
handl-plugin-lib-lang-eval = { workspace = true }
handl-plugin-lib-lang-typecheck = { workspace = true }
handl-plugin-lib-lang-compile = { workspace = true }
handl-plugin-lib-lang-run-compiled = { workspace = true }
handl-plugin-lib-stdlib = { path = "../plugin-lib-stdlib" }
handl-plugin-lib-handl = { workspace = true }
handl-plugin-lib-crypto = { workspace = true }
handl-plugin-lib-char-native = { workspace = true }
handl-plugin-ffi = { workspace = true, optional = true }
handl-plugin-lib-tag = { workspace = true }
handl-plugin-module = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "perf"
harness = false
