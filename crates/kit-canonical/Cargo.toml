[package]
name = "handl-kit-canonical"
version = "0.1.0"
edition = "2024"

[dependencies]
# Data-driven runtime path.
handl-kit-data-canonical = { workspace = true }
handl-runtime = { workspace = true }
handl-language = { workspace = true }

# Platform types (AstNode, Span, PlatformError).
handl-platform = { workspace = true }

# Serialization.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"

[dev-dependencies]
criterion = "0.5"
