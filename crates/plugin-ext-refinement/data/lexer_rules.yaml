# Lexer rules for the arrow DSL (ADR-0069 arrow-graph syntax).
#
# Priority conventions (lower = tried first by the lexer engine):
#   - Multi-char operators (`>>>`, `|||`): priority 10 (matched before any
#     single `>` or `|` that might be added later).
#   - Keywords (`arr`, `comp`, `first`, `choice`, `loop`, `app`, `id`):
#     priority 15 (matched before the identifier rule at priority 50, so
#     `arr` lexes as `token.arrow.arr`, not `token.arrow.identifier`).
#   - Punctuation (`(`, `)`, `,`, `=`): priority 30.
#   - String literals: priority 40.
#   - Identifiers: priority 50 (lowest — fallback).
#
# Keywords win over identifiers because they have lower (higher-priority)
# numeric priority. Multi-char operators win over single-char operators
# because they have lower priority and the lexer prefers longest match
# among equal-priority literals, with priority as the tiebreaker.

# --- Multi-char operators -----------------------------------------------
- id: lex.arrow.flow
  token_kind: token.arrow.flow
  pattern: !Literal
    text: '>>>'
  priority: 10
- id: lex.arrow.choice_op
  token_kind: token.arrow.choice_op
  pattern: !Literal
    text: '|||'
  priority: 10

# --- Keywords -----------------------------------------------------------
# These must have higher priority (lower numeric value) than the identifier
# rule so that e.g. `arr` is recognized as the keyword, not an identifier.
- id: lex.arrow.arr
  token_kind: token.arrow.arr
  pattern: !Literal
    text: arr
  priority: 15
- id: lex.arrow.comp
  token_kind: token.arrow.comp
  pattern: !Literal
    text: comp
  priority: 15
- id: lex.arrow.first
  token_kind: token.arrow.first
  pattern: !Literal
    text: first
  priority: 15
- id: lex.arrow.choice
  token_kind: token.arrow.choice
  pattern: !Literal
    text: choice
  priority: 15
- id: lex.arrow.loop
  token_kind: token.arrow.loop
  pattern: !Literal
    text: loop
  priority: 15
- id: lex.arrow.app
  token_kind: token.arrow.app
  pattern: !Literal
    text: app
  priority: 15
- id: lex.arrow.id
  token_kind: token.arrow.id
  pattern: !Literal
    text: id
  priority: 15

# --- Punctuation --------------------------------------------------------
- id: lex.arrow.lparen
  token_kind: token.arrow.lparen
  pattern: !Literal
    text: (
  priority: 30
- id: lex.arrow.rparen
  token_kind: token.arrow.rparen
  pattern: !Literal
    text: )
  priority: 30
- id: lex.arrow.comma
  token_kind: token.arrow.comma
  pattern: !Literal
    text: ','
  priority: 30
- id: lex.arrow.eq
  token_kind: token.arrow.eq
  pattern: !Literal
    text: '='
  priority: 20

# --- Rich-loop punctuation ----------------------------------------------
# `{`, `}`, `[`, `]`, `:`, `;` — same priority as `(`, `)`, `,`.
- id: lex.arrow.lbrace
  token_kind: token.arrow.lbrace
  pattern: !Literal
    text: '{'
  priority: 30
- id: lex.arrow.rbrace
  token_kind: token.arrow.rbrace
  pattern: !Literal
    text: '}'
  priority: 30
- id: lex.arrow.lbracket
  token_kind: token.arrow.lbracket
  pattern: !Literal
    text: '['
  priority: 30
- id: lex.arrow.rbracket
  token_kind: token.arrow.rbracket
  pattern: !Literal
    text: ']'
  priority: 30
- id: lex.arrow.colon
  token_kind: token.arrow.colon
  pattern: !Literal
    text: ':'
  priority: 30
- id: lex.arrow.semicolon
  token_kind: token.arrow.semicolon
  pattern: !Literal
    text: ';'
  priority: 30

# --- Rich-loop multi-char operators --------------------------------------
# `~>`, `-<`, `<-`, `<=`, `...` — priority 10 (same as `>>>`, `|||`).
# `...` is 3 chars and sorts before any shorter literal at the same priority.
- id: lex.arrow.arrow
  token_kind: token.arrow.arrow
  pattern: !Literal
    text: '~>'
  priority: 10
- id: lex.arrow.arrow_app
  token_kind: token.arrow.arrow_app
  pattern: !Literal
    text: '-<'
  priority: 10
- id: lex.arrow.arrow_bind
  token_kind: token.arrow.arrow_bind
  pattern: !Literal
    text: '<-'
  priority: 10
- id: lex.arrow.le
  token_kind: token.arrow.le
  pattern: !Literal
    text: '<='
  priority: 10
- id: lex.arrow.ellipsis
  token_kind: token.arrow.ellipsis
  pattern: !Literal
    text: '...'
  priority: 10

# --- Rich-loop keywords --------------------------------------------------
# Same priority as other keywords (15) — matched before the identifier rule
# (50). Word-boundary check prevents prefix matching (e.g. `in` won't match
# inside `input`).
- id: lex.arrow.match
  token_kind: token.arrow.match
  pattern: !Literal
    text: match
  priority: 15
- id: lex.arrow.if
  token_kind: token.arrow.if
  pattern: !Literal
    text: if
  priority: 15
- id: lex.arrow.then
  token_kind: token.arrow.then
  pattern: !Literal
    text: then
  priority: 15
- id: lex.arrow.else
  token_kind: token.arrow.else
  pattern: !Literal
    text: else
  priority: 15
- id: lex.arrow.do
  token_kind: token.arrow.do
  pattern: !Literal
    text: do
  priority: 15
- id: lex.arrow.returnA
  token_kind: token.arrow.returnA
  pattern: !Literal
    text: returnA
  priority: 15
- id: lex.arrow.in
  token_kind: token.arrow.in
  pattern: !Literal
    text: in
  priority: 15

# --- Rich-loop literals --------------------------------------------------
# Number literal — for comparison values like `cmp <= 0`.
- id: lex.arrow.number
  token_kind: token.arrow.number
  pattern: Number
  priority: 40

# --- Literals -----------------------------------------------------------
- id: lex.arrow.string
  token_kind: token.arrow.string
  pattern: !Delimited
    open: '"'
    close: '"'
    escape: true
    interpolation: false
    close_at_eof: false
  priority: 40

# --- Identifiers --------------------------------------------------------
# The ad-hoc parser allows `.` in identifiers (e.g. `prim.compare`,
# `state.f`, `state.acc`), so `continue_chars` includes `.`.
- id: lex.arrow.identifier
  token_kind: token.arrow.identifier
  pattern: !CharClass
    start_chars: a-zA-Z_
    continue_chars: a-zA-Z0-9_.
  priority: 50
