# Token kinds for the arrow DSL (ADR-0069 arrow-graph syntax).
#
# This is a **separate** arrow-specific token namespace (`token.arrow.*`),
# distinct from the main handl language's `token.*` namespace. The arrow
# DSL and the main language share operator glyphs (`>>>`, `|||`, `(`, `,`,
# `=`) but have different semantics:
#
#   - `>>>` means `Seq` (arrow composition) in the arrow DSL, but `App`
#     (function application / pipe) in the main language.
#   - `|||` means `Choice` in both, but the arrow DSL keeps it in its own
#     namespace so the two languages can evolve independently.
#
# See `arrow_parser.rs` for the ad-hoc parser this definition is meant to
# eventually replace.

# --- Keywords -----------------------------------------------------------
# Each combinator keyword gets its own token kind so the Pratt grammar can
# dispatch `arr(...)`, `comp(...)`, `first(...)`, `choice(...)`, `loop(...)`,
# `app(...)` to distinct node kinds with distinct eval schemes.
- id: token.arrow.arr
  label: arr
- id: token.arrow.comp
  label: comp
- id: token.arrow.first
  label: first
- id: token.arrow.choice
  label: choice
- id: token.arrow.loop
  label: loop
- id: token.arrow.app
  label: app
# `id` is the identity arrow keyword — a nullary atom (`id`, not `id(...)`).
- id: token.arrow.id
  label: id

# --- Operators ----------------------------------------------------------
# `>>>` — sequence / flow operator. Desugars to `Scheme::Seq` (NOT `App`
# as in the main language).
- id: token.arrow.flow
  label: '>>>'
# `|||` — choice operator. Desugars to `Scheme::Choice`.
- id: token.arrow.choice_op
  label: '|||'

# --- Punctuation --------------------------------------------------------
- id: token.arrow.lparen
  label: (
- id: token.arrow.rparen
  label: )
- id: token.arrow.comma
  label: ','
# `=` for named-arrow definitions (`name = expr` lines).
- id: token.arrow.eq
  label: '='
# `{` and `}` — braces for rich-loop declaration blocks, proc body blocks,
# match arm blocks, and object literals.
- id: token.arrow.lbrace
  label: '{'
- id: token.arrow.rbrace
  label: '}'
# `[` and `]` — brackets for list patterns and list literals.
- id: token.arrow.lbracket
  label: '['
- id: token.arrow.rbracket
  label: ']'
# `:` — pair separator inside `{ ... }` blocks (object entries, match arms).
- id: token.arrow.colon
  label: ':'
# `;` — statement separator inside `do { ... }` blocks.
- id: token.arrow.semicolon
  label: ';'

# --- Rich-loop operators ------------------------------------------------
# `->` — separates proc params from body (`proc (state) -> body`).
- id: token.arrow.arrow
  label: '->'
# `-<` — arrow application (`returnA -< { ... }`, `state.f -< h`).
- id: token.arrow.arrow_app
  label: '-<'
# `<-` — arrow bind (`y <- state.f -< h`).
- id: token.arrow.arrow_bind
  label: '<-'
# `<=` — less-than-or-equal comparison (used in `if cmp <= 0 then ...`).
- id: token.arrow.le
  label: '<='
# `...` — spread/rest in list patterns and literals (`[h, ...t]`).
- id: token.arrow.ellipsis
  label: '...'

# --- Rich-loop keywords -------------------------------------------------
# These are word-like literals; the lexer's word-boundary check prevents
# them from matching as a prefix of a longer identifier (e.g. `in` won't
# match inside `input`).
- id: token.arrow.proc
  label: proc
- id: token.arrow.match
  label: match
- id: token.arrow.if
  label: if
- id: token.arrow.then
  label: then
- id: token.arrow.else
  label: else
- id: token.arrow.do
  label: do
- id: token.arrow.returnA
  label: returnA
- id: token.arrow.in
  label: in

# --- Literals (rich-loop) -----------------------------------------------
# Number literal — for comparison values like `cmp <= 0`.
- id: token.arrow.number
  label: number
  literal: Number

# --- Literals & identifiers ---------------------------------------------
# String literal — same escape table as the main language's `token.string`.
- id: token.arrow.string
  label: string
  literal: !String
    delim_chars: 1
    escapes:
    - - '\n'
      - "\n"
    - - '\t'
      - "\t"
    - - '\"'
      - '"'
    - - '\\'
      - '\'
# Identifier — bare references to named arrows. Note: the ad-hoc parser
# allows `.` in identifiers (e.g. `prim.compare`, `state.f`), so the
# lexer rule's continue-chars include `.`.
- id: token.arrow.identifier
  label: identifier
