# AST shape definitions for the arrow DSL (ADR-0069 arrow-graph syntax).
#
# Each node kind produced by `grammar.yaml` has a payload schema here. The
# schemas follow the same JSON-Schema-fragment convention as the main
# language's `ast.yaml`. Node kinds are in the arrow-specific namespace
# (no `binary.*` / `value` / `var` collisions with the main language).

# `flow` — `a >>> b` (sequence composition). Two children: [fst, snd].
- id: ast.arrow.flow
  node_kind: flow
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `choice_op` — `a ||| b` (arrow choice). Two children: [l, r].
- id: ast.arrow.choice_op
  node_kind: choice_op
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arr_call` — `arr("name", args...)`. Variable-arity children:
# [string_name, arg1, arg2, ...]. The string name is child 0.
- id: ast.arrow.arr_call
  node_kind: arr_call
  payload_schema:
    properties:
      children:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - children
    type: object

# `comp_call` — `comp(a, b)`. Two children: [fst, snd].
- id: ast.arrow.comp_call
  node_kind: comp_call
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `first_call` — `first(a)`. One child: [inner].
- id: ast.arrow.first_call
  node_kind: first_call
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object

# `choice_call` — `choice(a, b)`. Two children: [l, r].
- id: ast.arrow.choice_call
  node_kind: choice_call
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `loop_call` — `loop(a)`. One child: [body].
- id: ast.arrow.loop_call
  node_kind: loop_call
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object

# `app_call` — `app("name", args...)`. Variable-arity children:
# [string_name, arg1, arg2, ...]. The string name is child 0.
- id: ast.arrow.app_call
  node_kind: app_call
  payload_schema:
    properties:
      children:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - children
    type: object

# `arrow_id` — the `id` keyword. Nullary (no children).
- id: ast.arrow.arrow_id
  node_kind: arrow_id
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 0
        minItems: 0
        type: array
    required:
    - children
    type: object

# `arrow_var` — a bare identifier (reference to a named arrow). Nullary;
# the identifier text rides in the `name` payload field.
- id: ast.arrow.arrow_var
  node_kind: arrow_var
  payload_schema:
    properties:
      name:
        type: string
    required:
    - name
    type: object

# `arrow_string` — a string literal (the name argument in `arr("...")` /
# `app("...")`). Nullary; the string value rides in the `value` payload.
- id: ast.arrow.arrow_string
  node_kind: arrow_string
  payload_schema:
    properties:
      value: {}
    required:
    - value
    type: object

# `arrow_paren` — `( expr )` grouping. One child: [inner]. Passes through
# to the inner expression at eval time.
- id: ast.arrow.arrow_paren
  node_kind: arrow_paren
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object

# `named_arrow` — `name = expr` definition. Two children:
# [name_identifier, expr]. The name string rides in the `name` payload
# field (extracted from child 0's payload at parse/desugar time).
- id: ast.arrow.named_arrow
  node_kind: named_arrow
  payload_schema:
    properties:
      name:
        type: string
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - name
    - children
    type: object

# ============================================================================
# Rich-loop syntax AST nodes
# ============================================================================
# These node kinds are produced by the rich-loop grammar rows. The
# `loop_rich` node is special-cased in `ast_to_scheme` (arrow_parser.rs)
# which pattern-matches on the proc body AST to determine the `Scheme`.
# The other node kinds are structural — their eval schemes are placeholders.

# `loop_rich` — `loop { ... } ( params ~> body )`. Two children:
# [decl_block, proc_expr]. The decl_block is the `{ ... }` block; the
# proc_expr is the `state ~> match ...` expression.
- id: ast.arrow.loop_rich
  node_kind: loop_rich
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_block` — `{ key: value, ... }`. Variable-arity children (entries).
# flatten: true so entries splice directly into the block node.
- id: ast.arrow.arrow_block
  node_kind: arrow_block
  payload_schema:
    properties:
      children:
        items:
          type: integer
        type: array
    required:
    - children
    type: object

# `arrow_entry` — `key: value` pair inside a block. Two children: [key, value].
- id: ast.arrow.arrow_entry
  node_kind: arrow_entry
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_array` — `[ elem, ... ]`. Variable-arity children (elements).
# flatten: true so elements splice directly into the array node.
- id: ast.arrow.arrow_array
  node_kind: arrow_array
  payload_schema:
    properties:
      children:
        items:
          type: integer
        type: array
    required:
    - children
    type: object

# `arrow_rest` — `...expr` spread/rest. One child: [inner].
- id: ast.arrow.arrow_rest
  node_kind: arrow_rest
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object

# `arrow_proc` — `params ~> body`. Two children: [params, body].
- id: ast.arrow.arrow_proc
  node_kind: arrow_proc
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_match` — `match scrut { arms }`. Two children:
# [scrutinee, arms_container]. The arms_container is a `block` node whose
# children are `arrow_arm` nodes.
- id: ast.arrow.arrow_match
  node_kind: arrow_match
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_arm` — `pattern : body` match arm. Two children: [pattern, body].
- id: ast.arrow.arrow_arm
  node_kind: arrow_arm
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_if` — `if cond then body else body`. Three children:
# [cond, then_body, else_body].
- id: ast.arrow.arrow_if
  node_kind: arrow_if
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
    required:
    - children
    type: object

# `arrow_do` — `do { stmt; stmt }`. Variable-arity children (statements).
# flatten: true so statements splice directly into the do node.
- id: ast.arrow.arrow_do
  node_kind: arrow_do
  payload_schema:
    properties:
      children:
        items:
          type: integer
        type: array
    required:
    - children
    type: object

# `arrow_return` — `returnA` keyword. Nullary (no children).
- id: ast.arrow.arrow_return
  node_kind: arrow_return
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 0
        minItems: 0
        type: array
    required:
    - children
    type: object

# `arrow_number` — a number literal. Nullary; the value rides in the payload.
- id: ast.arrow.arrow_number
  node_kind: arrow_number
  payload_schema:
    properties:
      value: {}
    required:
    - value
    type: object

# `arrow_call` — `callee( args... )` function call. Variable-arity children:
# [callee, arg1, arg2, ...]. The callee is child 0.
- id: ast.arrow.arrow_call
  node_kind: arrow_call
  payload_schema:
    properties:
      children:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - children
    type: object

# `arrow_colon` — `:` infix node (placeholder; pair elements use
# `arrow_entry`/`arrow_arm` instead). Two children: [lhs, rhs].
- id: ast.arrow.arrow_colon
  node_kind: arrow_colon
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_app` — `-<` arrow application. Two children: [left, right].
- id: ast.arrow.arrow_app
  node_kind: arrow_app
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_bind` — `<-` arrow bind. Two children: [left, right].
- id: ast.arrow.arrow_bind
  node_kind: arrow_bind
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_let_in` — `expr in body` let-in. Two children: [binding, body].
- id: ast.arrow.arrow_let_in
  node_kind: arrow_let_in
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object

# `arrow_le` — `<=` comparison. Two children: [left, right].
- id: ast.arrow.arrow_le
  node_kind: arrow_le
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
