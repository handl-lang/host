# Pratt grammar rows for the arrow DSL (ADR-0069 arrow-graph syntax).
#
# Precedence (higher binding power = tighter binding):
#
#   | Operator | Construct      | BP (l, r)   | Assoc    |
#   |----------|----------------|-------------|----------|
#   | `>>>`    | flow / Seq     | (20, 21)    | left     |
#   | `|||`    | choice_op      | (23, 23)    | left     |
#   | `=`      | named_arrow    | (5, 6)      | right    |
#
# `|||` binds tighter than `>>>`, so `a >>> b ||| c` parses as
# `Seq(a, Choice(b, c))` — matching the ad-hoc parser in `arrow_parser.rs`.
#
# The function-call forms (`arr(...)`, `comp(...)`, `first(...)`,
# `choice(...)`, `loop(...)`, `app(...)`) are modeled as **prefix keyword
# rules** with a delimited parenthesized argument block (flatten: true),
# mirroring how the main language models `match`/`handle` prefix keywords
# with a delimited brace block. The keyword is the prefix token; the
# `( args )` block is the single (delimited) child, flattened so the
# parsed argument nodes splice directly into the parent node's children.

# --- Infix operators ----------------------------------------------------

# `>>>` — sequence composition. Left-associative: `a >>> b >>> c` becomes
# `Seq(Seq(a, b), c)`. Node kind `flow` (same glyph as the main language,
# but the eval scheme maps it to `Scheme::Seq`, NOT `Scheme::App`).
- id: grammar.arrow.flow.infix
  token: token.arrow.flow
  position: Infix
  binding_power:
    - 20
    - 21
  child_shape:
    node_kind: flow
    arity: 2

# `|||` — choice. Left-associative: `a ||| b ||| c` becomes
# `Choice(Choice(a, b), c)`. Binds tighter than `>>>`.
# Right BP is left BP + 1 for left-associativity (the Pratt engine consumes
# the next operator when lbp >= rbp, so rbp = lbp + 1 prevents the inner
# call from grabbing the next `|||`).
- id: grammar.arrow.choice_op.infix
  token: token.arrow.choice_op
  position: Infix
  binding_power:
    - 23
    - 24
  child_shape:
    node_kind: choice_op
    arity: 2

# `=` — named-arrow definition (`name = expr`). Low binding power so the
# entire right-hand expression (including `>>>` / `|||`) binds to the
# definition. Right-associative (l < r) so chained definitions don't
# left-grab. Children: [name_identifier, expr].
- id: grammar.arrow.named_arrow.infix
  token: token.arrow.eq
  position: Infix
  binding_power:
    - 5
    - 6
  child_shape:
    node_kind: named_arrow
    arity: 2

# --- Prefix keyword combinators -----------------------------------------
# Each combinator keyword is a prefix rule whose single child is a
# delimited `( ... )` argument block. `flatten: true` splices the parsed
# argument nodes directly into the parent node's children (no intermediate
# container node), matching the main language's `call`/`array`/`paren`
# convention. `open_is_operator_token: false` because the prefix token is
# the keyword, not `(` — the delimited scanner consumes the `(` itself.

# `arr("name", args...)` — lift a named pure function. Children:
# [string_name, arg1, arg2, ...]. The string name is child 0.
- id: grammar.arrow.arr.prefix
  token: token.arrow.arr
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: arr_call
    arity: 1
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true

# `comp(a, b)` — sequential composition (same as `a >>> b`). Children:
# [fst, snd].
- id: grammar.arrow.comp.prefix
  token: token.arrow.comp
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: comp_call
    arity: 1
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true

# `first(a)` — fan-out on the first component of a pair. Children: [inner].
- id: grammar.arrow.first.prefix
  token: token.arrow.first
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: first_call
    arity: 1
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true

# `choice(a, b)` — arrow choice (same as `a ||| b`). Children: [l, r].
- id: grammar.arrow.choice.prefix
  token: token.arrow.choice
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: choice_call
    arity: 1
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true

# `loop { ... } ( params ~> body )` — rich-loop syntax. Arity 2: the first
# child is the `{ ... }` declaration block (parsed as a normal expression via
# the `lbrace` prefix rule), the second child is the `( params ~> body )`
# expression (parsed as a delimited `(...)` block, flattened so the proc
# expression splices directly into the loop node's children).
#
# NOTE: This replaces the simple `loop(body)` form. The simple form now
# falls through to the legacy ad-hoc parser (the data-driven Pratt parser
# fails because after consuming the `( body )` paren group as child 0, it
# expects a second `( ... )` delimited block which isn't there). This is
# acceptable — the legacy parser handles `loop(body)` correctly.
- id: grammar.arrow.loop.prefix
  token: token.arrow.loop
  position: Prefix
  binding_power:
    - 91
    - 0
  child_shape:
    node_kind: loop_rich
    arity: 2
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true

# `rec { ... } ( params ~> body )` — v0.1 rich-loop syntax (alias for `loop`).
# Same grammar rule as `loop` but with the `rec` keyword (ADR-0074).
- id: grammar.arrow.rec.prefix
  token: token.arrow.rec
  position: Prefix
  binding_power:
    - 91
    - 0
  child_shape:
    node_kind: loop_rich
    arity: 2
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true

# `app("name", args...)` — dynamic arrow application. Children:
# [string_name, arg1, arg2, ...]. The string name is child 0.
- id: grammar.arrow.app.prefix
  token: token.arrow.app
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: app_call
    arity: 1
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true

# --- Nullary atoms ------------------------------------------------------

# `id` — the identity arrow keyword. Nullary (no arguments, no parens).
- id: grammar.arrow.id.prefix
  token: token.arrow.id
  position: Prefix
  child_shape:
    node_kind: arrow_id
    arity: 0

# Bare identifier — a reference to a named arrow. Nullary; the identifier
# text rides in the node payload (like the main language's `var`).
- id: grammar.arrow.identifier.prefix
  token: token.arrow.identifier
  position: Prefix
  child_shape:
    node_kind: arrow_var
    arity: 0

# String literal — the name argument inside `arr("...")` / `app("...")`.
- id: grammar.arrow.string.prefix
  token: token.arrow.string
  position: Prefix
  child_shape:
    node_kind: arrow_string
    arity: 0

# --- Grouping -----------------------------------------------------------
# `(` as a prefix for parenthesized grouping: `( expr )`. The open delimiter
# IS the prefix token itself (open_is_operator_token: true), matching the
# main language's `grammar.paren.prefix`. flatten: true so the inner
# expression splices through.
- id: grammar.arrow.paren.prefix
  token: token.arrow.lparen
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: arrow_paren
    arity: 1
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: paren
      open_is_operator_token: true
      flatten: true

# `(` as an infix for function calls: `callee( args... )`. The open delimiter
# IS the infix token itself (open_is_operator_token: true). flatten: true so
# the callee and args splice directly into the `call` node's children.
# This enables `prim.compare(state.elem, h)` and `state.f(state.acc, h)`.
- id: grammar.arrow.call.infix
  token: token.arrow.lparen
  position: Infix
  binding_power:
    - 90
    - 91
  child_shape:
    node_kind: arrow_call
    arity: 2
    delimited:
      open: token.arrow.lparen
      close: token.arrow.rparen
      separator: token.arrow.comma
      container_kind: call
      open_is_operator_token: true
      flatten: true

# --- Rich-loop syntax grammar -------------------------------------------
# These rows handle the `loop { ... } ( state ~> match ... )` syntax.
# The rich-loop is SUGAR: the `loop_rich` node is special-cased in
# `ast_to_scheme` (arrow_parser.rs) which pattern-matches on the proc body
# AST to determine the corresponding `Scheme` graph. The eval schemes for
# these node kinds are placeholders — they exist so the Language loads
# without errors, but they are not walked for `loop_rich` nodes.

# `{ ... }` — block/object prefix. Used for declaration blocks
# (`{ elem: input.0, acc: input.1 }`), return value objects
# (`{ out: [state.elem] }`), and nested state objects. The open delimiter
# IS the prefix token (open_is_operator_token: true). Pair separator `:`
# creates `entry` nodes. flatten: true so entries splice into the parent.
# rest_token `...` allows spread elements like `{ ...rest }`.
- id: grammar.arrow.block.prefix
  token: token.arrow.lbrace
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: arrow_block
    arity: 1
    delimited:
      open: token.arrow.lbrace
      close: token.arrow.rbrace
      separator: ~
      container_kind: block
      pair:
        separator: token.arrow.colon
        node_kind: arrow_entry
      open_is_operator_token: true
      flatten: true
      rest_token: token.arrow.ellipsis

# `[ ... ]` — array/list prefix. Used for list patterns (`[]`, `[h, ...t]`)
# and list literals (`[state.elem]`, `[y, ...state.acc]`). The open delimiter
# IS the prefix token (open_is_operator_token: true). flatten: true so
# elements splice into the parent. rest_token `...` allows spread.
- id: grammar.arrow.array.prefix
  token: token.arrow.lbracket
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: arrow_array
    arity: 1
    delimited:
      open: token.arrow.lbracket
      close: token.arrow.rbracket
      separator: token.arrow.comma
      container_kind: array
      open_is_operator_token: true
      flatten: true
      rest_token: token.arrow.ellipsis

# `...` — spread/rest prefix. Used in list patterns (`[h, ...t]`) and list
# literals (`[y, ...state.acc]`). One child: the spread expression.
- id: grammar.arrow.ellipsis.prefix
  token: token.arrow.ellipsis
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: arrow_rest
    arity: 1

# `params ~> body` — proc/lambda expression. Arity 2: params (left operand)
# and body (right operand). The params are either a bare identifier
# (`state ~> ...`) or an array (`[xs, acc] ~> ...`). The `~>` infix operator
# has low binding power so the body extends as far right as possible.
- id: grammar.arrow.arrow.infix
  token: token.arrow.arrow
  position: Infix
  binding_power:
    - 1
    - 0
  child_shape:
    node_kind: arrow_proc
    arity: 2

# `match scrutinee { arms }` — match expression. Arity 2: scrutinee (normal
# child) and arms block (delimited `{ }` with pair separator `:` creating
# `arrow_arm` nodes). The arms block is NOT flattened (container_kind: block)
# so the match node has children [scrutinee, arms_container].
- id: grammar.arrow.match.prefix
  token: token.arrow.match
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: arrow_match
    arity: 2
    delimited:
      open: token.arrow.lbrace
      close: token.arrow.rbrace
      separator: token.arrow.comma
      container_kind: block
      pair:
        separator: token.arrow.colon
        node_kind: arrow_arm
      open_is_operator_token: false
      flatten: false

# `if cond body else body` — conditional. Arity 3. The `then` keyword is
# removed in v0.1 (ADR-0074); `!Optional` shifts `else` to separator index 1
# so it is consumed between child 1 and child 2. Mirrors the main language's
# `grammar.if.prefix`.
- id: grammar.arrow.if.prefix
  token: token.arrow.if
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: arrow_if
    arity: 3
    child_separators:
      - !Optional token.arrow.then
      - !Required token.arrow.else

# `do { stmt; stmt }` — do block. Arity 1: a delimited `{ }` block with `;`
# separator. flatten: true so statements splice into the `do` node.
- id: grammar.arrow.do.prefix
  token: token.arrow.do
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: arrow_do
    arity: 1
    delimited:
      open: token.arrow.lbrace
      close: token.arrow.rbrace
      separator: token.arrow.semicolon
      container_kind: block
      open_is_operator_token: false
      flatten: true

# `return expr` — provided by canonical grammar (grammar.return.prefix).
# Removed here to avoid collision (ADR-0079 unification).

# Number literal — for comparison values like `cmp <= 0`. Nullary; the
# number value rides in the node payload.
- id: grammar.arrow.number.prefix
  token: token.arrow.number
  position: Prefix
  child_shape:
    node_kind: arrow_number
    arity: 0

# --- Rich-loop infix operators ------------------------------------------

# `:` — pair separator infix. Used by the delimited block pair parser to
# determine the LHS binding power. BP (12, 13) — same as the main language's
# `type-annot`. The node_kind is `arrow_colon` but pair elements use the
# `arrow_entry`/`arrow_arm` node kinds from the delimited shape instead.
- id: grammar.arrow.colon.infix
  token: token.arrow.colon
  position: Infix
  binding_power:
    - 12
    - 13
  child_shape:
    node_kind: arrow_colon
    arity: 2

# ADR-0079: `in` let-in separator removed. Graph blocks replace it.
# The `grammar.arrow.in.infix` row is deleted.

# `<=` — less-than-or-equal comparison. `cmp <= 0`. BP (15, 16).
- id: grammar.arrow.le.infix
  token: token.arrow.le
  position: Infix
  binding_power:
    - 15
    - 16
  child_shape:
    node_kind: arrow_le
    arity: 2
# `<` — less-than comparison. `a < b`. BP (15, 16), same as `<=`.
- id: grammar.arrow.lt.infix
  token: token.arrow.lt
  position: Infix
  binding_power:
    - 15
    - 16
  child_shape:
    node_kind: arrow_lt
    arity: 2
