[package]
name = "handl-plugin-ext-refinement"
version.workspace = true
edition.workspace = true
description = "`handl-plugin-ext-refinement` -- annotation-free refinement inference for handl's `Term` IR."
license.workspace = true
repository.workspace = true

[features]
default = []
native-z3 = ["dep:z3"]

[dependencies]
handl-platform = { path = "../platform" }
handl-language = { path = "../handl-language" }
plugin-engine = { path = "../plugin-engine" }
handl-plugin-engine-lex-pattern = { path = "../plugin-engine-lex-pattern" }
handl-plugin-engine-parse = { path = "../plugin-engine-parse" }
handl-plugin-engine-parse-pratt = { path = "../plugin-engine-parse-pratt" }
handl-plugin-lib-handl = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
z3 = { version = "0.12", features = ["static-link-z3"], optional = true }

# `hnlc` lives under `examples/` (run: `cargo run -p handl-plugin-ext-refinement
# --example hnlc -- ...`) — it needs `handl-kit-data-canonical`, which is a
# dev-dependency now, and examples may use dev-deps while a `[[bin]]` cannot.
[dev-dependencies]
handl-kit-data-canonical = { workspace = true }
handl-plugin-lib-char-native = { workspace = true }
serde_json = { workspace = true }
