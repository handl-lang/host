[package]
name = "handl-plugin-ext-refinement"
version.workspace = true
edition.workspace = true
description = "`handl-plugin-ext-refinement` -- annotation-free refinement inference for handl's `Term` IR."
license.workspace = true
repository.workspace = true

[features]
default = []
native-z3 = ["dep:z3"]

[dependencies]
handl-platform = { path = "../platform" }
handl-plugin-ext-detect = { path = "../plugin-ext-detect" }
handl-language = { workspace = true }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
handl-plugin-lib-handl = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
z3 = { version = "0.12", features = ["static-link-z3"], optional = true }

# `hnlc` lives under `examples/` (run: `cargo run -p handl-plugin-ext-refinement
# --example hnlc -- ...`) — it needs `handl-kit-data-prelude`, which is a
# dev-dependency now, and examples may use dev-deps while a `[[bin]]` cannot.
[dev-dependencies]
handl-kit-data-prelude = { workspace = true }
# `handl-plugin-lib-char-native` dropped (T-044): the test only needed its
# `CHAR_HNL` const — `lib-char` is vendored by build.rs instead.
serde_json = { workspace = true }

[build-dependencies]
handl-pkg-vendor = { path = "../pkg-vendor" }