[package]
name = "handl-plugin-ext-refinement"
version.workspace = true
edition.workspace = true
description = "`handl-plugin-ext-refinement` -- annotation-free refinement inference for handl's `Term` IR."
license.workspace = true
repository.workspace = true

[features]
default = []
native-z3 = ["dep:z3"]

[dependencies]
handl-platform = { path = "../platform" }
handl-plugin-ext-detect = { path = "../plugin-ext-detect" }
handl-language = { workspace = true }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse = { git = "https://github.com/handl-lang/engine-parse", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
handl-plugin-lib-handl = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
z3 = { version = "0.12", features = ["static-link-z3"], optional = true }

# `hnlc` lives under `examples/` (run: `cargo run -p handl-plugin-ext-refinement
# --example hnlc -- ...`) — it needs `handl-kit-data-canonical`, which is a
# dev-dependency now, and examples may use dev-deps while a `[[bin]]` cannot.
[dev-dependencies]
handl-lib-collections = { workspace = true }
handl-kit-data-canonical = { workspace = true }
handl-plugin-lib-char-native = { git = "https://github.com/handl-lang/lib-char-native", branch = "main" }
serde_json = { workspace = true }