[package]
name = "handl-plugin-lib-ws-rfc-native"
version.workspace = true
edition.workspace = true
description = "Native RFC 6455 WebSocket client/server using tokio-tungstenite."

[features]
default = ["client", "server"]
client = []
server = []

[dependencies]
handl-plugin-lib-ws-rfc.workspace = true
handl-plugin-vm.workspace = true
handl-plugin-vm-common.workspace = true
handl-plugin-vm-values-json.workspace = true
handl-plugin-vm-backend-rust-interpreter.workspace = true
handl-plugin-vm-host-eval.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
futures-util = "0.3"
url = "2"

[dev-dependencies]
rcgen = "0.13"
