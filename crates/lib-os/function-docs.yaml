    description: Write `arg1` to the file at `arg0`.
    details: Create or overwrite the file at `arg0` with the string `arg1`.
    signature: 'fs.write(arg0: String, arg1: String)'
    params:
    - name: arg0
      type: String
      description: the 0th String argument
    - name: arg1
