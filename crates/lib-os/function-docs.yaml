    - fs.exists("x")
    see: []
  remove:
    description: Remove `arg0`.
    details: Remove `arg0`.
    signature: 'fs.remove(arg0: String)'
    params:
    - name: arg0
      type: String
      description: the 0th String argument
    return_value: 'null'
