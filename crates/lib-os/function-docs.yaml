sig:
  send:
    description: Send a signal to a process.
    details: Send the signal `arg0` to the process `arg1`.
    signature: 'sig.send(arg0: any, arg1: String)'
    params:
    - name: arg0
      type: any
      description: the 0th any argument
    - name: arg1
      type: String
      description: the 1th String argument
    return_value: 'null'
    examples:
    - sig.send("x", "x")
