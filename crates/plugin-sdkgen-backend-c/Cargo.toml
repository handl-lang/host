[package]
name = "handl-plugin-sdkgen-backend-c"
version.workspace = true
edition.workspace = true
description = "C / libclang backend for the Handl SDK generator (ADR-0107)."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-sdkgen = { path = "../plugin-sdkgen" }
clang-sys = { version = "1.9", features = ["runtime", "clang_20_0"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
glob = { workspace = true }
heck = { workspace = true }
target-lexicon = { workspace = true }
flate2 = "1.1"
