[package]
name = "handl-plugin-lib-handl"
version.workspace = true
edition.workspace = true
description = "A generic crate that lets `.hnl` files replace hand-rolled Rust `plugin-lib-*` bridge crates for pure-logic libraries."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-module = { path = "../plugin-module" }
handl-ops = { workspace = true }
handl-platform = { path = "../platform" }
handl-language = { workspace = true }
handl-runtime = { path = "../handl-runtime" }
handl-value = { workspace = true }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
hnl-exec = { git = "https://github.com/handl-lang/exec", branch = "main" }
hnl-exec-tree-walk = { git = "https://github.com/handl-lang/exec-tree-walk", branch = "main" }
hnl-exec-bytecode = { git = "https://github.com/handl-lang/exec-bytecode", branch = "main" }
hnl-tool-transform = { git = "https://github.com/handl-lang/tool-transform", branch = "main" }
handl-plugin-lib-char-native = { git = "https://github.com/handl-lang/lib-char-native", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
# P-013 phase-2a (proposal-0012): atom-provider self-registration —
# provider crates `inventory::submit!` an `AtomProvider`; dep binding
# collects them here. See `src/dep_atoms.rs`.
inventory = "0.3"
# P-013 phase-2c (proposal-0012): cdylib atom providers — `libhnl_ext_*`
# extensions whose manifest carries `atoms_yaml` are discovered through
# the ADR-0149 search path and serve atom calls over `handl_ext_dispatch`.
handl-ext = { workspace = true }

[build-dependencies]
handl-pkg-vendor = { path = "../pkg-vendor" }

[dev-dependencies]
handl-kit-data-prelude = { workspace = true }
hnl-exec = { git = "https://github.com/handl-lang/exec", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-tool-lex = { git = "https://github.com/handl-lang/tool-lex", branch = "main" }
hnl-tool-transform-rewrite = { git = "https://github.com/handl-lang/tool-transform-rewrite", branch = "main" }
# Cyclic dev-dep (stdlib's normal deps include this crate): tests consume the
# `TRANSFORM_*_HNL` `pub const` re-exports of `handl-packages/transform/`,
# which stdlib owns per ADR-0128 §".hnl ownership".
handl-plugin-lib-stdlib = { workspace = true }
tempfile = "3"
# P-013 phase-2c (proposal-0012): the cdylib atom-provider fixture —
# building it as a dev-dep produces `target/debug/libhnl_ext_atomfix.so`,
# which the cdylib_atoms tests load directly.
handl-plugin-lib-handl-fixture-atom = { path = "tests/fixtures/atom-provider" }