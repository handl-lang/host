[package]
name = "handl-plugin-lib-handl"
version.workspace = true
edition.workspace = true
description = "A generic crate that lets `.hnl` files replace hand-rolled Rust `plugin-lib-*` bridge crates for pure-logic libraries."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-module = { path = "../plugin-module" }
handl-platform = { path = "../platform" }
handl-language = { workspace = true }
handl-runtime = { path = "../handl-runtime" }
handl-value = { workspace = true }
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }
hnl-engine-exec-bytecode = { git = "https://github.com/handl-lang/engine-exec-bytecode", branch = "main" }
hnl-engine-transform = { git = "https://github.com/handl-lang/engine-transform", branch = "main" }
hnl-engine-lint = { git = "https://github.com/handl-lang/engine-lint", branch = "main" }
handl-plugin-lib-char-native = { git = "https://github.com/handl-lang/lib-char-native", branch = "main" }
# `.hnl` sources owned by their own repos (ADR-0128 §"1a").
handl-lib-str-handl = { workspace = true }
handl-lib-loader = { workspace = true }
handl-lib-desugar = { workspace = true }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
serde_json = { workspace = true }

[dev-dependencies]
handl-kit-data-prelude = { workspace = true }
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
hnl-engine-parse = { git = "https://github.com/handl-lang/engine-parse", branch = "main" }
hnl-engine-lex = { git = "https://github.com/handl-lang/engine-lex", branch = "main" }
hnl-engine-transform-rewrite = { git = "https://github.com/handl-lang/engine-transform-rewrite", branch = "main" }
handl-plugin-lib-char-native = { git = "https://github.com/handl-lang/lib-char-native", branch = "main" }
# Cyclic dev-dep (stdlib's normal deps include this crate): tests consume the
# `TRANSFORM_*_HNL` `pub const` re-exports of `handl-packages/transform/`,
# which stdlib owns per ADR-0128 §".hnl ownership".
handl-plugin-lib-stdlib = { workspace = true }