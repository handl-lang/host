[package]
name = "handl-plugin-lib-handl"
version.workspace = true
edition.workspace = true
description = "A generic crate that lets `.hnl` files replace hand-rolled Rust `plugin-lib-*` bridge crates for pure-logic libraries."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-module = { path = "../plugin-module" }
handl-platform = { path = "../platform" }
handl-language = { path = "../handl-language" }
handl-runtime = { path = "../handl-runtime" }
handl-value = { path = "../handl-value" }
handl-plugin-engine-lex-pattern = { path = "../plugin-engine-lex-pattern" }
handl-plugin-engine-parse-pratt = { path = "../plugin-engine-parse-pratt" }
handl-plugin-engine-exec = { path = "../plugin-engine-exec" }
handl-plugin-engine-exec-tree-walk = { path = "../plugin-engine-exec-tree-walk" }
handl-plugin-engine-exec-bytecode = { path = "../plugin-engine-exec-bytecode" }
handl-plugin-engine-transform = { path = "../plugin-engine-transform" }
handl-plugin-engine-lint = { path = "../plugin-engine-lint" }
plugin-engine = { path = "../plugin-engine" }
serde_json = { workspace = true }

[dev-dependencies]
handl-kit-data-canonical = { workspace = true }
handl-plugin-engine-exec = { path = "../plugin-engine-exec" }
handl-plugin-engine-transform-rewrite = { path = "../plugin-engine-transform-rewrite" }
handl-plugin-lib-char-native = { workspace = true }
# Cyclic dev-dep (stdlib's normal deps include this crate): tests consume the
# `TRANSFORM_*_HNL` `pub const` re-exports of `handl-packages/transform/`,
# which stdlib owns per ADR-0128 §".hnl ownership".
handl-plugin-lib-stdlib = { workspace = true }
