[package]
name = "handl-kit-stdlib"
version.workspace = true
edition.workspace = true
description = "Stdlib kit — data-format, codec, and utility .hnl modules (json/tar/url/kv/perlin/simplex/collections)."
license.workspace = true
repository.workspace = true
keywords = ["handl", "kit", "stdlib"]
categories = ["development-tools"]

[dependencies]
handl-kit-core = { workspace = true }
handl-kit-data = { workspace = true }
handl-platform = { workspace = true }
handl-plugin-lib-handl = { workspace = true }
handl-plugin-lib-stdlib = { workspace = true }
handl-plugin-lib-kv-hashmap = { workspace = true }
# Native `ip.*` backend — the `ip` module's op registry is spec-driven
# (`lib-ip-c/atoms.yaml` + `ip_impls()`), attached in `build_ip_module`.
handl-plugin-lib-ip-c = { workspace = true }
# `handl-lib-{base64,hex,serialize}` dropped (T-044): the `.hnl` modules are
# vendored by build.rs (`handl-pkg-vendor`) — no crate dep needed.

[build-dependencies]
handl-pkg-vendor = { path = "../pkg-vendor" }
