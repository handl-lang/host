[package]
name = "handl-host-tooling"
version.workspace = true
edition.workspace = true

[dependencies]
handl-kit-canonical.workspace = true
handl-language.workspace = true
handl-platform.workspace = true
handl-plugin-ext-diag = { path = "../plugin-ext-diag" }
handl-plugin-ext-fmt = { path = "../plugin-ext-fmt" }
handl-plugin-ext-lint = { path = "../plugin-ext-lint" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

[dev-dependencies]
handl-plugin-loader-native.workspace = true
# The native fixture cdylib `tests/loader.rs` loads. It is a dependency purely so
# cargo *builds* it: without this the test could not find the `.so` in
# `target/debug/` and silently early-returned, passing without testing anything.
handl-plugin-loader-native-fixture-echo = { path = "../plugin-loader-native/tests/fixtures/native-echo" }
