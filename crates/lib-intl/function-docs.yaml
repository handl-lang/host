intl:
  format_number:
    description: '`intl.format_number(n: number, locale?: string, opts?: object) → string`  Formats a number using locale-aware
      decimal and thousands separators via ICU4X'
    details: '`intl.format_number(n: number, locale?: string, opts?: object) → string`  Formats a number using locale-aware
      decimal and thousands separators via ICU4X.  Options: - `style`: `"decimal"` (default), `"percent"`, `"currency"`, or
      `"unit"` - `currency`: 3-letter ISO 4217 code (required when `style: "currency"`) - `currencyDisplay`: `"symbol"` (default),
      `"narrowSymbol"`, `"code"`, or `"name"` - `currencySign`: `"standard"` (default) or `"accounting"` (for negative values,
      uses parentheses) - `notation`: `"standard"` (default), `"compact"`, `"scientific"`, or `"engineering"` - `compactDisplay`:
      `"short"` (default) or `"long"` (for compact notation) - `minimumIntegerDigits`: minimum integer digits to display (pads
      with leading zeros) - `minimumFractionDigits`: minimum fraction digits to display - `maximumFractionDigits`: maximum
      fraction digits to display - `minimumSignificantDigits`: minimum significant digits - `maximumSignificantDigits`: maximum
      significant digits - `useGrouping`: `true` (default), `false`, `"auto"`, `"always"`, `"min2"` - `unit`: sanctioned unit
      identifier (e.g. `"meter"`, `"kilometer-per-hour"`) — required when `style: "unit"` - `unitDisplay`: `"short"` (default),
      `"narrow"`, or `"long"` (for `style: "unit"`) - `signDisplay`: `"auto"` (default), `"always"`, `"never"`, `"exceptZero"`,
      `"negative"` - `roundingMode`: `"halfEven"` (default), `"ceil"`, `"floor"`, `"expand"`, `"trunc"`, `"halfCeil"`, `"halfExpand"`,
      `"halfFloor"`, `"halfTrunc"`  Examples: - `intl.format_number(1234567.89)` → `"1,234,567.89"` - `intl.format_number(1234567.89,
      "pt-BR")` → `"1.234.567,89"` - `intl.format_number(0.5, "en", {style: "percent"})` → `"50%"` - `intl.format_number(1234.56,
      "en", {style: "currency", currency: "USD"})` → `"$1,234.56"` - `intl.format_number(1000007, "bn")` → `"১০,০০,০০৭"` -
      `intl.format_number(1000000, "en", {notation: "compact"})` → `"1M"`'
    signature: intl.format_number()
    params: []
    return_value: type.any
    examples:
    - intl.format_number(1234567.89)
    - intl.format_number(1234567.89, "pt-BR")
    - 'intl.format_number(0.5, "en", {style: "percent"})'
    - 'intl.format_number(1234.56, "en", {style: "currency", currency: "USD"})'
    - intl.format_number(1000007, "bn")
    - 'intl.format_number(1000000, "en", {notation: "compact"})'
    see: []
  format_number_to_parts:
    description: '`intl.format_number_to_parts(n: number, locale?: string, opts?: object) → array`  Like [`FormatNumber`],
      but returns an array of `{ type, value }` objects instead of a flat string'
    details: '`intl.format_number_to_parts(n: number, locale?: string, opts?: object) → array`  Like [`FormatNumber`], but
      returns an array of `{ type, value }` objects instead of a flat string. Uses ICU4X `write_to_parts` APIs to produce
      structured part annotations (e.g. `"integer"`, `"group"`, `"decimal"`, `"fraction"`, `"minusSign"`, `"plusSign"`).'
    signature: intl.format_number_to_parts()
    params: []
    return_value: type.any
    examples:
    - intl.format_number_to_parts()
    see: []
  select_plural:
    description: '`intl.select_plural(n: number, locale?: string, opts?: object) → string`  Returns the CLDR plural category
      for a number in the given locale'
    details: '`intl.select_plural(n: number, locale?: string, opts?: object) → string`  Returns the CLDR plural category for
      a number in the given locale.  Options: - `type`: `"cardinal"` (default) or `"ordinal"` - `minimumIntegerDigits`: minimum
      integer digits - `minimumFractionDigits`: minimum fraction digits to display - `maximumFractionDigits`: maximum fraction
      digits to display - `minimumSignificantDigits`: minimum significant digits - `maximumSignificantDigits`: maximum significant
      digits  Examples: - `intl.select_plural(1)` → `"one"` - `intl.select_plural(5)` → `"other"` - `intl.select_plural(0,
      "ar")` → `"zero"` - `intl.select_plural(2, "en", {type: "ordinal"})` → `"two"` - `intl.select_plural(11, "en", {type:
      "ordinal"})` → `"other"` - `intl.select_plural(1.0, "en")` → `"other"` (trailing zero → not "one") - `intl.select_plural(1,
      "en", {minimumFractionDigits: 2})` → `"other"` (padded to 1.00)'
    signature: intl.select_plural()
    params: []
    return_value: String
    examples:
    - intl.select_plural(1)
    - intl.select_plural(5)
    - intl.select_plural(0, "ar")
    - 'intl.select_plural(2, "en", {type: "ordinal"})'
    - 'intl.select_plural(11, "en", {type: "ordinal"})'
    - intl.select_plural(1.0, "en")
    - 'intl.select_plural(1, "en", {minimumFractionDigits: 2})'
    see: []
  format_list:
    description: '`intl.format_list(items: array, locale?: string, opts?: object) → string`  Formats a list of strings using
      ICU4X'
    details: '`intl.format_list(items: array, locale?: string, opts?: object) → string`  Formats a list of strings using ICU4X.  Options:
      - `type`: `"conjunction"` (default), `"disjunction"`, or `"unit"` - `style`: `"long"` (default), `"short"`, or `"narrow"`  Examples:
      - `intl.format_list(["a", "b", "c"])` → `"a, b, and c"` - `intl.format_list(["a", "b", "c"], "en", {type: "disjunction"})`
      → `"a, b, or c"` - `intl.format_list(["5", "7"], "en", {type: "unit"})` → `"5, 7"`'
    signature: intl.format_list()
    params: []
    return_value: type.any
    examples:
    - intl.format_list(["a", "b", "c"])
    - 'intl.format_list(["a", "b", "c"], "en", {type: "disjunction"})'
    - 'intl.format_list(["5", "7"], "en", {type: "unit"})'
    see: []
  format_relative_time:
    description: '`intl.format_relative_time(value: number, unit: string, locale?: string, opts?: object) → string`  Formats
      a relative time using ICU4X'
    details: '`intl.format_relative_time(value: number, unit: string, locale?: string, opts?: object) → string`  Formats a
      relative time using ICU4X.  `unit` must be one of: `"second"`, `"minute"`, `"hour"`, `"day"`, `"week"`, `"month"`, `"quarter"`,
      `"year"`.  Options: - `style`: `"long"` (default), `"short"`, or `"narrow"` - `numeric`: `"always"` (default) or `"auto"`
      (e.g. "yesterday" instead of "-1 days")  Examples: - `intl.format_relative_time(5, "second")` → `"in 5 seconds"` - `intl.format_relative_time(-10,
      "second")` → `"10 seconds ago"` - `intl.format_relative_time(2, "day", "es", {numeric: "auto"})` → `"pasado mañana"`
      - `intl.format_relative_time(3, "year", "bn")` → `"৩ বছরে"`'
    signature: intl.format_relative_time()
    params: []
    return_value: String
    examples:
    - intl.format_relative_time(5, "second")
    - intl.format_relative_time(-10, "second")
    - 'intl.format_relative_time(2, "day", "es", {numeric: "auto"})'
    - intl.format_relative_time(3, "year", "bn")
    see: []
  format_date:
    description: '`intl.format_date(date: string, locale?: string, opts?: object) → string`  Formats a date, time, or datetime
      string using ICU4X'
    details: '`intl.format_date(date: string, locale?: string, opts?: object) → string`  Formats a date, time, or datetime
      string using ICU4X.  `date` must be an ISO 8601 string: `"YYYY-MM-DD"`, `"HH:MM:SS"`, or `"YYYY-MM-DDTHH:MM:SS"`. Timezone
      offsets (e.g. `+05:30`, `Z`) are parsed and used when `timeZoneName` is set in the options. Fractional seconds (e.g.
      `.123`, `.123456`) are extracted and used when `fractionalSecondDigits` is set.  Options: - `style`: `"full"`, `"long"`,
      `"medium"` (default), or `"short"` - `type`: `"date"` (default), `"datetime"`, or `"time"` - `hourCycle`: `"h11"`, `"h12"`,
      `"h23"`, or `"h24"` - `hour12`: boolean — when `true` uses 12-hour cycle, when `false` uses 24-hour. Ignored if `hourCycle`
      is set. - `calendar`: `"gregory"` (default), `"buddhist"`, `"chinese"`, `"coptic"`, `"ethiopic"`, `"hebrew"`, `"indian"`,
      `"islamic"`, `"japanese"`, `"persian"`, `"roc"` - `fractionalSecondDigits`: 1, 2, or 3 (number of fractional second
      digits)  ECMA-402 individual field options (when any of these are present, they override `style` and `type`): - `year`:
      `"numeric"`, `"2-digit"`, `"narrow"`, `"short"`, `"long"` - `month`: `"numeric"`, `"2-digit"`, `"narrow"`, `"short"`,
      `"long"` - `day`: `"numeric"`, `"2-digit"` - `weekday`: `"narrow"`, `"short"`, `"long"` - `hour`: `"numeric"`, `"2-digit"`
      - `minute`: `"numeric"`, `"2-digit"` - `second`: `"numeric"`, `"2-digit"` - `era`: `"narrow"`, `"short"`, `"long"` -
      `timeZoneName`: `"short"`, `"long"`, `"shortOffset"`, `"longOffset"`, `"shortGeneric"`, `"longGeneric"`  Examples: -
      `intl.format_date("2024-05-08")` → `"May 8, 2024"` - `intl.format_date("2024-05-08", "de")` → `"8. Mai 2024"` - `intl.format_date("2024-05-08T14:30:00",
      "en", {type: "datetime"})` → `"May 8, 2024, 2:30:00 PM"` - `intl.format_date("14:30:00", "en", {type: "time"})` → `"2:30:00
      PM"`'
    signature: intl.format_date()
    params: []
    return_value: String
    examples:
    - intl.format_date("2024-05-08")
    - intl.format_date("2024-05-08", "de")
    - 'intl.format_date("2024-05-08T14:30:00", "en", {type: "datetime"})'
    - 'intl.format_date("14:30:00", "en", {type: "time"})'
    see: []
  format_date_to_parts:
    description: '`intl.format_date_to_parts(date: string, locale?: string, opts?: object) → array`  Like [`FormatDate`],
      but returns an array of `{ type, value }` objects instead of a flat string'
    details: '`intl.format_date_to_parts(date: string, locale?: string, opts?: object) → array`  Like [`FormatDate`], but
      returns an array of `{ type, value }` objects instead of a flat string. Uses ICU4X `write_to_parts` APIs to produce
      structured part annotations (e.g. `"year"`, `"month"`, `"day"`, `"hour"`, `"minute"`, `"second"`, `"literal"`).'
    signature: intl.format_date_to_parts()
    params: []
    return_value: type.any
    examples:
    - intl.format_date_to_parts()
    see: []
  format_duration:
    description: '`intl.format_duration(duration: object, locale?: string, opts?: object) → string`  Formats a duration using
      ICU4X'
    details: '`intl.format_duration(duration: object, locale?: string, opts?: object) → string`  Formats a duration using
      ICU4X.  `duration` is an object with any of: `years`, `months`, `weeks`, `days`, `hours`, `minutes`, `seconds`, `milliseconds`,
      `microseconds`, `nanoseconds`.  Options: - `style`: `"long"` (default), `"short"`, `"narrow"`, `"digital"` - Per-unit
      style: `yearsStyle`, `monthsStyle`, `weeksStyle`, `daysStyle`,   `hoursStyle`, `minutesStyle`, `secondsStyle`, `millisecondsStyle`,   `microsecondsStyle`,
      `nanosecondsStyle` — each `"long"`, `"short"`,   `"narrow"`, and for time units also `"numeric"` / `"2-digit"` - Per-unit
      display: `yearsDisplay`, `monthsDisplay`, etc. — `"auto"` (default) or `"always"` - `fractionalDigits`: number of fractional
      digits for sub-second units  Examples: - `intl.format_duration({hours: 1, minutes: 30})` → `"1 hour, 30 minutes"` -
      `intl.format_duration({seconds: 90}, "es")` → `"90 segundos"` - `intl.format_duration({hours: 2, minutes: 5}, "en",
      {style: "short"})` → `"2 hr, 5 min"` - `intl.format_duration({hours: 2}, "en", {hoursStyle: "long"})` → `"2 hours"`'
    signature: intl.format_duration()
    params: []
    return_value: type.any
    examples:
    - 'intl.format_duration({hours: 1, minutes: 30})'
    - 'intl.format_duration({seconds: 90}, "es")'
    - 'intl.format_duration({hours: 2, minutes: 5}, "en", {style: "short"})'
    - 'intl.format_duration({hours: 2}, "en", {hoursStyle: "long"})'
    see: []
  compare_strings:
    description: '`intl.compare_strings(a: string, b: string, locale?: string, opts?: object) → number`  Compares two strings
      using ICU4X collation'
    details: '`intl.compare_strings(a: string, b: string, locale?: string, opts?: object) → number`  Compares two strings
      using ICU4X collation.  Returns `-1` if `a < b`, `0` if `a == b`, `1` if `a > b`.  Options: - `sensitivity`: `"base"`,
      `"accent"`, `"case"`, or `"variant"` (default) - `caseFirst`: `"upper"`, `"lower"`, or `"false"` (default) - `numeric`:
      `true` or `false` (default) — sorts digit sequences by numeric value - `ignorePunctuation`: `true` or `false` (default)
      - `usage`: `"sort"` (default) or `"search"` — selects sort vs search collation - `collation`: collation variant string
      (e.g. `"phonebk"` for German phonebook)  Examples: - `intl.compare_strings("a", "b")` → `-1` - `intl.compare_strings("é",
      "e", "en", {sensitivity: "base"})` → `0` - `intl.compare_strings("file10", "file2", "en", {numeric: true})` → `1`'
    signature: intl.compare_strings()
    params: []
    return_value: type.any
    examples:
    - intl.compare_strings("a", "b")
    - 'intl.compare_strings("é", "e", "en", {sensitivity: "base"})'
    - 'intl.compare_strings("file10", "file2", "en", {numeric: true})'
    see: []
  display_name:
    description: '`intl.display_name(code: string, type: string, locale?: string, opts?: object) → string`  Returns the display
      name for a language, region, script, variant, currency, calendar, or dateTimeField code'
    details: '`intl.display_name(code: string, type: string, locale?: string, opts?: object) → string`  Returns the display
      name for a language, region, script, variant, currency, calendar, or dateTimeField code.  `type` must be one of: `"language"`,
      `"region"`, `"script"`, `"variant"`, `"currency"`, `"calendar"`, or `"dateTimeField"`.  Options: - `style`: `"long"`
      (default), `"short"`, or `"narrow"` - `fallback`: `"code"` (default) or `"none"` (returns error if not found) - `languageDisplay`:
      `"dialect"` (default) or `"standard"` (for `type: "language"`)  **Note:** `calendar` and `dateTimeField` types return
      English-only display names using static CLDR-based fallbacks. ICU4X does not yet expose locale-aware APIs for these
      types. The `locale` argument is ignored for these types.  Examples: - `intl.display_name("en", "language", "pt")` →
      `"Inglês"` - `intl.display_name("US", "region", "en")` → `"United States"` - `intl.display_name("US", "region", "en",
      {style: "short"})` → `"US"` - `intl.display_name("Latn", "script", "en")` → `"Latin"` - `intl.display_name("fonipa",
      "variant", "en")` → `"IPA Phonetics"`'
    signature: intl.display_name()
    params: []
    return_value: type.any
    examples:
    - intl.display_name("en", "language", "pt")
    - intl.display_name("US", "region", "en")
    - 'intl.display_name("US", "region", "en", {style: "short"})'
    - intl.display_name("Latn", "script", "en")
    - intl.display_name("fonipa", "variant", "en")
    see: []
  segment:
    description: '`intl.segment(text: string, granularity: string, locale?: string, opts?: object) → array`  Segments text
      using ICU4X'
    details: '`intl.segment(text: string, granularity: string, locale?: string, opts?: object) → array`  Segments text using
      ICU4X.  `granularity` must be one of: `"grapheme"`, `"word"`, `"sentence"`, or `"line"`.  Returns an array of segment
      objects with `segment` (string), `index` (number), and `isWordLike` (boolean, only for word granularity).  Options (for
      `granularity: "line"`): - `lineBreakStyle`: `"strict"`, `"normal"`, `"loose"`, or `"anywhere"` (default: ICU4X default)
      - `lineBreakWord`: `"normal"`, `"break-all"`, or `"keep-all"` (default: `"normal"`)  Examples: - `intl.segment("hello
      world", "word")` → `[{segment: "hello", index: 0, isWordLike: true}, ...]` - `intl.segment("こんにちは", "grapheme", "ja")`
      → 5 segments - `intl.segment("Hello World", "line", "ja", {lineBreakStyle: "loose"})` → line segments with loose breaking'
    signature: intl.segment()
    params: []
    return_value: type.any
    examples:
    - intl.segment("hello world", "word")
    - intl.segment("こんにちは", "grapheme", "ja")
    - 'intl.segment("Hello World", "line", "ja", {lineBreakStyle: "loose"})'
    see: []
  supported_locales_of:
    description: '`intl.supported_locales_of(locales: string | string[]) → string[]`  Filters the requested locales to those
      supported by the available data'
    details: '`intl.supported_locales_of(locales: string | string[]) → string[]`  Filters the requested locales to those supported
      by the available data. With the default compiled provider, uses a hardcoded list of supported languages. With a blob
      provider, queries the blob''s actual locale inventory via `DecimalSymbolsV1` data identifiers — does not claim support
      for locales the blob doesn''t contain. Uses best-fit matching (language subtag match).  Examples: - `intl.supported_locales_of("en")`
      → `["en"]` - `intl.supported_locales_of(["de", "xxx"])` → `["de"]`'
    signature: intl.supported_locales_of()
    params: []
    return_value: type.any
    examples:
    - intl.supported_locales_of("en")
    - intl.supported_locales_of(["de", "xxx"])
    see: []
  get_canonical_locales:
    description: '`intl.get_canonical_locales(locales: string | string[]) → string[]`  Returns the canonicalized form of the
      given locale or list of locales'
    details: '`intl.get_canonical_locales(locales: string | string[]) → string[]`  Returns the canonicalized form of the given
      locale or list of locales.  Examples: - `intl.get_canonical_locales("en-us")` → `["en-US"]` - `intl.get_canonical_locales(["de",
      "ja-jp"])` → `["de", "ja-JP"]`'
    signature: 'intl.get_canonical_locales(arg0: Array)'
    params:
    - name: arg0
      type: Array
      description: the 0th Array argument
    return_value: type.any
    examples:
    - intl.get_canonical_locales("en-us")
    - intl.get_canonical_locales(["de", "ja-jp"])
    see: []
  locale:
    description: '`intl.locale(tag: string, opts?: object) → object`  Parses a BCP 47 locale tag and returns an object with
      its components'
    details: '`intl.locale(tag: string, opts?: object) → object`  Parses a BCP 47 locale tag and returns an object with its
      components.  This is equivalent to `Intl.Locale` in the ECMA-402 spec.  Options: - `language`: override the language
      subtag - `script`: override the script subtag - `region`: override the region subtag - `calendar`: add a `-u-ca-` extension
      - `numberingSystem`: add a `-u-nu-` extension - `hourCycle`: add a `-u-hc-` extension (`"h11"`, `"h12"`, `"h23"`, `"h24"`)  Returns
      an object with: - `baseName`: the canonical locale identifier (e.g. `"en-US"`) - `language`: the language subtag (e.g.
      `"en"`) - `script`: the script subtag (e.g. `"Latn"`), or `null` - `region`: the region subtag (e.g. `"US"`), or `null`
      - `calendar`: the calendar extension, or `null` - `numberingSystem`: the numbering system extension, or `null` - `hourCycle`:
      the hour cycle extension, or `null`  Examples: - `intl.locale("en-US")` → `{baseName: "en-US", language: "en", script:
      null, region: "US", ...}` - `intl.locale("zh-Hant-TW")` → `{baseName: "zh-Hant-TW", language: "zh", script: "Hant",
      region: "TW", ...}` - `intl.locale("en", {region: "GB"})` → `{baseName: "en-GB", language: "en", script: null, region:
      "GB", ...}`'
    signature: intl.locale()
    params: []
    return_value: type.any
    examples:
    - intl.locale("en-US")
    - intl.locale("zh-Hant-TW")
    - 'intl.locale("en", {region: "GB"})'
    see: []
