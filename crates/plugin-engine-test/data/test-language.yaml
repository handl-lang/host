# Test-language fragment for ADR-0089.
#
# Merged onto the canonical kit at test-discovery time. This fragment adds
# the `test`, `property`, `integration_test`, and `bench` declaration forms
# without amending the core grammar (ADR-0044 language-as-data model).
#
# Surface syntax:
#
#   test name = body
#   property name = body
#   integration_test name = body
#   bench name = body
#   assert expr = expr       -- keyword assertion
#
# Each declaration parses to a node with named children (`name`/`body` for
# the test kinds, `expr` for `assert`). The eval scheme returns the `body`
# child for test kinds; `assert` returns `result.ok(true)` on success and
# `result.err({message, expected, actual, diff})` on failure (ADR-0077,
# ADR-0089).

---
tokens:
  - id: token.keyword.test
    label: test
  - id: token.keyword.property
    label: property
  - id: token.keyword.integration_test
    label: integration_test
  - id: token.keyword.bench
    label: bench
  - id: token.keyword.assert
    label: assert

lexer_rules:
  - id: lex.keyword.test
    token_kind: token.keyword.test
    pattern: !Literal
      text: test
    priority: 15
  - id: lex.keyword.property
    token_kind: token.keyword.property
    pattern: !Literal
      text: property
    priority: 15
  - id: lex.keyword.integration_test
    token_kind: token.keyword.integration_test
    pattern: !Literal
      text: integration_test
    priority: 15
  - id: lex.keyword.bench
    token_kind: token.keyword.bench
    pattern: !Literal
      text: bench
    priority: 15
  - id: lex.keyword.assert
    token_kind: token.keyword.assert
    pattern: !Literal
      text: assert
    priority: 15

grammar:
  - id: grammar.test.prefix
    token: token.keyword.test
    position: Prefix
    binding_power:
      # 6 > assign's lbp (5) so the name child stops before the `=`
      # separator (same trick as the `data` row in the canonical grammar).
      - 6
      - 0
    child_shape:
      node_kind: test
      arity: 2
      child_separators:
        - !Required token.bind
  - id: grammar.property.prefix
    token: token.keyword.property
    position: Prefix
    binding_power:
      # 6 > assign's lbp (5) so the name child stops before the `=`
      # separator (same trick as the `data` row in the canonical grammar).
      - 6
      - 0
    child_shape:
      node_kind: property
      arity: 2
      child_separators:
        - !Required token.bind
  - id: grammar.integration_test.prefix
    token: token.keyword.integration_test
    position: Prefix
    binding_power:
      # 6 > assign's lbp (5) so the name child stops before the `=`
      # separator (same trick as the `data` row in the canonical grammar).
      - 6
      - 0
    child_shape:
      node_kind: integration_test
      arity: 2
      child_separators:
        - !Required token.bind
  - id: grammar.bench.prefix
    token: token.keyword.bench
    position: Prefix
    binding_power:
      # 6 > assign's lbp (5) so the name child stops before the `=`
      # separator (same trick as the `data` row in the canonical grammar).
      - 6
      - 0
    child_shape:
      node_kind: bench
      arity: 2
      child_separators:
        - !Required token.bind
  - id: grammar.assert.prefix
    token: token.keyword.assert
    position: Prefix
    binding_power:
      # 0 < assign's lbp (5) so the child can consume an `=` separator
      # (e.g. `assert 1 + 1 = 2`).
      - 0
      - 0
    child_shape:
      node_kind: assert
      arity: 1

ast:
  - id: ast.test
    node_kind: test
    children:
      - role: name
      - role: body
    payload_schema:
      properties:
        children:
          items:
            type: integer
          maxItems: 2
          minItems: 2
          type: array
      required:
        - children
      type: object
  - id: ast.property
    node_kind: property
    children:
      - role: name
      - role: body
    payload_schema:
      properties:
        children:
          items:
            type: integer
          maxItems: 2
          minItems: 2
          type: array
      required:
        - children
      type: object
  - id: ast.integration_test
    node_kind: integration_test
    children:
      - role: name
      - role: body
    payload_schema:
      properties:
        children:
          items:
            type: integer
          maxItems: 2
          minItems: 2
          type: array
      required:
        - children
      type: object
  - id: ast.bench
    node_kind: bench
    children:
      - role: name
      - role: body
    payload_schema:
      properties:
        children:
          items:
            type: integer
          maxItems: 2
          minItems: 2
          type: array
      required:
        - children
      type: object
  - id: ast.assert
    node_kind: assert
    children:
      - role: expr
    payload_schema:
      properties:
        children:
          items:
            type: integer
          maxItems: 1
          minItems: 1
          type: array
      required:
        - children
      type: object

eval:
  - id: eval.test
    node_kind: test
    scheme: !Op
      name: proj_child
      args: []
      source: Native
      lit: 1
  - id: eval.property
    node_kind: property
    scheme: !Op
      name: proj_child
      args: []
      source: Native
      lit: 1
  - id: eval.integration_test
    node_kind: integration_test
    scheme: !Op
      name: proj_child
      args: []
      source: Native
      lit: 1
  - id: eval.bench
    node_kind: bench
    scheme: !Op
      name: proj_child
      args: []
      source: Native
      lit: 1
  - id: eval.assert
    node_kind: assert
    scheme: !Op
      name: assert
      args: []
      source: Native
