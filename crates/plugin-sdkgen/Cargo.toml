[package]
name = "handl-plugin-sdkgen"
version.workspace = true
edition.workspace = true
description = "Handl SDK generator core IR and traits (ADR-0107)."
license.workspace = true
repository.workspace = true

[dependencies]
# `SdkgenRequest` carries the language emitted sources canonicalize
# against (ADR-0128 §0.1 — the target registry lives on the port).
handl-language = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ureq = "2"

[dev-dependencies]
serde_json = { workspace = true }
