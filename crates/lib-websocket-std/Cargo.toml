[package]
name = "handl-lib-websocket-std"
version.workspace = true
edition.workspace = true
description = "Native RFC 6455 WebSocket client/server using tokio-tungstenite."

[dependencies]
handl-lib-websocket.workspace = true
handl-vm.workspace = true
handl-vm-common.workspace = true
handl-vm-values-json.workspace = true
handl-vm-backend-rust-interpreter.workspace = true
handl-vm-host-eval.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
