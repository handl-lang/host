[package]
name = "handl-plugin-lib-concurrent"
version.workspace = true
edition.workspace = true

[dependencies]
handl-platform = { workspace = true }
handl-plugin-vm-values-json.workspace = true
handl-plugin-vm-common.workspace = true
serde_json.workspace = true
parking_lot = "0.12"
crossbeam-deque = "0.8"
mio = { version = "1", features = ["net", "os-poll"] }
handl-plugin-vm-backend-rust-interpreter = { workspace = true, optional = true }
handl-plugin-vm-host-eval = { workspace = true, optional = true }

[features]
e2e = ["dep:handl-plugin-vm-backend-rust-interpreter", "dep:handl-plugin-vm-host-eval"]

[dev-dependencies]
criterion = "0.5.1"
proptest = "1.6"
loom = "0.7"

[[bench]]
name = "concurrent"
path = "benches/concurrent.rs"
harness = false
