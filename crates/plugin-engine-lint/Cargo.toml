[package]
name = "handl-plugin-engine-lint"
version.workspace = true
edition.workspace = true
description = "The data-driven AST lint engine (ADR-0044 §3). Walks an [`Ast`] using [`handl_language::Language`] data to produce expression-level diagnostics."
license.workspace = true
repository.workspace = true

[dependencies]
handl-language = { workspace = true }
handl-plugin-ext-diag = { path = "../plugin-ext-diag" }
handl-plugin-engine-lex-pattern = { path = "../plugin-engine-lex-pattern" }
handl-plugin-engine-parse = { path = "../plugin-engine-parse" }
handl-plugin-engine-parse-pratt = { path = "../plugin-engine-parse-pratt" }
handl-plugin-engine-transform-rewrite = { path = "../plugin-engine-transform-rewrite" }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
