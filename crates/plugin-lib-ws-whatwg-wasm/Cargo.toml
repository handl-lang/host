[package]
name = "handl-plugin-lib-ws-whatwg-wasm"
version.workspace = true
edition.workspace = true
description = "WASM WHATWG WebSocket client module for the handl runtime."

[dependencies]
handl-plugin-module = { path = "../plugin-module" }
handl-plugin-lib-handl = { path = "../plugin-lib-handl" }
handl-platform = { workspace = true }
serde = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "BinaryType",
  "Event",
  "Blob",
] }
