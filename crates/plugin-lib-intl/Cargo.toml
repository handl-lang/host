[package]
name = "handl-plugin-lib-intl"
version.workspace = true
edition.workspace = true

[dependencies]
handl-plugin-module = { path = "../plugin-module" }
handl-plugin-lib-handl = { path = "../plugin-lib-handl" }
handl-platform = { workspace = true }
serde_json = "1"
icu = { version = "=2.3.1", features = ["unstable", "serde"] }
icu_provider_blob = { version = "=2.3.0", features = ["alloc"] }
icu_provider = "=2.3.1"
writeable = "0.6"
fixed_decimal = { version = "0.7", features = ["ryu"] }

[dev-dependencies]
serde_json = "1"
