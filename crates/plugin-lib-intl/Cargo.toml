[package]
name = "handl-plugin-lib-intl"
version.workspace = true
edition.workspace = true

[dependencies]
handl-platform = { workspace = true }
handl-plugin-vm-common.workspace = true
handl-plugin-vm.workspace = true
handl-plugin-vm-backend-rust-interpreter.workspace = true
handl-plugin-vm-values-json.workspace = true
serde_json = "1"
icu = { version = "=2.3.1", features = ["unstable", "serde"] }
icu_provider_blob = { version = "=2.3.0", features = ["alloc"] }
icu_provider = "=2.3.1"
writeable = "0.6"
fixed_decimal = { version = "0.7", features = ["ryu"] }
ecma402_icu4x = { package = "crate-ecma402-icu4x", path = "../crate-ecma402-icu4x" }
ecma402_traits = { package = "crate-ecma402-traits", path = "../crate-ecma402-traits" }
icu4x_extra = { package = "crate-icu4x-extra", path = "../crate-icu4x-extra" }

[dev-dependencies]
handl-plugin-ast.workspace = true
handl-plugin-vm-host-eval.workspace = true
handl-plugin-vm-common.workspace = true
handl-plugin-vm-values-json.workspace = true
handl-plugin-vm.workspace = true
serde_json = "1"
