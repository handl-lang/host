[package]
name = "handl-kit-mlopt"
version.workspace = true
edition.workspace = true
description = "mlopt kit — meta-tier pipeline stage-ops (lift/search/verify) as a native `pipeline` module, backed by `python -m mlopt stage <name>` over a JSON stdin/stdout protocol."
license.workspace = true
repository.workspace = true
keywords = ["handl", "kit", "mlopt"]
categories = ["development-tools"]

[dependencies]
handl-kit-core = { workspace = true }
handl-platform = { workspace = true }
serde_json = { workspace = true }
# PL-004 T-093: the desired-state apply bridge — mlopt's change-set
# manifest (`python -m mlopt … --manifest` / `stage deliver`) is
# reconciled through `Engine::plan`/`Engine::apply` over `FsStore`.
hnl-engine-codegen = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = "3"
