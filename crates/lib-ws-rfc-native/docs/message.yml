category:
  slug: ws_rfc_native
  title: WebSocket (RFC 6455)
module:
  name: ws_rfc_native.message
  title: Message
functions:
  from_frame:
    description: Convert a WebSocket frame object to a message object.
    details: '`ws_rfc_native.message.from_frame(frame)` returns a message object with
      one of:

      - `{ text: string }`

      - `{ binary: base64 }`

      - `{ ping: base64 }`

      - `{ pong: base64 }`

      - `{ close: null }` or `{ close: { code: number, reason: string } }`

      '
    signature: 'ws_rfc_native.message.from_frame(frame: object) -> object'
    params:
    - name: frame
      type: object
      description: the frame to convert
    return_value: object
    examples: []
    see: []
  to_frame:
    description: Convert a WebSocket message object into a base64-encoded frame.
    details: '`ws_rfc_native.message.to_frame(message)` takes one of the message objects
      described for `message.from_frame`

      and returns the base64-encoded wire bytes for a single, unmasked frame.

      '
    signature: 'ws_rfc_native.message.to_frame(message: object) -> string'
    params:
    - name: message
      type: object
      description: the message to encode
    return_value: string
    examples: []
    see: []
