ws_rfc_native:
  client:
    description: Create a new RFC 6455 WebSocket client.
    details: |
      `ws_rfc_native.client()` returns a client object with `client_id`.
    signature: 'ws_rfc_native.client() -> object'
    params: []
    return_value: object
    examples:
    - 'let s = ws_rfc_native.client()'
    see: []
  connect:
    description: Connect a client to a real WebSocket URL.
    details: |
      `ws_rfc_native.connect(client, url)` opens a real TCP/TLS WebSocket connection to `url`.
      `client` is the object returned by `ws_rfc_native.client()`.
    signature: 'ws_rfc_native.connect(client: object, url: string) -> null'
    params:
    - name: client
      type: object
      description: the client object
    - name: url
      type: string
      description: the WebSocket URL to connect to
    return_value: null
    examples:
    - 'ws_rfc_native.connect(s, "wss://echo.websocket.org/")'
    see: []
  send:
    description: Send a message from a client.
    details: |
      `ws_rfc_native.send(client, msg)` sends a message over the real WebSocket connection.
      `msg` may be a string or an object with `text` or `binary` keys.
    signature: 'ws_rfc_native.send(client: object, msg: any) -> null'
    params:
    - name: client
      type: object
      description: the client object
    - name: msg
      type: any
      description: the message to send
    return_value: null
    examples:
    - 'ws_rfc_native.send(s, "hello")'
    - 'ws_rfc_native.send(s, { text: "hello" })'
    see: []
  recv:
    description: Receive a message from a client.
    details: |
      `ws_rfc_native.recv(client, timeout)` receives the next message.
      - If `timeout` is omitted, `recv` blocks indefinitely.
      - If `timeout` is `0` or negative, `recv` is non-blocking and returns `null` if nothing is queued.
      - If `timeout` is positive, `recv` waits up to that many seconds and returns `null` on timeout.
    signature: 'ws_rfc_native.recv(client: object, timeout?: number) -> any'
    params:
    - name: client
      type: object
      description: the client object
    - name: timeout
      type: number
      description: optional timeout in seconds
    return_value: any
    examples:
    - 'ws_rfc_native.recv(s)'
    - 'ws_rfc_native.recv(s, 0)'
    - 'ws_rfc_native.recv(s, 5)'
    see: []
  close:
    description: Close a client connection.
    details: |
      `ws_rfc_native.close(client)` closes the real WebSocket connection and removes the client.
    signature: 'ws_rfc_native.close(client: object) -> null'
    params:
    - name: client
      type: object
      description: the client object
    return_value: null
    examples:
    - 'ws_rfc_native.close(s)'
    see: []
  server:
    description: Create a new RFC 6455 WebSocket server.
    details: |
      `ws_rfc_native.server()` returns a server object with `server_id`.
    signature: 'ws_rfc_native.server() -> object'
    params: []
    return_value: object
    examples:
    - 'let srv = ws_rfc_native.server()'
    see: []
  listen:
    description: Start listening on an address.
    details: |
      `ws_rfc_native.listen(server, addr, handler)` starts a real TCP listener and registers a handler.
      The handler is a handl function taking `(conn, msg)` and the value it returns is sent back to the client.
      Returns the actual bound `ws://` URL.
    signature: 'ws_rfc_native.listen(server: object, addr: string, handler: function) -> string'
    params:
    - name: server
      type: object
      description: the server object
    - name: addr
      type: string
      description: the address to listen on
    - name: handler
      type: function
      description: a function (conn, msg) -> reply
    return_value: string
    examples:
    - 'let url = ws_rfc_native.listen(srv, "ws://0.0.0.0:0", fn (conn, msg) -> msg)'
    see: []
  stop:
    description: Stop a server.
    details: |
      `ws_rfc_native.stop(server)` stops the listener and removes the server.
    signature: 'ws_rfc_native.stop(server: object) -> null'
    params:
    - name: server
      type: object
      description: the server object
    return_value: null
    examples:
    - 'ws_rfc_native.stop(srv)'
    see: []
  frame.encode:
    description: Encode a WebSocket frame object into a base64 string.
    details: |
      `ws_rfc_native.frame.encode(frame)` takes a frame object and returns the wire bytes as a base64 string.
      The frame object must contain:
      - `opcode` (string): one of `text`, `binary`, `close`, `ping`, `pong`
      - `payload` (string, base64, optional): the frame payload, default empty
      - `fin` (bool, optional): the FIN bit, default `true`
      - `mask` (string, base64 of 4 bytes, optional): the masking key
    signature: 'ws_rfc_native.frame.encode(frame: object) -> string'
    params:
    - name: frame
      type: object
      description: the frame to encode
    return_value: string
    examples:
    - 'ws_rfc_native.frame.encode({ opcode: "text", payload: "" })'
    see: []
  frame.decode:
    description: Decode a base64 WebSocket frame into a frame object.
    details: |
      `ws_rfc_native.frame.decode(base64)` parses a base64-encoded WebSocket frame and returns an object with
      `opcode`, `payload` (base64), `fin`, `rsv1`, `rsv2`, `rsv3`, and optional `mask` (base64).
    signature: 'ws_rfc_native.frame.decode(base64: string) -> object'
    params:
    - name: base64
      type: string
      description: base64-encoded frame bytes
    return_value: object
    examples:
    - 'ws_rfc_native.frame.decode("...")'
    see: []
  message.from_frame:
    description: Convert a WebSocket frame object to a message object.
    details: |
      `ws_rfc_native.message.from_frame(frame)` returns a message object with one of:
      - `{ text: string }`
      - `{ binary: base64 }`
      - `{ ping: base64 }`
      - `{ pong: base64 }`
      - `{ close: null }` or `{ close: { code: number, reason: string } }`
    signature: 'ws_rfc_native.message.from_frame(frame: object) -> object'
    params:
    - name: frame
      type: object
      description: the frame to convert
    return_value: object
    examples: []
    see: []
  message.to_frame:
    description: Convert a WebSocket message object into a base64-encoded frame.
    details: |
      `ws_rfc_native.message.to_frame(message)` takes one of the message objects described for `message.from_frame`
      and returns the base64-encoded wire bytes for a single, unmasked frame.
    signature: 'ws_rfc_native.message.to_frame(message: object) -> string'
    params:
    - name: message
      type: object
      description: the message to encode
    return_value: string
    examples: []
    see: []
