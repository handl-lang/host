      `otlp.set_attribute(id, key, value)` | `(id, key, value)` | Set a span attribute. | | `otlp.add_event(id, name, attrs?)`
      | `(id, name, attrs?)` | Add a named event to a span. | | `otlp.record_log(level, message, attrs?)` | `(level, message,
      attrs?)` | Record a log entry. | | `otlp.record_metric(name, value, options?)` | `(name, value, options?)` | Record
      a numeric metric. | | `otlp.flush()` | `()` | Export all buffered telemetry. | | `otlp.shutdown()` | `()` | End all
      spans, flush and release the exporter. |
    signature: otlp.flush()
    params: []
    return_value: type.any
    examples: []
    see: []
