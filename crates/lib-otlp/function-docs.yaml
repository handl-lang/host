  flush:
    description: Module adapter for [`OtlpState`] — exposes `otlp.*` functions
    details: Module adapter for [`OtlpState`] — exposes `otlp.*` functions.  | Function | Args | Description | |----------|------|-------------|
      | `otlp.configure(config)` | `(config)` | Set endpoint, service name, headers and resource attributes. | | `otlp.start_span(name,
