[package]
name = "handl-bench"
version.workspace = true
edition.workspace = true
publish = false
description = "Shared fixtures for the handl benchmark suite."
license.workspace = true
repository.workspace = true

[dependencies]
handl-language = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
  "plotters",
  "cargo_bench_support",
] }
handl-kit-canonical = { workspace = true }
handl-kit-data-canonical = { workspace = true }
hnl-engine-lex = { git = "https://github.com/handl-lang/engine-lex", branch = "main" }
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse = { git = "https://github.com/handl-lang/engine-parse", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
hnl-engine-typecheck = { git = "https://github.com/handl-lang/engine-typecheck", branch = "main" }
handl-value = { workspace = true }
serde_json = { workspace = true }

[lib]
bench = false

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "typecheck"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "core"
harness = false

[[bench]]
name = "infer"
harness = false