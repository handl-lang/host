[package]
name = "handl-bench"
version.workspace = true
edition.workspace = true
publish = false
description = "Shared fixtures for the handl benchmark suite."
license.workspace = true
repository.workspace = true

[dependencies]
handl-language = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
  "plotters",
  "cargo_bench_support",
] }
handl-kit-prelude = { workspace = true }
handl-kit-data-prelude = { workspace = true }
hnl-tool-lex = { git = "https://github.com/handl-lang/tool-lex", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
hnl-tool-typecheck = { git = "https://github.com/handl-lang/tool-typecheck", branch = "main" }
handl-value = { workspace = true }
serde_json = { workspace = true }

[lib]
bench = false

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "typecheck"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "core"
harness = false

[[bench]]
name = "infer"
harness = false
