[package]
name = "handl-lib-ws-whatwg-wasm"
version.workspace = true
edition.workspace = true
description = "WASM WHATWG WebSocket client module for the handl runtime."

[dependencies]
handl-platform = { workspace = true }
handl-plugin-vm.workspace = true
handl-plugin-vm-common.workspace = true
handl-plugin-vm-values-json.workspace = true
serde = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "Event", "Blob"] }
