[package]
name = "handl-plugin-loader-native-fixture-echo"
version.workspace = true
edition.workspace = true
publish = false
description = "cdylib test fixture for handl-plugin-loader-native."
license.workspace = true
repository.workspace = true

[lib]
# `cdylib` is what the loader tests load; `rlib` exists so the fixture can also be
# a (dev-)dependency, which is what forces cargo to build it.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
