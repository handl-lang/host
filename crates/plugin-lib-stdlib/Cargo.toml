[package]
name = "handl-plugin-lib-stdlib"
version.workspace = true
edition.workspace = true
description = "The handl-backed standard library, consolidated per the \"library-as-data\" architecture: every `plugin-lib-*` shell crate is replaced by a row in [`packages::PACKAGES`] / ..."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-module = { path = "../plugin-module" }
handl-value = { workspace = true }
handl-language = { workspace = true }
handl-platform = { path = "../platform" }
handl-plugin-lib-handl = { path = "../plugin-lib-handl" }
handl-ops = { workspace = true }
handl-plugin-lib-otlp-c = { git = "https://github.com/handl-lang/lib-otlp-c", branch = "main" }
handl-plugin-lib-otlp-std = { git = "https://github.com/handl-lang/lib-otlp-std", branch = "main" }
# Shared op helpers (throwaway — see the lib-ops README).
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
# ADR-0128: port packages live in their own repos.
handl-lib-transform = { git = "https://github.com/handl-lang/lib-transform", branch = "main" }

handl-lib-prim = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-lib-prim-handl = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-lib-type = { git = "https://github.com/handl-lang/lib-type", branch = "main" }
handl-lib-comb = { git = "https://github.com/handl-lang/lib-comb", branch = "main" }
handl-lib-mood = { git = "https://github.com/handl-lang/lib-mood", branch = "main" }
handl-lib-obj = { git = "https://github.com/handl-lang/lib-obj", branch = "main" }
handl-lib-error = { git = "https://github.com/handl-lang/lib-error", branch = "main" }
handl-lib-cmp = { git = "https://github.com/handl-lang/lib-cmp", branch = "main" }
handl-lib-bytes = { git = "https://github.com/handl-lang/lib-bytes", branch = "main" }
handl-lib-serialize = { git = "https://github.com/handl-lang/lib-serialize", branch = "main" }
handl-plugin-lib-serialize-toml-c = { git = "https://github.com/handl-lang/lib-serialize-toml-c", branch = "main" }
handl-plugin-lib-serialize-yaml-c = { git = "https://github.com/handl-lang/lib-serialize-yaml-c", branch = "main" }
# `tag` module impls (P-013 T-151): `ops::tag::tag_impls` keys the
# `lib-tag/atoms.yaml` spec into `plugin-lib-tag`'s pub `Function` impls.
handl-plugin-lib-tag = { workspace = true }
base64 = "0.22"
tar = "0.4"
hex = "0.4"
iri-string = "=0.7.12"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
url = "2"

[dev-dependencies]
handl-kit-data-prelude = { workspace = true }
handl-language = { workspace = true }
handl-platform = { path = "../platform" }
handl-runtime = { path = "../handl-runtime" }
hnl-exec-tree-walk = { git = "https://github.com/handl-lang/exec-tree-walk", branch = "main" }
handl-plugin-lib-handl = { path = "../plugin-lib-handl" }
handl-lib-serialize = { git = "https://github.com/handl-lang/lib-serialize", branch = "main" }
# Test-only: `tests/base64.rs`/`tests/hex.rs` exercise the shell crates' Rust
# op impls (`ops::*`, `*_op_registry`) — the packages themselves are pure
# `.hnl` table rows vendored by build.rs (ADR-0160/0161).
handl-lib-base64 = { git = "https://github.com/handl-lang/lib-base64", branch = "main" }
handl-lib-hex = { git = "https://github.com/handl-lang/lib-hex", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
serde_json = "1"
[build-dependencies]
handl-pkg-vendor = { path = "../pkg-vendor" }
