# Ambient global value bindings — seeded into every runtime built from this
# language (see `Language::globals` and `Runtime::from_registry_with_resolver`).
#
# `true`/`false` are the canonical booleans. They are *values*, not keywords:
# the `bool` package (`handl-packages/utils/bool.hnl`) exports the same names
# so `from "bool" import true, false` resolves to the identical values, and
# the ambient bindings here keep the bare names working in every scope
# (including `match` patterns, where a bound name compares by equality).
true: true
false: false

# Mode algebras (graded-arrows.md §3 adj. 1, MTT migration pl-0002 M2).
#
# An `Algebra` is a Handl data record `{compose, unit, order}` — the
# operations `mode_compose` needs, exposed as data fields so algebras are
# selectable per composition site. `compose`/`order` are either a string
# tag naming a builtin operation or an applicable Handl function;
# `unit` is a mode value (the identity for `compose`).
#
# Mode payloads are *calls*: `~[Cost(3)]~>` reads "mode `3` in the
# `Cost` algebra" — the call head selects `mode.algebra.<Head>` here,
# the argument is the grade payload. Bare non-call modes
# (`~[{io: S}]~>`, `~[Addable]~>`) compose under
# `mode.algebra.default`.
#
# `mode.algebra.default` — the canonical default algebra
# (graded-arrows.md §4.2/§6): numeric add for literal counts,
# record-row union for rows, equality for named grades, fresh meta +
# deferred diagnostic otherwise (`compose: "canonical"`).
mode.algebra.default:
  compose: "canonical"
  unit: null
  order: "eq"

# `mode.algebra.Effects` — the canonical effect-row algebra (PL-0004
# E0; design/effects-ambient-modes.md §2): `compose` is record-row
# union with the entry-merge rule (a shared op keeps its entry iff the
# two entries unify; a decided conflict degrades that entry to a fresh
# meta — the honest bound), `unit` the empty row `{}`, `order`
# row-width subsumption (`s' ⊇ s` — the `io_headed` direction,
# consumed by M3). The head is capitalized to match the surface
# spelling `Effects(S)` — `~[Effects(row)]~>` / `@ [Effects(S)]`
# resolve `mode.algebra.<Head>` by the call head as written.
# `IO<sig>`/`handle`/`perform` remain the canonical effect mechanism
# until E1; this only *permits* `~[{io: S}]~>` / `~[Effects(row)]~>`
# annotations today.
mode.algebra.Effects:
  compose: "row_union"
  unit: {}
  order: "row_width"
