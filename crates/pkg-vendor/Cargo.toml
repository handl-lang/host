[package]
name = "handl-pkg-vendor"
version = "0.1.0"
edition = "2024"
description = "Build-script helper: vendor a lib-* package's .hnl sources into OUT_DIR (ADR-0160 P3)."
license = "MIT"
repository = "https://github.com/handl-lang/host"
publish = false

[dependencies]
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }

[patch."https://github.com/handl-lang/host"]
handl-platform = { path = "../platform" }
