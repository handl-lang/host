category:
  slug: lib-concurrent
  title: Concurrent
module:
  name: concurrent
  title: Concurrent
functions:
  spawn:
    description: Call `concurrent.spawn`.
    details: Given concurrent.spawn.
    signature: 'concurrent.spawn(work: any)'
    params:
    - name: work
      type: any
      description: the work function to run
    return_value: type.any
    examples:
    - concurrent.spawn(work)
    see: []
  await:
    description: Call `concurrent.await`.
    details: Given concurrent.await.
    signature: 'concurrent.await(task: any)'
    params:
    - name: task
      type: any
      description: the task to wait for
    return_value: type.any
    examples:
    - concurrent.await(t)
    see: []
  yield:
    description: Call `concurrent.yield`.
    details: Given concurrent.yield.
    signature: concurrent.yield()
    params: []
    return_value: type.any
    examples:
    - concurrent.yield()
    see: []
  channel:
    description: Create a channel with optional bounded capacity.
    details: A null or non-number capacity creates an unbounded channel. A non-negative integer capacity creates a bounded channel.
    signature: 'concurrent.channel(capacity: any)'
    params:
    - name: capacity
      type: any
      description: 'the channel capacity: null or non-number for unbounded, or a non-negative integer for bounded'
    return_value: type.any
    examples:
    - concurrent.channel(10)
    - concurrent.channel(null)
    see: []
  send:
    description: Send a value on a channel, yielding if the channel is full.
    details: Enqueues the value and returns null, or yields an `Error::Operation` signal when the bounded channel is full.
    signature: 'concurrent.send(channel: any, value: any)'
    params:
    - name: channel
      type: any
      description: the channel to send on
    - name: value
      type: any
      description: the value to send
    return_value: type.any
    examples:
    - concurrent.send(ch, 42)
    see: []
  try_send:
    description: Try to send a value on a channel without blocking.
    details: Enqueues the value and returns null, or yields an `Error::Operation` signal when the bounded channel is full.
    signature: 'concurrent.try_send(channel: any, value: any)'
    params:
    - name: channel
      type: any
      description: the channel to send on
    - name: value
      type: any
      description: the value to send
    return_value: type.any
    examples:
    - concurrent.try_send(ch, 42)
    see: []
  recv:
    description: Receive a value from a channel, yielding if the channel is empty.
    details: Dequeues and returns the next value, or yields an `Error::Operation` signal when the channel is empty.
    signature: 'concurrent.recv(channel: any)'
    params:
    - name: channel
      type: any
      description: the channel to receive from
    return_value: type.any
    examples:
    - concurrent.recv(ch)
    see: []
  select:
    description: Poll a list of channels and return the first available value.
    details: Returns `[index, value]` for the first channel that has a value, where `index` is the channel's position in the input array. Yields an `Error::Operation` signal if all channels are empty.
    signature: 'concurrent.select(channels: any)'
    params:
    - name: channels
      type: any
      description: an array of channels to poll
    return_value:
    - type.number
    - type.any
    examples:
    - concurrent.select([ch1, ch2])
    see: []
  mutex:
    description: Call `concurrent.mutex`.
    details: Given concurrent.mutex.
    signature: concurrent.mutex()
    params: []
    return_value: type.any
    examples:
    - concurrent.mutex()
    see: []
  lock:
    description: Call `concurrent.lock`.
    details: Given concurrent.lock.
    signature: 'concurrent.lock(mutex: any, thunk: any)'
    params:
    - name: mutex
      type: any
      description: the mutex to acquire
    - name: thunk
      type: any
      description: the work to run while holding the lock
    return_value: type.any
    examples:
    - concurrent.lock(m, () -> critical())
    see: []
  try_lock:
    description: Try to acquire a mutex and run a thunk without blocking.
    details: Runs the thunk and returns its result if the mutex is available, or yields an `Error::Operation` signal if the mutex is already held.
    signature: 'concurrent.try_lock(mutex: any, thunk: any)'
    params:
    - name: mutex
      type: any
      description: the mutex to acquire
    - name: thunk
      type: any
      description: the work to run while holding the lock
    return_value: type.any
    examples:
    - concurrent.try_lock(m, () -> critical())
    see: []
  unlock:
    description: Call `concurrent.unlock`.
    details: Given concurrent.unlock.
    signature: 'concurrent.unlock(mutex: any)'
    params:
    - name: mutex
      type: any
      description: the mutex to release
    return_value: type.any
    examples:
    - concurrent.unlock(m)
    see: []
  rwlock:
    description: Call `concurrent.rwlock`.
    details: Given concurrent.rwlock.
    signature: concurrent.rwlock()
    params: []
    return_value: type.any
    examples:
    - concurrent.rwlock()
    see: []
  read_lock:
    description: Call `concurrent.read_lock`.
    details: Given concurrent.read_lock.
    signature: 'concurrent.read_lock(rwlock: any, thunk: any)'
    params:
    - name: rwlock
      type: any
      description: the read-write lock
    - name: thunk
      type: any
      description: the read work to run
    return_value: type.any
    examples:
    - concurrent.read_lock(rw, () -> read())
    see: []
  write_lock:
    description: Call `concurrent.write_lock`.
    details: Given concurrent.write_lock.
    signature: 'concurrent.write_lock(rwlock: any, thunk: any)'
    params:
    - name: rwlock
      type: any
      description: the read-write lock
    - name: thunk
      type: any
      description: the write work to run
    return_value: type.any
    examples:
    - concurrent.write_lock(rw, () -> write())
    see: []
  semaphore:
    description: Call `concurrent.semaphore`.
    details: Given concurrent.semaphore.
    signature: 'concurrent.semaphore(permits: any)'
    params:
    - name: permits
      type: any
      description: the initial number of permits
    return_value: type.any
    examples:
    - concurrent.semaphore(3)
    see: []
  acquire:
    description: Call `concurrent.acquire`.
    details: Given concurrent.acquire.
    signature: 'concurrent.acquire(semaphore: any, count: any)'
    params:
    - name: semaphore
      type: any
      description: the semaphore to acquire from
    - name: count
      type: any
      description: the number of permits to acquire
    return_value: type.any
    examples:
    - concurrent.acquire(sem, 1)
    see: []
  try_acquire:
    description: Try to acquire permits from a semaphore without blocking.
    details: Decrements the permit count and returns null if enough permits are available, or yields an `Error::Operation` signal otherwise.
    signature: 'concurrent.try_acquire(semaphore: any, count: any)'
    params:
    - name: semaphore
      type: any
      description: the semaphore to acquire from
    - name: count
      type: any
      description: the number of permits to acquire
    return_value: type.any
    examples:
    - concurrent.try_acquire(sem, 1)
    see: []
  release:
    description: Call `concurrent.release`.
    details: Given concurrent.release.
    signature: 'concurrent.release(semaphore: any, count: any)'
    params:
    - name: semaphore
      type: any
      description: the semaphore to release to
    - name: count
      type: any
      description: the number of permits to release
    return_value: type.any
    examples:
    - concurrent.release(sem, 1)
    see: []
  atomic:
    description: Call `concurrent.atomic`.
    details: Given concurrent.atomic.
    signature: 'concurrent.atomic(value: any)'
    params:
    - name: value
      type: any
      description: the initial value
    return_value: type.any
    examples:
    - concurrent.atomic(0)
    see: []
  atomic_read:
    description: Call `concurrent.atomic_read`.
    details: Given concurrent.atomic_read.
    signature: 'concurrent.atomic_read(atomic: any)'
    params:
    - name: atomic
      type: any
      description: the atomic reference to read
    return_value: type.any
    examples:
    - concurrent.atomic_read(r)
    see: []
  atomic_write:
    description: Call `concurrent.atomic_write`.
    details: Given concurrent.atomic_write.
    signature: 'concurrent.atomic_write(atomic: any, value: any)'
    params:
    - name: atomic
      type: any
      description: the atomic reference to write
    - name: value
      type: any
      description: the new value
    return_value: type.any
    examples:
    - concurrent.atomic_write(r, 42)
    see: []
  atomic_cas:
    description: Call `concurrent.atomic_cas`.
    details: Given concurrent.atomic_cas.
    signature: 'concurrent.atomic_cas(atomic: any, expected: any, new_value: any)'
    params:
    - name: atomic
      type: any
      description: the atomic reference to compare and swap
    - name: expected
      type: any
      description: the expected current value
    - name: new_value
      type: any
      description: the value to write if current matches expected
    return_value: type.any
    examples:
    - concurrent.atomic_cas(r, 0, 1)
    see: []
  cancel_token:
    description: Call `concurrent.cancel_token`.
    details: Given concurrent.cancel_token.
    signature: concurrent.cancel_token()
    params: []
    return_value: type.any
    examples:
    - concurrent.cancel_token()
    see: []
  cancel:
    description: Call `concurrent.cancel`.
    details: Given concurrent.cancel.
    signature: 'concurrent.cancel(token: any)'
    params:
    - name: token
      type: any
      description: the cancellation token to cancel
    return_value: type.any
    examples:
    - concurrent.cancel(tok)
    see: []
  cancelable:
    description: Call `concurrent.cancelable`.
    details: Runs work unless the token is already cancelled; the scheduler wraps the Eval callback so the token is checked at every expression boundary, forcefully aborting with a cancellation error at those yield points.
    signature: 'concurrent.cancelable(token: any, work: any)'
    params:
    - name: token
      type: any
      description: the cancellation token to observe
    - name: work
      type: any
      description: the work to run
    return_value: type.any
    examples:
    - concurrent.cancelable(tok, work)
    see: []
  sleep:
    description: Pause the calling thread for the given number of milliseconds.
    details: A null argument is treated as zero milliseconds. The calling thread blocks for the requested duration.
    signature: 'concurrent.sleep(ms: any)'
    params:
    - name: ms
      type: any
      description: the number of milliseconds to sleep
    return_value: type.null
    examples:
    - concurrent.sleep(100)
    - concurrent.sleep(null)
    see: []
  timeout:
    description: Wait for a task to complete, cancelling it if it exceeds a deadline.
    details: Returns the task's result if it finishes within the deadline. Otherwise the task is cancelled and a cancellation error is returned. The default scheduler cannot enforce a real timeout and simply awaits the task.
    signature: 'concurrent.timeout(task: any, ms: any)'
    params:
    - name: task
      type: any
      description: the task to wait for
    - name: ms
      type: any
      description: the timeout in milliseconds
    return_value: type.any
    examples:
    - concurrent.timeout(t, 100)
    see: []
  tcp_connect:
    description: Open a blocking TCP connection to a host:port address.
    details: Parses `addr` as a "host:port" string, connects using `std::net::TcpStream`, stores the stream, and returns a `tcp_socket` handle.
    signature: 'concurrent.tcp_connect(addr: string)'
    params:
    - name: addr
      type: string
      description: the host and port to connect to, e.g. "127.0.0.1:8080"
    return_value: type.any
    examples:
    - concurrent.tcp_connect("127.0.0.1:8080")
    see: []
  tcp_send:
    description: Send data over an open TCP socket.
    details: Converts `data` to a string (using the JSON string directly if it is one, otherwise `to_string`) and writes it to the stream with `write_all`.
    signature: 'concurrent.tcp_send(socket: any, data: any)'
    params:
    - name: socket
      type: any
      description: the tcp_socket handle returned by tcp_connect
    - name: data
      type: any
      description: the data to send; converted to a string
    return_value: type.null
    examples:
    - concurrent.tcp_send(sock, "hello")
    - concurrent.tcp_send(sock, 42)
    see: []
  tcp_recv:
    description: Receive bytes from an open TCP socket.
    details: Reads up to 4096 bytes from the stream and returns them as a JSON string.
    signature: 'concurrent.tcp_recv(socket: any)'
    params:
    - name: socket
      type: any
      description: the tcp_socket handle returned by tcp_connect
    return_value: type.string
    examples:
    - concurrent.tcp_recv(sock)
    see: []
  tcp_close:
    description: Close an open TCP socket.
    details: Removes the stored stream, dropping it and closing the connection.
    signature: 'concurrent.tcp_close(socket: any)'
    params:
    - name: socket
      type: any
      description: the tcp_socket handle returned by tcp_connect
    return_value: type.null
    examples:
    - concurrent.tcp_close(sock)
    see: []
aliases:
  may:
    description: Alias for `concurrent.spawn`.
    details: Fire-and-forget mood marker. Starts a task and returns it without waiting.
    signature: 'concurrent.may(work: any)'
    params:
    - name: work
      type: any
      description: the work function to run
    return_value: type.any
    examples:
    - concurrent.may(() -> 1)
    see:
    - concurrent.spawn
  must:
    description: Alias for `concurrent.timeout`.
    details: Hard-deadline mood marker. Awaits a task and cancels it if the deadline is exceeded.
    signature: 'concurrent.must(task: any, ms: any)'
    params:
    - name: task
      type: any
      description: the task to wait for
    - name: ms
      type: any
      description: the deadline in milliseconds
    return_value: type.any
    examples:
    - concurrent.must(t, 1000)
    see:
    - concurrent.timeout
  when:
    description: Alias for `concurrent.select`.
    details: Selective-receive mood marker. Polls a list of channels and returns the first available value.
    signature: 'concurrent.when(channels: any)'
    params:
    - name: channels
      type: any
      description: an array of channels to poll
    return_value:
    - type.number
    - type.any
    examples:
    - concurrent.when([ch1, ch2])
    see:
    - concurrent.select
syntax:
  description: Proposed canonical `concurrent { ... }` block sugar for the concurrency module.
  details: Mood markers give syntactic color to the existing function dispatch. `must` marks a hard deadline, `may` marks a fire-and-forget task, and `when` marks a selective receive.
  examples:
  - concurrent { spawn -> t; await t }
  - concurrent { let t = may(() -> 1); must(t, 1000) }
  - concurrent { when([ch1, ch2]) -> [i, v] }
  mood_markers:
    must: hard-deadline wait with automatic cancellation
    may: fire-and-forget task spawn
    when: selective receive over a list of channels
testing:
- cargo test -p handl-lib-concurrent
- cargo test -p handl-lib-concurrent --features stress
- cargo +nightly miri test -p handl-lib-concurrent (when available)
- cargo bench
