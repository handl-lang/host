# LSP surface for the canonical handl language.
#
# This is *one* concrete `lsp.yaml` instance for handl. `plugin-lsp` reads the
# `lsp` fragment from `Language` and implements the LSP requests generically.
#
# The top level is a list of `LspDef` fragments. Each fragment has a `rules`
# registry and an `lsp` method map. The method map is keyed by LSP method id
# and contains an ordered list of rule ids. `plugin-lsp` evaluates each method's
# rules in order, dispatching each rule by its `kind`. Missing methods, missing
# rules, and missing `kind` handlers all produce empty/null responses rather
# than hard failures.
#
# No section, field, or rule is mandatory. A language without comments can omit
# `docs` configuration in rules; a language without imports can omit
# `import_path` and `import_name` rules; a language without an outline can omit
# `textDocument/documentSymbol`.

- id: canonical.lsp
  rules:
    # Shared export recipe for ast.law (axiom/law surface forms).
    lsp.export.law:
      kind: export
      match: !Match
        node_kind: ast.law
      name:
        payload: name
        dotted_last_segment: false
      docs:
        leading_trivia: [token.doc_comment, token.block_comment]
        trailing_trivia: [token.comment]
      signature:
        fallback: source

    lsp.export.assign:
      kind: export
      match: !Match
        node_kind: ast.assign
      name:
        role: target
        dotted_last_segment: true
      docs:
        leading_trivia: [token.doc_comment, token.block_comment]
        trailing_trivia: [token.comment]
      signature:
        fallback: source

    lsp.export.data:
      kind: export
      match: !Match
        node_kind: ast.data
      name:
        payload: name
        dotted_last_segment: false
      docs:
        leading_trivia: [token.doc_comment, token.block_comment]
        trailing_trivia: [token.comment]

    # Document-symbol recipes (one per exportable shape).
    lsp.symbol.law:
      kind: symbol
      match: !Match
        node_kind: ast.law
      symbol_kind: Function
      name:
        payload: name

    lsp.symbol.data:
      kind: symbol
      match: !Match
        node_kind: ast.data
      symbol_kind: Class
      name:
        payload: name

    lsp.symbol.assign:
      kind: symbol
      match: !Match
        node_kind: ast.assign
      symbol_kind: Variable
      name:
        role: target
        dotted_last_segment: true

    # Hover an import path string to show the target module's leading docs.
    lsp.hover.import:
      kind: import_hover
      preceding_tokens: [token.keyword.from, token.keyword.import]
      module_layouts:
        - pattern: "{spec}"
        - pattern: "{spec}.hnl"
        - pattern: "{dir}/{dir}.hnl"
        - pattern: "{dir}/mod.hnl"
      module_docs:
        leading_trivia: [token.doc_comment]

    # Completion: import path string (after `from` or `import`).
    lsp.completion.import_path:
      kind: import_path
      preceding_tokens: [token.keyword.from, token.keyword.import]
      module_layouts:
        - pattern: "{spec}"
        - pattern: "{spec}.hnl"
        - pattern: "{dir}/{dir}.hnl"
        - pattern: "{dir}/mod.hnl"

    # Completion: imported name (after `import`).
    lsp.completion.import_name:
      kind: import_name
      name_tokens: [token.keyword.import]
      module_layouts:
        - pattern: "{spec}"
        - pattern: "{spec}.hnl"
        - pattern: "{dir}/{dir}.hnl"
        - pattern: "{dir}/mod.hnl"

    # Completion: any other position, suggest exported names.
    lsp.completion.exported_name:
      kind: export_name
      export_rules:
        - lsp.export.law
        - lsp.export.assign
        - lsp.export.data

    # Completion: every binding visible at the cursor — the scope index
    # read in reverse (module bindings, imports, `data` ctors,
    # pattern/lambda binders, sequential `do`-block binds).
    lsp.completion.scope_name:
      kind: scope_name
      reference:
        node_kind: ast.var
      scope:
        import: stmt.import
        export: stmt.export
        data: ast.data

    # Signature help for ordinary parenthesized calls.
    lsp.signature.call:
      kind: signature
      match: !Match
        node_kind: ast.call

    # Folding ranges for bracket pairs and comment blocks.
    lsp.folding:
      kind: folding_range
      match: !Match
        node_kind: ast.block

    # Goto-definition for name references: resolve the `var` at the cursor
    # to the site that binds it (module `target` bindings + `pattern`/`params`
    # binders, resolved from `AstShapeDef` roles).
    lsp.def.var:
      kind: binding
      reference:
        node_kind: ast.var
      # Scope vocabulary: the node kinds that bind names beyond
      # target/pattern shapes — `stmt.import`/`stmt.export` have no
      # `AstShapeDef` roles, so the rule declares them here.
      scope:
        import: stmt.import
        export: stmt.export
        data: ast.data

  lsp:
    textDocument/documentSymbol:
      - lsp.symbol.law
      - lsp.symbol.data
      - lsp.symbol.assign

    textDocument/hover:
      - lsp.export.law
      - lsp.export.assign
      - lsp.export.data
      - lsp.hover.import

    textDocument/definition:
      # Name-reference goto first: a `var` under the cursor resolves to its
      # binder. The export rules stay as fallback for positions inside a
      # binding/export shape that aren't on a `var` (they answer the
      # enclosing declaration's own name).
      - lsp.def.var
      - lsp.export.law
      - lsp.export.assign
      - lsp.export.data

    textDocument/completion:
      - lsp.completion.import_path
      - lsp.completion.import_name
      - lsp.completion.exported_name
      - lsp.completion.scope_name

    textDocument/references:
      - lsp.def.var

    textDocument/rename:
      - lsp.def.var

    textDocument/signatureHelp:
      - lsp.signature.call

    textDocument/foldingRange:
      - lsp.folding
