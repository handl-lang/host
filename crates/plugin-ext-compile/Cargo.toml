[package]
name = "handl-plugin-ext-compile"
version.workspace = true
edition.workspace = true
description = "Compile extension: the `hnl compile` CLI request seam (ADR-0114 Phase 14) plus a re-export of the `handl-platform` compile operation."
license.workspace = true
repository.workspace = true

# PL-004 T-101: the feature-gated compiler-target deps and the
# `CompileDispatcher` are gone — `ext-compile` routes each target's
# kernel `Emitter` impl through `hnl-tool-codegen` directly, so this
# crate is now just the argv seam (`CompileFileRequest`).

[dependencies]
handl-platform = { path = "../platform" }
handl-plugin-compile.workspace = true
handl-language.workspace = true
hnl-engine.workspace = true
hnl-tool-typecheck.workspace = true
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
