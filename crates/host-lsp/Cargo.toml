[package]
name = "handl-host-lsp"
version.workspace = true
edition.workspace = true
description = "The handl LSP server binary."
license.workspace = true
repository.workspace = true

[[bin]]
name = "handl-host-lsp"
path = "src/main.rs"

[dependencies]
handl-platform.workspace = true
handl-plugin-ext-lsp.workspace = true
handl-plugin-ext-refinement.workspace = true
# The LSP only lexes/parses/typechecks/lints — it never evals or compiles
# handl code, so it opts out of the kit's `cranelift`/`ffi` features
# (ADR-0128 §0.5/§0.9): 14 cranelift crates + libloading leave this
# host's build. The `ffi` module stays resolvable with stub ops.
# (`workspace = true` cannot override `default-features`, so this is a
# direct git dep — the workspace-root `[patch]` table still resolves it
# from the sibling `../kit-canonical` checkout, ADR-0128 Phase 11.)
handl-kit-canonical = { git = "https://github.com/handl-lang/kit-canonical", default-features = false }
handl-language.workspace = true
handl-host-tooling.workspace = true
handl-plugin-ext-diag.workspace = true
handl-plugin-ext-fmt.workspace = true
handl-plugin-ext-lint.workspace = true
handl-plugin-lsp-std.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
