# `Scheme` (the six primitives `arr`/`Seq`/`First`/`Choice`/`Loop`/`App`).
# Engines consume these directly.
#
# Removed: arrow_bind, returnA, loop, handle,
#   stmt-module, mood.cnd, mood.int, mood.neg, mood.norm, mood.pot.
# Added: rec, while, for, return, law, trait, impl, infer, type,
#   product, nullish, opt-chain.
