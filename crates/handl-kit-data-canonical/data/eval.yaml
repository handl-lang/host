        source: Native
        lit: 1
    source: Native
# `desugar-error` — raises a LangError when evaluated. Emitted by the
# desugar pass when a declaration fails a compile-time check (e.g. strict
# positivity violation in `data`). The native op `desugar_error` reads the
# node's payload `{kind, reason}` and returns an error.
- id: eval.desugar-error
  node_kind: desugar-error
  scheme: !Op
    name: desugar_error
    args: []
    source: Native
# `data` — inductive type declaration (ADR-0082). A `data` node should
# never reach the evaluator: the desugar pass (`desugar_data`) rewrites it
# into a `block` of predicate/constructor/recursor definitions at parse
# time. If an undesugared `data` node reaches eval, the `desugar_error`
# op raises a LangError. The `lit` payload carries the error message so
# it is visible even though the `data` node's own payload has `name`/
# `children` (not `kind`/`reason`).
- id: eval.data
  node_kind: data
  scheme: !Op
    name: desugar_error
    args: []
    source: Native
    lit:
      kind: data-error
      reason: data declaration was not desugared before evaluation
# `erased` — proof-erasure placeholder (ADR-0032). Always evaluates to
# `null`: the `const` native op returns `Value::Null` when no `lit` is
# provided, so erased proof terms carry no runtime cost.
- id: eval.erased
  node_kind: erased
  scheme: !Arr
    value: null

# ---------------------------------------------------------------------------
# Graded-theory declarations (ADR-0098/0100)
# ---------------------------------------------------------------------------
# These forms mint real tagged values via the `tag.construct` native op,
# with a payload built by the `record` native op from named child roles
# (ADR-0098/0100, ADR-0100). The `record` op itself does not inject
# `__tag__` or `__registry__`; `tag.construct` adds them.
#
# `sort` — sort declaration; a generating 0-cell. Produces a tagged
# `sort` record with `name` and the optional `grades` child.
- id: eval.sort
  node_kind: sort
  scheme: !Op
    name: "tag.construct"
    args:
      - !Arr
        value: "sort"
      - !Op
