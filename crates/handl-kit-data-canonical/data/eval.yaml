# `call` is variable-arity: a Pratt-parsed `call` node has children
# `[callee, arg1, arg2, ...]` (the parser appends one child per comma-
# separated argument, ADR-0041 Phase 2). The fixed-arity `App` scheme
# cannot express this, so `call` lowers to a native op (like `match`/
# `json`): the handler evaluates child 0 as the callee, the
# remaining children as the argument list, and dispatches via
# `apply_app` (host-function string callee or closure value).
# ADR-0060 Generic Call Dispatch: eval.call is now data-driven.
# The scheme evaluates child 0 (the callee), classifies it by type
# (string → host function, object → closure), and dispatches accordingly.
# Variable arity is handled by proj_rest which packs children 1..N into a
# single array value; App and call_host unpack it.
- id: eval.call
  node_kind: call
  scheme: !Seq
    fst: !Seq
      fst: !Op
        name: proj_child
        args: []
        source: Native
        lit: 0
      snd: !Op
        name: route_on_type
        args: []
        source: Native
        lit: string
    snd: !Choice
      l: !Op
        name: call_host
        args:
          - !Op
            name: proj_rest
            args: []
            source: Native
        source: DynamicForeign
      r: !App
        callee: !Op
          name: id
          args: []
          source: Native
        args:
          - !Op
            name: proj_rest
            args: []
            source: Native
#
# A dimension evaluates as **application of its target to the dimension
# arguments**: `f<X>` means `f(X)`, with the children laid out exactly like a
# `call` ([target, args...]). This is the reading ADR-0106 §12 gives the
# generic form (`List<T> := T ~> sym()` — a generic entity is an arrow over
# its dimension), and it keeps the node honest at runtime: the scheme is the
# same as `eval.call`, so a `dimension` node dispatches host functions and
# applies arrow values like any other application, instead of falling through
# to the "no scheme" payload default.
- id: eval.dimension
  node_kind: dimension
  scheme: !Seq
    fst: !Seq
      fst: !Op
        name: proj_child
        args: []
        source: Native
        lit: 0
      snd: !Op
        name: route_on_type
        args: []
        source: Native
        lit: string
    snd: !Choice
      l: !Op
        name: call_host
        args:
          - !Op
            name: proj_rest
            args: []
            source: Native
        source: DynamicForeign
      r: !App
        callee: !Op
          name: id
          args: []
          source: Native
        args:
          - !Op
            name: proj_rest
            args: []
            source: Native

