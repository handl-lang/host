# Eval scheme definitions (ADR-0052 arrow-calculus kernel).
#
# The canonical eval schemes: every node kind maps to an arrow-calculus
# `Scheme` (the six primitives `arr`/`Seq`/`First`/`Choice`/`Loop`/`App`).
# Engines consume these directly. The former v1 lambda-flavored `Scheme`
# combinator set has been removed (ADR-0052 big-bang cutover).
#
# The 52 entries below are the arrow-calculus lowering of the language's
# node kinds. `eval.vau` (node_kind `vau`) is intentionally omitted: Vau is
# removed from the kernel (ADR-0052) and is a handler concern, not a kernel
# combinator.
- id: eval.apply
  node_kind: apply
  scheme: !Arr
    op: proj_child
    args: []
    source: Native
    lit: 0
