# Type rule definitions (ADR-0054 — Generic Typecheck Engine, task 4).
#
# The canonical type rules: every node kind maps to a `TypeRuleDef` with a
# `synth` scheme (Γ ⊢ node ⇒ T). The `synth` scheme uses the arrow-calculus
# `Scheme` kernel (the same `!Arr`/`!Seq`/`!First`/`!Choice`/`!Loop` tags as
# `eval.yaml`) with `source: Judgment` for typecheck judgment ops.
#
# The NBE typecheck engine (`plugin-engine-typecheck-nbe`) interprets these
# schemes. Judgment ops: `construct`, `match_type`, `synth_child`, `check_child`,
# `eval_child`, `proj_child`, `unify`, `extend`, `lookup`, `lookup_var`,
# `fresh_meta`, `solve_meta`, `quote`, `normalize`, `bind`, `result`,
# `node_payload`, `json_type_construct`, `payload_field`, `field`, `type_field`,
# `make_array`, `synth_last_child`, `check_json_value`, `check_last_child`, `synth_match_arms`,
# `synth_first_child_or_unknown`, `record_field_type`, `array_element_type`,
# `synth_object_record`, `check_object_record`, `check_all_children`,
# `construct_pi`, `construct_sigma`, `pi_apply`, `unify_pi`, `check_pi_body`,
# `construct_forall`, `forall_apply`, `unify_forall`,
# `construct_vau_type`, `vau_apply`, `unify_vau`.
# `Seq` threads `fst`'s result into `snd` as `incoming`.
#
# This is the initial canonical set (ADR-0054 explicitly states the full rule
# set is implementation work refined over time). The common arithmetic, logic,
# comparison, conditional, paren, and variable kinds have meaningful rules;
# the remaining kinds use `type.unknown` as a catch-all.

# ---------------------------------------------------------------------------
# Literals & variables
# ---------------------------------------------------------------------------

# `value` — a JSON literal node. The payload IS the literal. `node_payload`
# returns it; `json_type_construct` dispatches on its JSON type and mints the
# appropriate type value (type.number, type.string, type.bool, type.null,
# type.array, or type.object).
- id: type.value
  node_kind: value
  synth: !Seq
    fst: !Arr
      op: node_payload
      args: []
      source: Judgment
    snd: !Arr
      op: json_type_construct
      args: []
      source: Judgment
  # Directed check: verify the JSON payload is a member of the expected
  # collection type (type.number, type.string, type.bool, type.null). This is
  # more precise than synth-then-unify because it avoids synthesizing a type
  # and unifying — it directly inspects the payload's JSON kind
  # (ADR-0054 directed checking).
  check: !Arr
    op: check_json_value
    args: []
    source: Judgment

# `var` — look up the variable's type in Γ. The var node's payload is the
# name string. `node_payload` returns it; `lookup` reads the name from
# `incoming` (when `lit` is absent).
- id: type.var
  node_kind: var
  synth: !Seq
    fst: !Arr
      op: node_payload
      args: []
      source: Judgment
    snd: !Arr
      op: lookup
      args: []
      source: Judgment

# ---------------------------------------------------------------------------
# Conditionals
# ---------------------------------------------------------------------------

# `if` — synth condition (child 0), unify with type.bool, synth then-branch
# (child 1), synth else-branch (child 2), unify then-type with else-type,
# return then-type.
- id: type.if
  node_kind: if
  synth: !Seq
    fst: !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    snd: !Seq
      fst: !Arr
        op: bind
        args: []
        source: Judgment
        lit: tcond
      snd: !Seq
        fst: !Arr
          op: unify
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: tcond
          - !Arr
            op: construct
            args: []
            source: Judgment
            lit: type.bool
          source: Judgment
        snd: !Seq
          fst: !Arr
            op: synth_child
            args: []
            source: Judgment
            lit: 1
          snd: !Seq
            fst: !Arr
              op: bind
              args: []
              source: Judgment
              lit: tthen
            snd: !Seq
              fst: !Arr
                op: unify
                args:
                - !Arr
                  op: result
                  args: []
                  source: Judgment
                  lit: tthen
                - !Arr
                  op: synth_child
                  args: []
                  source: Judgment
                  lit: 2
                source: Judgment
              snd: !Arr
                op: result
                args: []
                source: Judgment
                lit: tthen
  # Directed check: check the condition against type.bool, then check both
  # branches against the expected type (incoming). This is more precise than
  # synth-then-unify because each branch is checked in isolation against the
  # expected type rather than unified with each other
  # (ADR-0054 directed checking). The expected type is bound to "expected"
  # first because `Seq` threads `fst`'s result (Null from check_child) into
  # `snd` as `incoming`, overwriting the original expected type.
  check: !Seq
    fst: !Arr
      op: bind
      args: []
      source: Judgment
      lit: expected
    snd: !Seq
      fst: !Arr
        op: check_child
        args:
        - !Arr
          op: construct
          args: []
          source: Judgment
          lit: type.bool
        source: Judgment
        lit: 0
      snd: !Seq
        fst: !Arr
          op: check_child
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: expected
          source: Judgment
          lit: 1
        snd: !Arr
          op: check_child
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: expected
          source: Judgment
          lit: 2

# `ternary` — same structure as `if` (cond ? then : else).
- id: type.ternary
  node_kind: ternary
  synth: !Seq
    fst: !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    snd: !Seq
      fst: !Arr
        op: bind
        args: []
        source: Judgment
        lit: tcond
      snd: !Seq
        fst: !Arr
          op: unify
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: tcond
          - !Arr
            op: construct
            args: []
            source: Judgment
            lit: type.bool
          source: Judgment
        snd: !Seq
          fst: !Arr
            op: synth_child
            args: []
            source: Judgment
            lit: 1
          snd: !Seq
            fst: !Arr
              op: bind
              args: []
              source: Judgment
              lit: tthen
            snd: !Seq
              fst: !Arr
                op: unify
                args:
                - !Arr
                  op: result
                  args: []
                  source: Judgment
                  lit: tthen
                - !Arr
                  op: synth_child
                  args: []
                  source: Judgment
                  lit: 2
                source: Judgment
              snd: !Arr
                op: result
                args: []
                source: Judgment
                lit: tthen
  # Directed check: same structure as `if` — check the condition against
  # type.bool, then check both branches against the expected type (incoming).
  # The expected type is bound to "expected" first because `Seq` threads
  # `fst`'s result (Null from check_child) into `snd` as `incoming`,
  # overwriting the original expected type (ADR-0054 directed checking).
  check: !Seq
    fst: !Arr
      op: bind
      args: []
      source: Judgment
      lit: expected
    snd: !Seq
      fst: !Arr
        op: check_child
        args:
        - !Arr
          op: construct
          args: []
          source: Judgment
          lit: type.bool
        source: Judgment
        lit: 0
      snd: !Seq
        fst: !Arr
          op: check_child
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: expected
          source: Judgment
          lit: 1
        snd: !Arr
          op: check_child
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: expected
          source: Judgment
          lit: 2

