# `rec` — recursive region (ADR-0074 ID.3, Paterson loop fixpoint typing).
# The `synth_rec` judgment allocates a fresh metavariable per binding,
# extends Γ, and iterates synth+unify until the binding types stabilize
# (the fixpoint). A fuel limit prevents divergence. The result is the type
# of the last child (or a `return` child's value). Termination is NOT
# checked at the type level — it is a runtime/effect concern.
- id: type.rec
  node_kind: rec
  synth: !Arr
    op: synth_rec
    args: []
    source: Judgment

