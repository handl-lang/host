# ---------------------------------------------------------------------------
# Structural kinds — passthrough / simple type tags
# ---------------------------------------------------------------------------

# `paren` — passthrough: synth the single child. The `check` rule checks
# the child against the expected type (incoming), enabling directed checking
# through parenthesized expressions (ADR-0054 legacy migration).
- id: type.paren
  node_kind: paren
  synth: !Arr
    op: synth_child
    args: []
    source: Judgment
    lit: 0
  check: !Arr
    op: check_child
    args: []
    source: Judgment
    lit: 0

# `block` — graph block (ADR-0079). Binds each `assign` child in Γ, then
# returns the type of the last child. An empty block returns `type.unit`.
# Uses `synth_block` / `check_block` which iterate children, bind assigns
# (including type-annotated ones), and synth/check the last child.
- id: type.block
  node_kind: block
  synth: !Arr
    op: synth_block
    args: []
    source: Judgment
  check: !Arr
    op: check_block
    args: []
    source: Judgment

# `array` — type.array with element type. Synths the first child (the
# first element) and carries its type as the `element` field. An empty
# array yields `type.array{element: type.unknown}` via
# `synth_first_child_or_unknown` (ADR-0054).
- id: type.array
  node_kind: array
  synth: !Seq
    fst: !Arr
      op: synth_first_child_or_unknown
      args: []
      source: Judgment
    snd: !Seq
      fst: !Arr
        op: bind
        args: []
        source: Judgment
        lit: element_type
      snd: !Arr
        op: construct
        args:
        - !Arr
          op: field
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: element_type
          source: Judgment
          lit: element
        source: Judgment
        lit: type.array
  check: !Seq
    fst: !Arr
      op: bind
      args: []
      source: Judgment
      lit: expected
    snd: !Arr
      op: check_all_children
      args:
      - !Arr
        op: array_element_type
        args:
        - !Arr
          op: result
          args: []
          source: Judgment
          lit: expected
        source: Judgment
      source: Judgment

# `object` — synth a `type.record{fields: {...}}` from the node's `entries`
# array. Each entry has a `key` (string) and a `value` (JSON value); the
# value's JSON type becomes the field type. The `check` rule checks each
# entry's value against the corresponding field type in the expected
# `type.record` (ADR-0054 — object uses `entries`, not `children`, so a
# dedicated judgment op iterates the entries).
- id: type.object
  node_kind: object
  synth: !Arr
    op: synth_object_record
    args: []
    source: Judgment
  check: !Arr
    op: check_object_record
    args: []
    source: Judgment

# `function` — synth child 0 (param) → param type, synth child 1 (body)
# → body type, then construct `type.function` with `{"param": ..., "body": ...}`.
# The `check` rule checks child 0 (param) against the expected type's `param`
# field and child 1 (body) against the expected type's `body` field, enabling
# directed checking of function literals against a known `type.function`
# (ADR-0054 legacy migration).
- id: type.function
  node_kind: function
  synth: !Arr
    op: synth_function
    args: []
    source: Judgment
  check: !Seq
    fst: !Arr
      op: bind
      args: []
      source: Judgment
      lit: expected
    snd: !Seq
      fst: !Arr
        op: check_child
        args:
        - !Arr
          op: type_field
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: expected
          source: Judgment
          lit: param
        source: Judgment
        lit: 0
      snd: !Arr
        op: check_child
        args:
        - !Arr
          op: type_field
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: expected
          source: Judgment
          lit: body
        source: Judgment
        lit: 1

# ---------------------------------------------------------------------------
# Dependent types — Pi / Sigma (ADR-0054 closure machinery)
# ---------------------------------------------------------------------------
#
# `pi` — a dependent function type `Π (x: A) → B(x)`. Child 0 is the param
# type A; child 1 is the body type B (which may reference the bound variable).
# The `construct_pi` judgment op synths child 0 for the param type and stores
# child 1's arena index in a `body_closure` marker — the body is NOT evaluated
# eagerly. The closure is applied lazily via `pi_apply` (marks Γ, extends with
# the variable, synths the body child, restores Γ).
#
# The `check` rule enables checking a `function` node against a `type.pi`:
# it checks child 0 (param) against the Pi's `param` field, then uses
# `check_pi_body` to bind the variable, apply the closure, and check child 1
# (body) against the resulting body type.

- id: type.pi
  node_kind: pi
  synth: !Arr
    op: construct_pi
    args:
    - !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    source: Judgment
    lit: x
  check: !Seq
    fst: !Arr
      op: bind
      args: []
      source: Judgment
      lit: expected
    snd: !Seq
      fst: !Arr
        op: check_child
        args:
        - !Arr
          op: type_field
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: expected
          source: Judgment
          lit: param
        source: Judgment
        lit: 0
      snd: !Arr
        op: check_pi_body
        args:
        - !Arr
          op: result
          args: []
          source: Judgment
          lit: expected
        source: Judgment

# `sigma` — a dependent pair type `Σ (x: A) × B(x)`. Same structure as `pi`
# but mints `type.sigma`. Child 0 is the param type A; child 1 is the body
# type B (which may reference the bound variable).
- id: type.sigma
  node_kind: sigma
  synth: !Arr
    op: construct_sigma
    args:
    - !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    source: Judgment
    lit: x

# `forall` — a polymorphic type `∀ (x: Kind) → body(x)`. Child 0 is the kind
# of the type parameter; child 1 is the body type B (which may reference the
# bound type variable). The `construct_forall` judgment op synths child 0 for
# the kind and stores child 1's arena index in a `body_closure` marker — the
# body is NOT evaluated eagerly. The closure is applied lazily via
# `forall_apply` (marks Γ, extends with the type variable, synths the body
# child, restores Γ). This is like `pi` but for type-level abstraction: the
# parameter is a *type*, not a value (ADR-0054).
- id: type.forall
  node_kind: forall
  synth: !Arr
    op: construct_forall
    args:
    - !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    source: Judgment
    lit: x

# `call` — synth the callee (child 0) → type.function{param, body}, check
# the arg (child 1) against the function's `param` type, then return the
# function's `body` type. Uses `type_field` to extract `param`/`body` from
# the function type value (ADR-0054 legacy migration).
- id: type.call
  node_kind: call
  synth: !Seq
    fst: !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    snd: !Seq
      fst: !Arr
        op: bind
        args: []
        source: Judgment
        lit: funtype
      snd: !Seq
        fst: !Arr
          op: check_child
          args:
          - !Arr
            op: type_field
            args:
            - !Arr
              op: result
              args: []
              source: Judgment
              lit: funtype
            source: Judgment
            lit: param
          source: Judgment
          lit: 1
        snd: !Arr
          op: type_field
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: funtype
          source: Judgment
          lit: body

# `let` — delegates to the `synth_let` judgment, which synth child 0
# (value) → type T, reads the var name from the assign child's `var`
# node payload, extends Γ with (name, T), and synth child 1 (body)
# → return body type.
- id: type.let
  node_kind: let
  synth: !Arr
    op: synth_let
    args: []
    source: Judgment

# ---------------------------------------------------------------------------
# Catch-all kinds — type.unknown
# ---------------------------------------------------------------------------

# `field-access` — synth child 0 (the target object) → type.record, bind
# it, extract the field name from `payload.field`, then look up the
# field's type in the record type via `record_field_type`. The field name
# is threaded as `incoming` from `payload_field`; the record type is
# recalled from the bound result (ADR-0054).
- id: type.field-access
  node_kind: field-access
  synth: !Seq
    fst: !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    snd: !Seq
      fst: !Arr
        op: bind
        args: []
        source: Judgment
        lit: record_type
      snd: !Seq
        fst: !Arr
          op: payload_field
          args: []
          source: Judgment
          lit: field
        snd: !Arr
          op: record_field_type
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: record_type
          source: Judgment

# `index` — synth child 0 (the target array) → type.array{element: T},
# then extract the element type via `array_element_type` (reads from
# `incoming`). Returns T (ADR-0054).
- id: type.index
  node_kind: index
  synth: !Seq
    fst: !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    snd: !Arr
      op: array_element_type
      args: []
      source: Judgment

# `match` — multi-arm unification. The match node's children are
# [scrutinee, arm1, arm2, ...]; each arm has children [pattern, body].
# `synth_match_arms` synths each arm body and unifies them all, returning
# the unified type (ADR-0054 — Scheme lacks iteration, so this is a
# judgment op).
- id: type.match
  node_kind: match
  synth: !Arr
    op: synth_match_arms
    args: []
    source: Judgment

# `flow` — like `pipe`. `flow` has children [input(0), function(1)].
# Eval is `App(callee=child[1], args=[child[0]])` — i.e., apply child 1
# (function) to child 0 (input). Synth child 1 (the function)
# → type.function{param, body}, check child 0 (the input) against `param`,
# then return `body` (ADR-0054 legacy migration).
#
# ADR-0074 follow-up #3 note: at the higher (categorical) level `>>>` is
# arrow *composition* (`f: A ~> B, g: B ~> C ⟹ f >>> g : A ~> C`), but the
# v0.1 runtime eval scheme treats `>>>` as function *application*
# (`input >>> function` → apply function to input). The type rule below
# matches the actual eval semantics (application), so it is kept as-is.
# Composition semantics is a higher-level desugaring that lowers to
# application; when the eval scheme is updated to composition, this rule
# should be updated to synth both children, extract `f.body`/`g.param`,
# unify them, and return `type.function{param: f.param, body: g.body}`.
- id: type.flow
  node_kind: flow
  synth: !Seq
    fst: !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 1
    snd: !Seq
      fst: !Arr
