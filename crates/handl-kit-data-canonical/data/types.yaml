# Type rule definitions (ADR-0054 — Generic Typecheck Engine, task 4).
#
# The canonical type rules: every node kind maps to a `TypeRuleDef` with a
# `synth` scheme (Γ ⊢ node ⇒ T). The `synth` scheme uses the arrow-calculus
# `Scheme` kernel (the same `!Arr`/`!Seq`/`!First`/`!Choice`/`!Loop` tags as
# `eval.yaml`) with `source: Judgment` for typecheck judgment ops.
#
# The NBE typecheck engine (`plugin-engine-typecheck-nbe`) interprets these
# schemes. Judgment ops: `construct`, `match_type`, `synth_child`, `check_child`,
# `eval_child`, `proj_child`, `unify`, `extend`, `lookup`, `lookup_var`,
# `fresh_meta`, `solve_meta`, `quote`, `normalize`, `bind`, `result`,
# `node_payload`. `Seq` threads `fst`'s result into `snd` as `incoming`.
#
# This is the initial canonical set (ADR-0054 explicitly states the full rule
# set is implementation work refined over time). The common arithmetic, logic,
# comparison, conditional, paren, and variable kinds have meaningful rules;
# the remaining kinds use `type.unknown` as a catch-all.

# ---------------------------------------------------------------------------
# Literals & variables
# ---------------------------------------------------------------------------

# `value` — a JSON literal node. The payload IS the literal. Without a
# conditional dispatch on the payload's JSON type within a Scheme, we return
# `type.value` as a universal "some literal" type.
- id: type.value
  node_kind: value
  synth: !Arr
    op: construct
    args: []
    source: Judgment
    lit: type.value

# `var` — look up the variable's type in Γ. The var node's payload is the
# name string. `node_payload` returns it; `lookup` reads the name from
# `incoming` (when `lit` is absent).
- id: type.var
  node_kind: var
  synth: !Seq
    fst: !Arr
      op: node_payload
      args: []
      source: Judgment
    snd: !Arr
      op: lookup
      args: []
      source: Judgment

# ---------------------------------------------------------------------------
# Conditionals
# ---------------------------------------------------------------------------

# `if` — synth condition (child 0), unify with type.bool, synth then-branch
# (child 1), synth else-branch (child 2), unify then-type with else-type,
# return then-type.
- id: type.if
  node_kind: if
  synth: !Seq
    fst: !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    snd: !Seq
      fst: !Arr
        op: bind
        args: []
        source: Judgment
        lit: tcond
      snd: !Seq
        fst: !Arr
          op: unify
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: tcond
          - !Arr
            op: construct
            args: []
            source: Judgment
            lit: type.bool
          source: Judgment
        snd: !Seq
          fst: !Arr
            op: synth_child
            args: []
            source: Judgment
            lit: 1
          snd: !Seq
            fst: !Arr
              op: bind
              args: []
              source: Judgment
              lit: tthen
            snd: !Seq
              fst: !Arr
                op: unify
                args:
                - !Arr
                  op: result
                  args: []
                  source: Judgment
                  lit: tthen
                - !Arr
                  op: synth_child
                  args: []
                  source: Judgment
                  lit: 2
                source: Judgment
              snd: !Arr
                op: result
                args: []
                source: Judgment
                lit: tthen

# `ternary` — same structure as `if` (cond ? then : else).
- id: type.ternary
  node_kind: ternary
  synth: !Seq
    fst: !Arr
      op: synth_child
      args: []
      source: Judgment
      lit: 0
    snd: !Seq
      fst: !Arr
        op: bind
        args: []
        source: Judgment
        lit: tcond
      snd: !Seq
        fst: !Arr
          op: unify
          args:
          - !Arr
            op: result
            args: []
            source: Judgment
            lit: tcond
          - !Arr
            op: construct
            args: []
            source: Judgment
            lit: type.bool
          source: Judgment
        snd: !Seq
          fst: !Arr
            op: synth_child
            args: []
            source: Judgment
            lit: 1
          snd: !Seq
            fst: !Arr
              op: bind
              args: []
              source: Judgment
              lit: tthen
            snd: !Seq
              fst: !Arr
                op: unify
                args:
                - !Arr
                  op: result
                  args: []
                  source: Judgment
                  lit: tthen
                - !Arr
                  op: synth_child
                  args: []
                  source: Judgment
                  lit: 2
                source: Judgment
              snd: !Arr
                op: result
                args: []
                source: Judgment
                lit: tthen

