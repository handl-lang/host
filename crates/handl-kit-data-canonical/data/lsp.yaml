# LSP surface for the canonical handl language.
#
# This is *one* concrete `lsp.yaml` instance for handl. `plugin-lsp` reads the
# `lsp` fragment from `Language` and implements the LSP requests generically.
#
# No section, field, or rule here is mandatory. A language without comments can
# omit `docs`; one without imports can omit `import`; one without an outline can
# omit `document_symbol`. `plugin-lsp` simply ignores any absent section and
# returns `null`/`[]` for that LSP request.

lsp:
  import:
    # Tokens whose immediately following string token is a module path.
    # These are token ids from `tokens.yaml` (e.g. `token.keyword.from`),
    # not hard-coded text.
    path_tokens: [token.keyword.from, token.keyword.import]
    # Tokens after which an imported name is being entered.
    name_tokens: [token.keyword.import]
    # Editor-side module resolution. Each pattern is tried in order.
    # Runtime module resolution (ADR-0096) is separate; this is the
    # filesystem search the editor uses for completions/goto/hover.
    module_layouts:
      - pattern: "{spec}"
      - pattern: "{spec}.hnl"
      - pattern: "{dir}/{dir}.hnl"
      - pattern: "{dir}/mod.hnl"

  export:
    # Declarations that can be completed, hovered, jumped to, or outlined.
    # Each rule is matched with the same `!Match` vocabulary as `lints.yaml`.
    rules:
      # `axiom` and `law` surface forms both parse to `ast.law`.
      - id: lsp.export.law
        match:
          !Match
          node_kind: ast.law
        name:
          # The `name` payload is lifted by the grammar row for `law`/`axiom`.
          payload: name
          dotted_last_segment: false
        signature:
          # `ast.law` has no single `signature` child; use the node's source text.
          fallback: source
        docs:
          leading_trivia: [token.doc_comment, token.block_comment]
          trailing_trivia: [token.comment]

      - id: lsp.export.assign
        match:
          !Match
          node_kind: ast.assign
        name:
          role: target
          dotted_last_segment: true
        # Top-level bindings have no declared signature; show the full source.
        signature:
          fallback: source
        docs:
          leading_trivia: [token.doc_comment, token.block_comment]
          trailing_trivia: [token.comment]

      - id: lsp.export.data
        match:
          !Match
          node_kind: ast.data
        name:
          # `ast.data` carries the type name in `payload.name`.
          payload: name
          dotted_last_segment: false
        docs:
          leading_trivia: [token.doc_comment, token.block_comment]
          trailing_trivia: [token.comment]

  # Hover falls back to the shared export rules above.
  hover:
    from_export_rules:
      - lsp.export.law
      - lsp.export.assign
      - lsp.export.data
    import_path:
      # When hovering an import path string, show the target module's docs.
      show_module_docs: true
      module_docs:
        leading_trivia: [token.doc_comment]

  # Goto-definition also reuses the same export rules.
  goto:
    from_export_rules:
      - lsp.export.law
      - lsp.export.assign
      - lsp.export.data

  completion:
    import_names:
      # Suggest names produced by these export rules.
      from_export_rules:
        - lsp.export.law
        - lsp.export.assign
        - lsp.export.data
    # Import path completion is enabled; patterns come from `lsp.import.module_layouts`.
    import_paths: true

  document_symbol:
    rules:
      - id: lsp.symbol.law
        match:
          !Match
          node_kind: ast.law
        # LSP SymbolKind names, not magic numbers.
        kind: Function
        name:
          payload: name
      - id: lsp.symbol.data
        match:
          !Match
          node_kind: ast.data
        kind: Class
        name:
          payload: name
      - id: lsp.symbol.assign
        match:
          !Match
          node_kind: ast.assign
        kind: Variable
        name:
          role: target
          dotted_last_segment: true
