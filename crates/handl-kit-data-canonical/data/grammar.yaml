# `|` pipe — low-precedence infix for constructor alternatives in `data`
# declarations (ADR-0082). Creates `alt` nodes: `Zero | Succ(Nat)` parses
# as `alt(Zero, Succ(Nat))`. Binding power 1/2 is lower than every other
# operator so `|` only appears at the top level of a constructor list.
- id: grammar.pipe.infix
  token: token.pipe
  position: Infix
  binding_power:
    - 1
    - 2
  child_shape:
    node_kind: alt
    arity: 2
