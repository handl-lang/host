# Grammar rule definitions — v0.1 surface syntax (ADR-0074).
# Removed: arrow-app, arrow-bind, returnA, loop, pipe, handle, typeof,
#   stmt-const, stmt-module, is, may, must, not.infix, when, vau.
# Added: product, nullish, opt-chain, rec, while, for, return, law, trait,
#   impl, infer, type, do-while.
# Updated: if.prefix — removed `then` from child_separators (v0.1 uses braces).
# Updated: while.prefix — now `while cond { body }` with delimited block.
# Updated: for.prefix — now `for x in xs { body }` with delimited block.
# Updated: binding powers per ADR-0074 ID.1 precedence table:
#   field-access/index/call (90), pow (65), mul/div/mod (60), add/sub (55),
#   comparisons (50), && (48/49), || (46/47), ?? nullish (45/46),
#   ?. opt-chain (45/46), *** product (35/36), &&& fanout (35/36),
#   >>> flow (25/26), ||| choice (20/21), ?: ternary (15/16),
#   : type-annot (12/13), ~> arrow (10/9, right-assoc), = assign (5/6).
# Retained: axiom token — grammar.axiom.prefix aliases it to a `law` node.
# Added (graded-theory declarations, ADR-0098/0100): sort, grade, op,
#   handler, rewrite prefixes; `law`/`axiom` re-shaped as 2-cells
#   `name : source => target` (children [name, source, target]).
#
# NOTE (ADR-0053 scope boundary): several v0.1 constructs are NOT expressible
# in a declarative Pratt grammar and require parser-level contextual
# disambiguation:
#   - multi-way `if { c1: e1, _: e2 }` (distinguished by `{` after `if`)
#   - `for` fold form `for x in xs, acc = init { body }` (parser checks if
#     `,` follows `xs`)
#   - contextual `{}` (block vs object vs map literal)
#   - unbraced `while cond\n  body` (parser-level contextual disambiguation)
# These are implementation tasks for the hand-written parser; the rows below
# only encode the braced forms.
- id: grammar.and.infix
  token: token.and
  position: Infix
  binding_power:
    - 48
    - 49
  child_shape:
    node_kind: binary.and
    arity: 2
- id: grammar.arrow.infix
  token: token.arrow
  position: Infix
  binding_power:
    - 10
    - 9
  child_shape:
    node_kind: function
    arity: 2
    block_children:
      - 1
# `graded_arrow.infix` — ternary graded arrow `A ~G~> B`. The Pratt engine
# special-cases `token.tilde` because the declarative grammar cannot express
# an infix operator whose closing delimiter is a different token (`~>`).
# The row still declares the binding power and resulting `graded_arrow`
# node shape for the special-case code to use.
- id: grammar.graded_arrow.infix
  token: token.tilde
  position: Infix
  binding_power:
    - 10
    - 9
  child_shape:
    node_kind: graded_arrow
    arity: 3
# `not.prefix` uses `token.bang` (`!`) — the v0.1 negation operator.
# The `not` keyword infix (`grammar.not.infix`) is removed in v0.1.
- id: grammar.not.prefix
  token: token.bang
  position: Prefix
  binding_power:
    - 70
    - 0
  child_shape:
    node_kind: unary.not
    arity: 1
- id: grammar.value.bool
  token: token.bool
  position: Prefix
  child_shape:
    node_kind: value
    arity: 0
- id: grammar.type-annot.infix
  token: token.colon
  position: Infix
  binding_power:
    - 12
    - 13
  child_shape:
    node_kind: type-annot
    arity: 2
- id: grammar.field-access.postfix
  token: token.dot
  position: Infix
  binding_power:
    - 90
    - 91
  child_shape:
    node_kind: field-access
    arity: 2
- id: grammar.eq.infix
  # `=` is equality (a lone `=` yields a bool). `==` lexes to the same
  # token, so `a == b` and `a = b` are both equality.
  token: token.equal
  position: Infix
  binding_power:
    - 50
    - 51
  child_shape:
    node_kind: binary.eq
    arity: 2
- id: grammar.ellipsis.prefix
  token: token.ellipsis
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: rest
    arity: 1
- id: grammar.assign.infix
  # `::` is the binding/definition operator (was `=`). Produces an `assign`
  # node: `x :: expr`.
  token: token.bind
  position: Infix
  binding_power:
    - 5
    - 6
  child_shape:
    node_kind: assign
    arity: 2
- id: grammar.fanout.infix
  token: token.fanout
  position: Infix
  binding_power:
    - 35
    - 36
  child_shape:
    node_kind: fanout
    arity: 2
- id: grammar.choice.infix
  token: token.choice
  position: Infix
  binding_power:
    - 20
    - 21
  child_shape:
    node_kind: choice
    arity: 2
# `|` pipe — low-precedence infix for constructor alternatives in `data`
# declarations (ADR-0082). Creates `alt` nodes: `Zero | Succ(Nat)` parses
# as `alt(Zero, Succ(Nat))`. Binding power 1/2 is lower than every other
# operator so `|` only appears at the top level of a constructor list.
- id: grammar.pipe.infix
  token: token.pipe
  position: Infix
  binding_power:
    - 1
    - 2
  child_shape:
    node_kind: alt
    arity: 2
- id: grammar.flow.infix
  token: token.flow
  position: Infix
  binding_power:
    - 25
    - 26
  child_shape:
    node_kind: flow
    arity: 2
- id: grammar.product.infix
  token: token.product
  position: Infix
  binding_power:
    - 35
    - 36
  child_shape:
    node_kind: product
    arity: 2
# `f +++ g` — categorical sum combinator (arrow `+++`). Same precedence
# band as `***` product / `&&&` fanout (35/36).
- id: grammar.sum.infix
  token: token.sum
  position: Infix
  binding_power:
    - 35
    - 36
  child_shape:
    node_kind: sum
    arity: 2
# `f app x` — arrow application (arrow `App` combinator). `app` is a
# keyword infix; it binds tighter than the arithmetic operators but below
# call/index/field-access (85/86), so `f app x(y)` / `f app x[i]` group
# the argument expression as expected.
- id: grammar.app.infix
  token: token.keyword.app
  position: Infix
  binding_power:
    - 85
    - 86
  child_shape:
    node_kind: app
    arity: 2
- id: grammar.nullish.infix
  token: token.nullish
  position: Infix
  binding_power:
    - 45
    - 46
  child_shape:
    node_kind: nullish
    arity: 2
- id: grammar.opt-chain.postfix
  token: token.opt_chain
  position: Infix
  binding_power:
    - 45
    - 46
  child_shape:
    node_kind: opt-chain
    arity: 2
- id: grammar.gt.infix
  token: token.gt
  position: Infix
  binding_power:
    - 50
    - 51
  child_shape:
    node_kind: binary.gt
    arity: 2
- id: grammar.gte.infix
  token: token.gte
  position: Infix
  binding_power:
    - 50
    - 51
  child_shape:
    node_kind: binary.gte
    arity: 2
- id: grammar.identifier.prefix
  token: token.identifier
  position: Prefix
  child_shape:
    node_kind: var
    arity: 0
- id: grammar.json.prefix
  token: token.json
  position: Prefix
  child_shape:
    node_kind: json
    arity: 0
# v0.1: `if cond { body } else { body }`.
# The `then` keyword is removed (ADR-0074). The `else` keyword is the
# separator between the then-branch (child 1) and the else-branch (child 2).
# `Optional(token.keyword.then)` at index 0 is a no-op (the `then` token was
# removed from the lexer), but it shifts `else` to separator index 1 so it
# is consumed between child 1 and child 2 — not between child 0 and child 1.
# NOTE: multi-way `if { c1: e1, _: e2 }` is distinguished by the token
# after `if` — if `{`, it's multi-way. This contextual disambiguation
# is not expressible in the declarative Pratt grammar; it requires
# parser-level lookahead (implementation task).
- id: grammar.if.prefix
  token: token.keyword.if
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: if
    arity: 3
    block_children:
      - 1
      - 2
    # `else` clause is optional (ADR-0053 `optional_children`): child 2 is
    # parsed only when the `else` keyword follows the then-block — the
    # keyword is the disambiguator, so a following statement is never
    # swallowed as the else branch (`if c {x} y` = `if` + `y`).
    optional_children:
      - 2
    child_separators:
      - !Optional token.keyword.then
      - !Required token.keyword.else
- id: grammar.stmt-export.prefix
  token: token.keyword.export
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: stmt.export
    arity: 1
- id: grammar.stmt-import.prefix
  token: token.keyword.import
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: stmt.import
    arity: 1
# `from "path" import <names> [as <alias>]` — the path is a child
# expression and the `import ...` tail is a sequence of trailing tokens
# (`AstShapeRef::trailing_tokens`, ADR-0053): `import` is required, then
# either `*` (whole module) or a single exported name — captured into
# `payload.names` — then an optional `as <alias>` (identifier or string)
# captured into `payload.alias`. This covers `from "p" import *`,
# `from "p" import * as m`, `from "p" import name`, and
# `from "p" import name as local`. The path string is lifted out of the
# child into `payload.path` via a required `payload_extract` step — a
# non-string path child is a parse error.
- id: grammar.stmt-from.prefix
  token: token.keyword.from
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: stmt.import
    arity: 1
    payload_extract:
      - child: 0
        field: path
        required: true
    trailing_tokens:
      - kinds:
          - token.keyword.import
      - kinds:
          - token.star
          - token.identifier
        field: names
      - kinds:
          - token.keyword.as
        optional: true
      # The alias is consumed only when `as` matched — otherwise a
      # following statement's leading identifier would be swallowed.
      - kinds:
          - token.identifier
          - token.string
        field: alias
        requires_prev_match: true
# `match` supports an optional `return ... with` motive clause and produces a
# `match` node with 2 or 3 children: [scrutinee, (motive,) arms]. Surface forms:
#   match scrutinee { arms }
#   match scrutinee return motive with { arms }
#   match (scrutinee : Type(indices...)) return motive with { arms }
# The motive clause is expressed generically via `keyword_clauses`: after
# fixed child 0 (the scrutinee), if the next token is `return`, a motive
# expression is parsed and `with` is required; the motive is spliced in as
# an extra child before the delimited arm block (ADR-0053).
- id: grammar.match.prefix
  token: token.keyword.match
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: match
    arity: 2
    keyword_clauses:
      - after_child: 0
        open: token.keyword.return
        close: token.keyword.with
        binding_power: 0
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: token.comma
      container_kind: block
      pair:
        separator: token.colon
        node_kind: arm
      open_is_operator_token: false
      flatten: false
# `rec` introduces a recursive region (ADR-0074 Correction 2).
# Like `do-block` but with recursive feedback semantics.
# ADR-0079: changed to arrow's `rec { state } ( body )` syntax (arity 2).
# child 0 = `{ state }` (object literal expression), child 1 = `( body )`
# (parenthesized, flattened). The `rec` node has kind `rec` and children
# `[state_object, body_expr]`.
- id: grammar.rec.prefix
  token: token.keyword.rec
  position: Prefix
  binding_power:
    - 91
    - 0
  child_shape:
    node_kind: rec
    arity: 2
    delimited:
      open: token.lparen
      close: token.rparen
      separator: token.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true
# `while cond { body }` — pre-test loop (ADR-0074 A.5).
# child 0 is the condition expression, child 1 is the delimited block body.
# The unbraced form `while cond\n  body` requires parser-level contextual
# disambiguation (not expressible in declarative Pratt grammar).
- id: grammar.while.prefix
  token: token.keyword.while
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: while
    arity: 2
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: token.semicolon
      container_kind: block
      open_is_operator_token: false
      flatten: true
# `for x in xs { body }` — sugar over `rec` + destructuring (ADR-0074 A.2).
# child 0 = x, consume `in`, child 1 = xs, child 2 = delimited block `{ body }`.
# The fold form `for x in xs, acc = init { body }` requires parser-level
# contextual disambiguation (the parser must check if `,` follows `xs`).
# This is the same limitation as multi-way `if`.
- id: grammar.for.prefix
  token: token.keyword.for
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: for
    arity: 3
    child_separators:
      - !Required token.keyword.in
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: token.semicolon
      container_kind: block
      open_is_operator_token: false
      flatten: true
# `return expr` — early exit (ADR-0074).
- id: grammar.return.prefix
  token: token.keyword.return
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: return
    arity: 1
# `law name : source => target` — compile-time law declaration (ADR-0074;
# re-shaped as a 2-cell by ADR-0100). Three children: [name, source, target].
# The name child parses at rbp 14 so it stops before the `:` separator
# (`token.colon` infix has lbp 12); the source child parses at rbp 0 and
# stops before `=>` (`token.fat_arrow` has no infix row). The name string is
# also lifted into `payload.name`.
- id: grammar.law.prefix
  token: token.keyword.law
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: law
    arity: 3
    child_binding_powers:
      - 14
      - 0
      - 0
    child_separators:
      - !Required token.colon
      - !Required token.fat_arrow
    payload_extract:
      - child: 0
        field: name
# `axiom name : source => target` — compatible alias for `law` (produces a
# `law` node, same 2-cell shape).
# Note: the `axiom name : Type -> Type` / `guarantee:` contract files under
# `handl-packages/contracts/` (and the contract headers in
# `str`/`char`/`time`/`unicode`) are a separate dialect parsed by
# `plugin-ext-refinement::loader::parse_contracts`, not by this grammar.
- id: grammar.axiom.prefix
  token: token.keyword.axiom
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: law
    arity: 3
    child_binding_powers:
      - 14
      - 0
      - 0
    child_separators:
      - !Required token.colon
      - !Required token.fat_arrow
    payload_extract:
      - child: 0
        field: name
# `rewrite name : source => target` — a directed rewrite rule (2-cell,
# ADR-0100). Same shape as `law` but produces a `rewrite` node: children
# [name, source, target], `payload.name` extracted from child 0.
- id: grammar.rewrite.prefix
  token: token.keyword.rewrite
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: rewrite
    arity: 3
    child_binding_powers:
      - 14
      - 0
      - 0
    child_separators:
      - !Required token.colon
      - !Required token.fat_arrow
    payload_extract:
      - child: 0
        field: name
# `sort Name(params...) grades G1, G2` — graded-theory sort declaration
# (a generating 0-cell, ADR-0098/0100). Two children: [name, grades].
# child 0 is the sort head — `var(Name)` or `call(Name, params...)` for the
# parameterized form (`sort Vec(T, n: Nat)`); the type parameters ride in
# the `call` node's argument children, exactly like `data`'s type child.
# child 1 is the grade expression after the required `grades` keyword; it is
# declared optional so a bare `sort Name` still parses. A multi-grade clause
# is a single expression — `grades (Addable, Comparable)` or a call such as
# `grades Lengthable(n)` — since `,` is not an infix operator.
# `payload.name` is extracted from the head child.
# NOTE: the angle-bracket parameter form `sort Vec<T, n: Nat>` is not
# expressible in the declarative Pratt grammar (`<` is the less-than infix);
# use the call form `sort Vec(T, n: Nat)`.
- id: grammar.sort.prefix
  token: token.keyword.sort
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: sort
    arity: 2
    optional_children:
      - 1
    child_separators:
      - !Required token.keyword.grades
    payload_extract:
      - child: 0
        field: name
# `grade Name` / `grade Name(params...)` — grade declaration (a generating
# 0-cell that is a proposition, ADR-0100). One child: the grade head —
# `var(Name)` or `call(Name, params...)` (e.g. `grade Lengthable(n: Nat)`).
# `payload.name` is extracted from it. `token.keyword.grade` also serves as
# the optional grade-clause keyword of `grammar.op.prefix` — trailing token
# steps are per-row, so the two uses do not conflict.
- id: grammar.grade.prefix
  token: token.keyword.grade
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: grade
    arity: 1
    payload_extract:
      - child: 0
        field: name
# `op name : signature` — graded operation declaration
# (a generating 1-cell, ADR-0098/0100). Two children: [name, signature].
# The signature is an arrow expression, either ungraded `A ~> B` (a `function`
# node) or graded `A ~G~> B` (a `graded_arrow` node). The name child parses at
# rbp 14 so it stops before `:` (lbp 12) — which also lets the parenthesized
# parameter form `op add(A: Addable) : (A, A) ~Addable~> A` parse the name as
# `call(add, A:Addable)`. The signature child parses at rbp 0 so it consumes
# the whole arrow expression. `payload.name` is extracted from the name child.
# NOTE: the angle-bracket parameter form `op add<A: Addable>` is not
# expressible (`<` is the less-than infix); use `op add(A: Addable) : ...`.
- id: grammar.op.prefix
  token: token.keyword.op
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: op
    arity: 2
    child_binding_powers:
      - 14
      - 0
    child_separators:
      - !Required token.colon
    payload_extract:
      - child: 0
        field: name
# `handler Name = impl` — handler declaration: a model for one sort
# (ADR-0098/0100). Two children: [name, impl]. The `=` (or `::`) binding
# token is the separator — the name child parses at rbp 6 so it stops before
# `token.bind` (lbp 5); the impl child is the model arrow expression
# (e.g. `() ~> { ... }`). `payload.name` is extracted from the name child.
- id: grammar.handler.prefix
  token: token.keyword.handler
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: handler
    arity: 2
    child_binding_powers:
      - 6
      - 0
    child_separators:
      - !Required token.bind
    payload_extract:
      - child: 0
        field: name
# `with handler do body` — install a handler for the duration of `body`.
# Two children: [handler, body]. The `do` keyword separates them.
- id: grammar.with.prefix
  token: token.keyword.with
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: with
    arity: 2
    child_binding_powers:
      - 0
      - 0
    child_separators:
      - !Required token.keyword.do
# `handle name = impl in body` — bind a named handler implementation.
# Three children: [target, impl, body]. `payload.name` is extracted from
# the target child.
- id: grammar.handle.prefix
  token: token.keyword.handle
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: handle
    arity: 3
    child_binding_powers:
      - 6
      - 0
      - 0
    child_separators:
      - !Required token.bind
      - !Required token.keyword.in
    payload_extract:
      - child: 0
        field: name
# `trait name body` — compile-time trait declaration (ADR-0074).
- id: grammar.trait.prefix
  token: token.keyword.trait
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: trait
    arity: 1
# `impl name body` — compile-time impl declaration (ADR-0074).
- id: grammar.impl.prefix
  token: token.keyword.impl
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: impl
    arity: 1
# `infer expr` — name an inferred type (ADR-0074).
- id: grammar.infer.prefix
  token: token.keyword.infer
  position: Prefix
  binding_power:
    - 70
    - 0
  child_shape:
    node_kind: infer
    arity: 1
# `arr op` — lift a named operation into an arrow (arrow `Arr`
# combinator). The operation name is a bare identifier consumed via
# `payload_tokens` (ADR-0053 §7b) into `payload.name` — it is not a child
# expression. The eval scheme (`eval.arr`) uses `op: "$payload"`; the
# engine resolves the actual op name from the node payload before
# dispatching the native op against the incoming value.
- id: grammar.arr.prefix
  token: token.keyword.arr
  position: Prefix
  binding_power:
    - 70
    - 0
  child_shape:
    node_kind: arr
    arity: 0
    payload_tokens:
      - token: token.identifier
        field: name
# `first f` / `second f` — map an arrow over one component of a pair
# (arrow `first`/`second` combinators). Unary prefixes like `neg`
# (binding power 70): `first f` binds only `f`.
- id: grammar.first.prefix
  token: token.keyword.first
  position: Prefix
  binding_power:
    - 70
    - 0
  child_shape:
    node_kind: first
    arity: 1
- id: grammar.second.prefix
  token: token.keyword.second
  position: Prefix
  binding_power:
    - 70
    - 0
  child_shape:
    node_kind: second
    arity: 1
# `left f` / `right f` — map an arrow over one variant of an either
# (arrow `left`/`right` combinators).
- id: grammar.left.prefix
  token: token.keyword.left
  position: Prefix
  binding_power:
    - 70
    - 0
  child_shape:
    node_kind: left
    arity: 1
- id: grammar.right.prefix
  token: token.keyword.right
  position: Prefix
  binding_power:
    - 70
    - 0
  child_shape:
    node_kind: right
    arity: 1
# `data Name :: <constructors>` — inductive type declaration (ADR-0082).
# The `data` keyword is followed by the type name (identifier), optional
# parenthesised type parameters/indices, `::`, and one child expression: the
# constructor list. Constructors are separated by `|` (pipe), which creates
# `alt` nodes. The desugar pass (`desugar_data`) reads the first child to
# obtain the type name and parameters, then walks the second child (`alt`
# tree) to extract constructors. Backward-compatible hand-built nodes may
# still carry the type name in `payload.name` with a single constructor
# child.
- id: grammar.data.prefix
  token: token.keyword.data
  position: Prefix
  binding_power:
    - 6
    - 0
  child_shape:
    node_kind: data
    arity: 2
    # Per-child right binding powers (ADR-0053): the type-expression child
    # parses at rbp 6 so it stops before the separating `::` (bind, lbp 5),
    # while the constructor list parses at rbp 0 so the low-precedence `|`
    # infix (lbp 1) still binds into `alt` nodes.
    child_binding_powers:
      - 6
      - 0
    # The family name is lifted out of the type-expression child into
    # `payload.name` (`var` payload, `name` property, or `callee`-role child
    # of a `call` node for `data Name(params...)`).
    payload_extract:
      - child: 0
        field: name
    child_separators:
      - !Required token.bind
# `type` — v0.1 type namespace (ADR-0074: "type.Str / type.Int / etc.
# namespace"). `type` is a keyword, but it is used as a namespace identifier
# in type expressions (`type.number`, `type.bool`, `type.string`, ...). It is
# parsed as an atom (a `var` node carrying the text "type") so that
# `type.number` parses as `field-access(var("type"), var("number"))`; the
# typechecker's `interpret_type_expr` reads the field name and mints the
# `type.<field>` type value.
#
# NOTE: this means the `type name body` *compile-time type declaration* form
# no longer parses as a single `type` node — a single-token Pratt prefix
# cannot both be an atom (for `type.X` field access) and a child-consuming
# prefix (for `type name body`), because `.` cannot start a sub-expression.
# Disambiguating the two forms requires contextual/lookahead parsing (as the
# ADR already notes for `{}` and `if`); that is future work. The `eval.type`
# / `type.type` / `ast.type` schemes are retained for when the declaration
# form is reintroduced with contextual parsing.
- id: grammar.type.prefix
  token: token.keyword.type
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: var
    arity: 0
- id: grammar.object.prefix
  token: token.lbrace
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: object
    arity: 1
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: token.comma
      container_kind: object
      pair:
        separator: token.colon
        node_kind: entry
      open_is_operator_token: true
      flatten: true
      rest_token: token.ellipsis
# `a[i]` — subscript. The `[` is both the infix operator and the opening
# delimiter (`open_is_operator_token`), so the delimited block parses the
# subscript expression and consumes the closing `]` — without it the `]`
# was left in the stream and silently truncated any following tokens
# (e.g. `r.b[0] + r.a` dropped `+ r.a`).
- id: grammar.index.postfix
  token: token.lbracket
  position: Infix
  binding_power:
    - 90
    - 91
  child_shape:
    node_kind: index
    arity: 2
    delimited:
      open: token.lbracket
      close: token.rbracket
      separator: ~
      container_kind: index
      open_is_operator_token: true
      flatten: true
- id: grammar.array.prefix
  token: token.lbracket
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: array
    arity: 1
    delimited:
      open: token.lbracket
      close: token.rbracket
      separator: token.comma
      container_kind: array
      open_is_operator_token: true
      flatten: true
      rest_token: token.ellipsis
# REMOVED: `let` is not a keyword — there is no `let` surface syntax. The
# language binds with `x = y` / `x :: y` (`grammar.assign.infix` /
# `grammar.bind.infix`); graph blocks `{ x = y; ... }` cover the old
# `let ... in` form (ADR-0079). The `let`/`stmt.let` node kinds remain as
# internal binding kinds (see `ast.let`, `eval.let`, `eval.stmt-let`) used
# by self-host/conformance fixtures — no grammar row produces them.
- id: grammar.do-block.prefix
  token: token.keyword.do
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: block
    arity: 1
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: ~
      container_kind: block
      open_is_operator_token: false
      flatten: true
# `do { body } while cond` — post-test loop (ADR-0074 A.6).
# `do` prefix produces a block; `while` in infix position produces a
# do-while node — but ONLY when the left operand is a `block` node (the
# `do {..}` form). `left_kinds` declares that left-context sensitivity:
# without it the infix would fire after ANY expression and swallow a
# following `while` statement (`x :: f() <nl> while {s} {step}` parsed the
# `{s}` state object as the do-while condition — gap #8 / comb.fanout).
- id: grammar.do-while.infix
  token: token.keyword.while
  position: Infix
  binding_power:
    - 5
    - 6
  child_shape:
    node_kind: do-while
    arity: 2
    left_kinds:
      - block
