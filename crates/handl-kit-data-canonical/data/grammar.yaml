# ADR-0079: `let ... in` removed. Graph blocks `{ x = y; ... }` replace it.
# The `let` grammar row is deleted; `eval_let` remains as dead code.
- id: grammar.do-block.prefix
  token: token.keyword.do
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: block
    arity: 1
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: ~
      container_kind: block
      open_is_operator_token: false
      flatten: true
# `do { body } while cond` — post-test loop (ADR-0074 A.6).
# `do` prefix produces a block; `while` in infix position (after an expression)
# produces a do-while node. The parser distinguishes infix `while` (after an
# expression) from prefix `while` (start of expression) by position.
- id: grammar.do-while.infix
  token: token.keyword.while
  position: Infix
  binding_power:
    - 5
    - 6
  child_shape:
    node_kind: do-while
    arity: 2
