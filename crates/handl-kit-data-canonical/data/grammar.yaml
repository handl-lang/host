      close: token.rbrace
      separator: token.semicolon
      container_kind: block
      open_is_operator_token: false
      flatten: true
# `while { state } (body)` — loop with state init and body proc.
# BP [91, 0] (same as the old `loop` keyword) so that `while { ... } ( ... )`
# parses as two children: the `{ state }` block (child 0, parsed with rbp=91,
# stops before `(`) and the `( body )` expression (child 1).
- id: grammar.while.prefix
  token: token.keyword.while
  position: Prefix
  binding_power:
  - 91
  - 0
  child_shape:
    node_kind: while
    arity: 2
# `for x in xs body` — sugar over `rec` + destructuring (ADR-0074 A.2).
- id: grammar.for.prefix
  token: token.keyword.for
  position: Prefix
  binding_power:
  - 0
  - 0
  child_shape:
    node_kind: for
    arity: 3
    child_separators:
    - !Required token.keyword.in
