# Grammar rule definitions — v0.1 surface syntax (ADR-0074).
# Removed: arrow-app, arrow-bind, returnA, loop, pipe, handle, typeof,
#   stmt-const, stmt-module, is, may, must, not.infix, when, vau.
# Added: product, nullish, opt-chain, rec, while, for, return, law, trait,
#   impl, infer, type.
# Updated: if.prefix — removed `then` from child_separators (v0.1 uses braces).
# Retained: axiom token (no grammar rule — alias for law).
- id: grammar.and.infix
  token: token.and
  position: Infix
  binding_power:
  - 35
  - 36
  child_shape:
    node_kind: binary.and
    arity: 2
- id: grammar.arrow.infix
  token: token.arrow
  position: Infix
  binding_power:
  - 31
  - 32
  child_shape:
    node_kind: function
    arity: 2
