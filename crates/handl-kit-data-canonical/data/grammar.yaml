# v0.1: `if cond { body } else { body }`.
# The `then` keyword is removed (ADR-0074). The `else` keyword is the
# separator between the then-branch (child 1) and the else-branch (child 2).
# `Optional(token.keyword.then)` at index 0 is a no-op (the `then` token was
# removed from the lexer), but it shifts `else` to separator index 1 so it
# is consumed between child 1 and child 2 — not between child 0 and child 1.
# NOTE: multi-way `if { c1: e1, _: e2 }` is distinguished by the token
# after `if` — if `{`, it's multi-way. This contextual disambiguation
# is not expressible in the declarative Pratt grammar; it requires
# parser-level lookahead (implementation task).
- id: grammar.if.prefix
  token: token.keyword.if
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: if
    arity: 3
    block_children:
    - 1
    - 2
    child_separators:
      - !Optional token.keyword.then
      - !Required token.keyword.else
- id: grammar.stmt-export.prefix
  token: token.keyword.export
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: stmt.export
    arity: 1
- id: grammar.stmt-import.prefix
  token: token.keyword.import
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: stmt.import
    arity: 1
- id: grammar.match.prefix
  token: token.keyword.match
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: match
    arity: 2
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: token.comma
      container_kind: block
      pair:
        separator: token.colon
        node_kind: arm
      open_is_operator_token: false
      flatten: false
# `rec` introduces a recursive region (ADR-0074 Correction 2).
# Like `do-block` but with recursive feedback semantics.
# ADR-0079: changed to arrow's `rec { state } ( body )` syntax (arity 2).
# child 0 = `{ state }` (object literal expression), child 1 = `( body )`
# (parenthesized, flattened). The `rec` node has kind `rec` and children
# `[state_object, body_expr]`.
- id: grammar.rec.prefix
  token: token.keyword.rec
  position: Prefix
  binding_power:
    - 91
    - 0
  child_shape:
    node_kind: rec
    arity: 2
    delimited:
      open: token.lparen
      close: token.rparen
      separator: token.comma
      container_kind: call
      open_is_operator_token: false
      flatten: true
# `while cond { body }` — pre-test loop (ADR-0074 A.5).
# child 0 is the condition expression, child 1 is the delimited block body.
# The unbraced form `while cond\n  body` requires parser-level contextual
# disambiguation (not expressible in declarative Pratt grammar).
- id: grammar.while.prefix
  token: token.keyword.while
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: while
    arity: 2
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: token.semicolon
      container_kind: block
      open_is_operator_token: false
      flatten: true
# `for x in xs { body }` — sugar over `rec` + destructuring (ADR-0074 A.2).
# child 0 = x, consume `in`, child 1 = xs, child 2 = delimited block `{ body }`.
# The fold form `for x in xs, acc = init { body }` requires parser-level
# contextual disambiguation (the parser must check if `,` follows `xs`).
# This is the same limitation as multi-way `if`.
- id: grammar.for.prefix
  token: token.keyword.for
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: for
    arity: 3
    child_separators:
      - !Required token.keyword.in
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: token.semicolon
      container_kind: block
      open_is_operator_token: false
      flatten: true
