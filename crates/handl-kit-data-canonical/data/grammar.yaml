# Grammar rule definitions — v0.1 surface syntax (ADR-0074).
# Removed: arrow-app, arrow-bind, returnA, loop, pipe, handle, typeof,
#   stmt-const, stmt-module, is, may, must, not.infix, when, vau.
# Added: product, nullish, opt-chain, rec, while, for, return, law, trait,
#   impl, infer, type, do-while.
# Updated: if.prefix — removed `then` from child_separators (v0.1 uses braces).
# Updated: while.prefix — now `while cond { body }` with delimited block.
# Updated: for.prefix — now `for x in xs { body }` with delimited block.
# Updated: binding powers per ADR-0074 ID.1 precedence table:
#   field-access/index/call (90), pow (65), mul/div/mod (60), add/sub (55),
#   comparisons (50), && (48/49), || (46/47), ?? nullish (45/46),
#   ?. opt-chain (45/46), *** product (35/36), &&& fanout (35/36),
#   >>> flow (25/26), ||| choice (20/21), ?: ternary (15/16),
#   : type-annot (12/13), ~> arrow (10/9, right-assoc), = assign (5/6).
# Retained: axiom token (no grammar rule — alias for law).
#
# NOTE (ADR-0053 scope boundary): several v0.1 constructs are NOT expressible
# in a declarative Pratt grammar and require parser-level contextual
# disambiguation:
#   - multi-way `if { c1: e1, _: e2 }` (distinguished by `{` after `if`)
#   - `for` fold form `for x in xs, acc = init { body }` (parser checks if
#     `,` follows `xs`)
#   - contextual `{}` (block vs object vs map literal)
#   - unbraced `while cond\n  body` (parser-level contextual disambiguation)
# These are implementation tasks for the hand-written parser; the rows below
# only encode the braced forms.
- id: grammar.and.infix
  token: token.and
  position: Infix
  binding_power:
    - 48
    - 49
  child_shape:
    node_kind: binary.and
    arity: 2
- id: grammar.arrow.infix
  token: token.arrow
  position: Infix
  binding_power:
    - 10
    - 9
  child_shape:
    node_kind: function
    arity: 2
    block_children:
    - 1
# `not.prefix` uses `token.bang` (`!`) — the v0.1 negation operator.
# The `not` keyword infix (`grammar.not.infix`) is removed in v0.1.
- id: grammar.not.prefix
