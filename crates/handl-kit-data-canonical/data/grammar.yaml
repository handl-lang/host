# `data Name = <constructors>` — inductive type declaration (ADR-0082).
# The `data` keyword is followed by the type name (identifier), optional
# parenthesised type parameters/indices, `=`, and one child expression: the
# constructor list. Constructors are separated by `|` (pipe), which creates
# `alt` nodes. The desugar pass (`desugar_data`) reads the first child to
# obtain the type name and parameters, then walks the second child (`alt`
# tree) to extract constructors. Backward-compatible hand-built nodes may
# still carry the type name in `payload.name` with a single constructor
# child.
- id: grammar.data.prefix
  token: token.keyword.data
  position: Prefix
  binding_power:
    # Left binding power is passed to the type-expression child; it must be
    # higher than `=` (assign) so `data Vec(n : Nat, a : Type) = ...` stops
    # parsing the type expression before the separating `=`.
    - 6
    - 0
  child_shape:
    node_kind: data
    arity: 2
    child_separators:
      - !Required token.equal
# `type` — v0.1 type namespace (ADR-0074: "type.Str / type.Int / etc.
# namespace"). `type` is a keyword, but it is used as a namespace identifier
# in type expressions (`type.number`, `type.bool`, `type.string`, ...). It is
# parsed as an atom (a `var` node carrying the text "type") so that
# `type.number` parses as `field-access(var("type"), var("number"))`; the
# typechecker's `interpret_type_expr` reads the field name and mints the
# `type.<field>` type value.
#
# NOTE: this means the `type name body` *compile-time type declaration* form
# no longer parses as a single `type` node — a single-token Pratt prefix
# cannot both be an atom (for `type.X` field access) and a child-consuming
# prefix (for `type name body`), because `.` cannot start a sub-expression.
# Disambiguating the two forms requires contextual/lookahead parsing (as the
# ADR already notes for `{}` and `if`); that is future work. The `eval.type`
# / `type.type` / `ast.type` schemes are retained for when the declaration
# form is reintroduced with contextual parsing.
- id: grammar.type.prefix
  token: token.keyword.type
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: var
    arity: 0
- id: grammar.object.prefix
  token: token.lbrace
  position: Prefix
  binding_power:
    - 0
    - 0
  child_shape:
    node_kind: object
    arity: 1
    delimited:
      open: token.lbrace
      close: token.rbrace
      separator: token.comma
      container_kind: object
      pair:
        separator: token.colon
        node_kind: entry
      open_is_operator_token: true
      flatten: true
      rest_token: token.ellipsis
