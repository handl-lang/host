- id: lex.or
  token_kind: token.or
  pattern: !Literal
    text: "||"
  priority: 10
# `or` — word form of `||` (binary.or). Same boundary rules as
# `lex.and.word`: `x.or`, `{or: f}`, `or_`, `forest`, … stay identifiers.
- id: lex.or.word
  token_kind: token.or
  pattern: !Literal
    text: "or"
  priority: 15
