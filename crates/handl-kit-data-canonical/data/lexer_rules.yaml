# Lexer rule definitions — v0.1 surface syntax (ADR-0074).
# Removed: arrow_app, arrow_bind, pipe, returnA, loop, handle,
#   typeof, module, const, is, may, must, when, not (keyword), vau.
# Added: rec, while, for, return, law, trait, impl, infer, type, from,
#   product (***), nullish (??), opt_chain (?.).
# Added (graded-theory declarations, ADR-0100): sort, grade, grades, op,
#   handler, rewrite keywords and the `=>` 2-cell arrow (lex.fat_arrow).
# Added (Option B frontier, ADR-0101 §2a): id2, where, cell_vcomp (=>>),
#   cell_hcomp (=>|), at_left (<@), at_right (@>), sharp (#), cobind (?>).
- id: lex.and
  token_kind: token.and
  pattern: !Literal
    text: "&&"
  priority: 10
# `and` — word form of `&&` (binary.and). Keyword-band priority with
# word-boundary rejection (see try_rule): `and`/`or` followed by an
# identifier-continue char, `.`, or `:` — or preceded by `.` — lex as
# identifiers, so `x.and`, `{and: f}`, `candy`, etc. are unaffected.
- id: lex.and.word
  token_kind: token.and
  pattern: !Literal
    text: "and"
  priority: 15
- id: lex.arrow
  token_kind: token.arrow
  pattern: !Literal
    text: "~>"
  priority: 10
- id: lex.tilde
  token_kind: token.tilde
  pattern: !Literal
    text: "~"
  priority: 10
# `~[ ... ]~>` — N-dimensional arrow bracket (ADR-0119).
# Higher priority (35) than `~`/`~>` and `[`/`]` so the combined tokens win.
- id: lex.dim_open
  token_kind: token.dim_open
  pattern: !Literal
    text: "~["
  priority: 35
- id: lex.dim_close
  token_kind: token.dim_close
  pattern: !Literal
    text: "]~>"
  priority: 35
- id: lex.arrow.unicode
  token_kind: token.arrow
  pattern: !Literal
    text: →
  priority: 10
- id: lex.bang
  token_kind: token.bang
  pattern: !Literal
    text: "!"
  priority: 20
