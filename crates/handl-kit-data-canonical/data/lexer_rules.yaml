# NOTE: `let` is not a keyword — both `lex.keyword.let` and `lex.let` (and
# the `token.keyword.let`/`token.let` kinds and `grammar.let.prefix` row)
# were removed. Source text `let` lexes as a `token.identifier` like any
# other name; bindings use `x = y` / `x :: y` or graph blocks. The
# `let`/`stmt.let` node kinds remain as internal binding kinds (eval/type
# schemes only) produced by self-host/conformance fixtures, not by any
# surface syntax.
- id: lex.keyword.in
  token_kind: token.keyword.in
  pattern: !Literal
    text: in
  priority: 15
- id: lex.keyword.infer
  token_kind: token.keyword.infer
  pattern: !Literal
    text: infer
  priority: 15
- id: lex.keyword.law
  token_kind: token.keyword.law
  pattern: !Literal
    text: law
  priority: 15
# `let` is removed (ADR-0079 completed): `lex.keyword.let` is a tombstone —
# it keeps `let` reserved (lexes to `token.keyword.let`, which has NO
# grammar row) so `let x :: v` errors with "unexpected token" rather than
# silently re-lexing as an identifier. Same pattern as `lex.keyword.then`.
- id: lex.keyword.left
  token_kind: token.keyword.left
  pattern: !Literal
    text: left
  priority: 15
- id: lex.keyword.let
  token_kind: token.keyword.let
  pattern: !Literal
    text: let
  priority: 15
