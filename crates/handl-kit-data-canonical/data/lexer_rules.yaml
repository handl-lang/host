- id: lex.dot
  token_kind: token.dot
  pattern: !Literal
    text: .
  priority: 30
- id: lex.ellipsis
  token_kind: token.ellipsis
  pattern: !Literal
    text: "..."
  priority: 10
- id: lex.eqeq
  # `==` lexes to the equality token (`token.equal`); the single `=` is the
  # binding operator — an alias of `::` (`token.bind`), so `{ x = y }` graph
  # blocks and `assert a = b` produce `assign` nodes.
  token_kind: token.equal
  pattern: !Literal
    text: ==
  priority: 10
- id: lex.equal
  token_kind: token.bind
  pattern: !Literal
    text: =
  priority: 20
- id: lex.colon_equal
  # `:=` is the canonical assignment/binding operator. Produces a distinct
  # `token.colon_equal` so the formatter surfaces `:=` and not `: =`.
  # Priority 20 (< lex.colon's 30) so the two-character `:=` wins over the
  # single `:` (longest match within priority).
  token_kind: token.colon_equal
  pattern: !Literal
    text: ":="
  priority: 20
- id: lex.bind
  # `::` is the binding token (was `=`). Priority 20 (< lex.colon's 30) so the
  # two-character `::` win over the single `:` (longest match within priority).
  token_kind: token.bind
  pattern: !Literal
    text: "::"
  priority: 20
- id: lex.fat_arrow
  # `=>` — the 2-cell arrow of `rewrite`/`law` declarations (ADR-0100).
  # Priority 10 (< lex.equal's 20) so `=>` wins over the bare `=`/`::`
  # binding token; longest-match ordering keeps `==` unaffected.
  token_kind: token.fat_arrow
  pattern: !Literal
    text: "=>"
  priority: 10
- id: lex.cell_vcomp
  # `=>>` — vertical cell composition (Option B, ADR-0101 §2a). Same
  # priority as `=>` so the longer literal wins on maximal munch.
  token_kind: token.cell_vcomp
  pattern: !Literal
    text: "=>>"
  priority: 10
- id: lex.cell_hcomp
  # `=>|` — horizontal cell composition (Option B, ADR-0101 §2a). Same
  # priority as `=>` so the longer literal wins on maximal munch.
  token_kind: token.cell_hcomp
  pattern: !Literal
    text: "=>|"
  priority: 10
- id: lex.fanout
  token_kind: token.fanout
  pattern: !Literal
    text: "&&&"
  priority: 10
- id: lex.choice
  token_kind: token.choice
  pattern: !Literal
    text: "|||"
  priority: 10
- id: lex.flow
  token_kind: token.flow
  pattern: !Literal
    text: ">>>"
  priority: 10
- id: lex.gt
  token_kind: token.gt
  pattern: !Literal
    text: ">"
  priority: 20
- id: lex.at_right
  # `@>` — right whisker (Option B, ADR-0101 §2a). Priority 9 runs before
  # `>=` and `>` so the two-character operator wins on maximal munch.
  token_kind: token.at_right
  pattern: !Literal
    text: "@>"
  priority: 9
- id: lex.gte
  token_kind: token.gte
  pattern: !Literal
    text: ">="
  priority: 10
- id: lex.identifier
  token_kind: token.identifier
  pattern: !CharClass
    start_chars: a-zA-Z_α-ωΑ-Ω
    continue_chars: a-zA-Z0-9_α-ωΑ-Ω
  priority: 50
- id: lex.json
  token_kind: token.json
  pattern: !Delimited
    open: "json{"
    close: "}"
    escape: false
    interpolation: false
    close_at_eof: false
    nesting_open: "{"
  priority: 5
