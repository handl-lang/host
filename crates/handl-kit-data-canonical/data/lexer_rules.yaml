- id: lex.sum
  # `+++` is the categorical sum combinator (arrow `+++`). Priority 10
  # (< lex.plus' 20) so the three-character operator wins over `+`
  # (longest match within priority) — same pattern as `***` vs `*`.
  token_kind: token.sum
  pattern: !Literal
    text: "+++"
  priority: 10
