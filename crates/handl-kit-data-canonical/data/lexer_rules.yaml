- id: lex.keyword.grade
  token_kind: token.keyword.grade
  pattern: !Literal
    text: grade
  priority: 15
# `grades` is the longer keyword — within the keyword band (15) the
# longest-literal-first ordering tries it before `grade`, so the plural
# clause keyword of `sort` declarations never splits as `grade` + `s`.
- id: lex.keyword.grades
  token_kind: token.keyword.grades
  pattern: !Literal
    text: grades
  priority: 15
