# Lexer rule definitions — v0.1 surface syntax (ADR-0074).
# Removed: arrow_app, arrow_bind, pipe, returnA, loop, where, handle,
#   typeof, module, const, is, may, must, when, not (keyword), vau.
# Added: rec, while, for, return, law, trait, impl, infer, type, from,
#   product (***), nullish (??), opt_chain (?.).
- id: lex.and
  token_kind: token.and
  pattern: !Literal
    text: "&&"
  priority: 10
# `and` — word form of `&&` (binary.and). Keyword-band priority with
# word-boundary rejection (see try_rule): `and`/`or` followed by an
# identifier-continue char, `.`, or `:` — or preceded by `.` — lex as
# identifiers, so `x.and`, `{and: f}`, `candy`, etc. are unaffected.
- id: lex.and.word
  token_kind: token.and
  pattern: !Literal
    text: "and"
  priority: 15
- id: lex.arrow
  token_kind: token.arrow
  pattern: !Literal
    text: "~>"
  priority: 10
- id: lex.arrow.unicode
  token_kind: token.arrow
  pattern: !Literal
    text: →
  priority: 10
- id: lex.bang
  token_kind: token.bang
  pattern: !Literal
