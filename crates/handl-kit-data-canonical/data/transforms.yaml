# Transform rule definitions (ADR-0094 — Generic AST Transform Engine).
#
# First-class `TransformDef` fragments, merged into `lang.transforms` at
# `Language` build. This file replaces the `desugar:` fields that used to
# sit on `AstShapeDef` rows in `ast.yaml`; the `desugar:` field still works
# (its rule is lowered into a `TransformDef` in pass "desugar" at merge)
# for backward compatibility with third-party fragments, but the canonical
# kit ships its transform rules here.
#
# Vocabulary (crates/handl-language/src/fragments/transform_def.rs):
#   rule:     !Declarative { target_kind, children, payload? }
#             | !Native "desugar.<form>"
#   children: !Keep <index> | !KeepRole <role> | !KeepPath [<i>, …]
#             | !KeepRest <index> | !Splice <index>
#             | !Create { kind, payload?, children }
#             | !Apply { rule_id, index }
#             | !Fresh <hint>
#   when:     !KindAt { index?, role?, kind } | !PayloadEq { path, value }
#             | !ChildCount <n> | !And […] | !Or […] | !Not <cond>

# `call` → `json` (ADR-0060 Layer 1): json{...}(args) is syntactic sugar.
# When the callee (child 0) is a `json` node, desugar the `call` into a
# `json` node that carries all original children. The `json` eval scheme
# then evaluates the args and performs $0/$1/… placeholder substitution
# into the template string (carried by child 0's payload).
- id: transform.desugar.call
  pass: desugar
  node_kind: call
  when: !KindAt
    index: 0
    kind: json
  rule: !Declarative
    target_kind: json
    children:
      - !Keep 0
      - !KeepRest 1

# `entry` computed key (ADR-0081): `[expr]: value` parses the key child as
# an `array` node; desugar wraps the key expression in `paren` so the
# object evaluator treats it as a computed key (evaluated at runtime)
# rather than a literal key.
- id: transform.desugar.entry
  pass: desugar
  node_kind: entry
  when: !KindAt
    index: 0
    kind: array
  rule: !Declarative
    target_kind: entry
    children:
      - !Create
        kind: paren
        children:
          - !KeepPath
            - 0
            - 0
      - !Keep 1

# `lower` pass (ADR-0094 follow-up): canonicalize object entry keys so the
# bytecode/cranelift backends can stop guessing whether a literal key is a
# `var` or a `string`.  The rule is authored in language data; the payload
# rewrite is implemented by the engine that opts in to the pass.
- id: transform.lower.entry
  pass: lower
  node_kind: entry
  when: !KindAt
    role: key
    kind: string
  rule: !Native "lower.object_key"

# `nullish` — `a ?? b` → `match a { { _tag: "Some", value: rec_v }: rec_v, _: b }`.
- id: transform.desugar.nullish
  pass: desugar
  node_kind: nullish
  rule: !Declarative
    target_kind: match
    children:
      - !Keep 0
      - !Create
        kind: block
        children:
          - !Create
            kind: arm
            children:
              - !Create
                kind: object
                children:
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "_tag" }
                      - !Create { kind: lit, payload: "Some" }
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "value" }
                      - !Fresh "rec_v"
              - !Fresh "rec_v"
          - !Create
            kind: arm
            children:
              - !Create { kind: var, payload: "_" }
              - !Keep 1

# `opt-chain` — `a?.field` → `match a { { _tag: "Some", value: rec_v }: rec_v.field, _: {"_tag":"None"} }`.
- id: transform.desugar.opt-chain
  pass: desugar
  node_kind: opt-chain
  rule: !Declarative
    target_kind: match
    children:
      - !Keep 0
      - !Create
        kind: block
        children:
          - !Create
            kind: arm
            children:
              - !Create
                kind: object
                children:
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "_tag" }
                      - !Create { kind: lit, payload: "Some" }
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "value" }
                      - !Fresh "rec_v"
              - !Create
                kind: field-access
                children:
                  - !Fresh "rec_v"
                  - !Keep 1
          - !Create
            kind: arm
            children:
              - !Create { kind: var, payload: "_" }
              - !Create { kind: lit, payload: { "_tag": "None" } }

# State-passing `while { state } { closure }` form (child 1 is a `function`)
# is left untouched so the `loop_step` eval protocol can handle it.
- id: transform.desugar.while.state
  pass: desugar
  node_kind: while
  priority: -1
  when: !KindAt { index: 1, kind: function }
  rule: !Declarative
    target_kind: while
    children:
      - !Keep 0
      - !KeepRest 1

# `while cond { body }` → `rec { __continue = cond, __result = if __continue { body; __continue = cond } else { __result } }`.
- id: transform.desugar.while
  pass: desugar
  node_kind: while
  priority: 1
  rule: !Declarative
    target_kind: rec
    children:
      - !Create
        kind: assign
        children:
          - !Fresh "__continue"
          - !Keep 0
      - !Create
        kind: assign
        children:
          - !Fresh "__result"
          - !Create
            kind: if
            children:
              - !Fresh "__continue"
              - !Create
                kind: block
                children:
                  - !KeepRest 1
                  - !Create
                    kind: assign
                    children:
                      - !Fresh "__continue"
                      - !Keep 0
              - !Fresh "__result"

# `for x in xs { body }` → `rec` over destructured iteration.
- id: transform.desugar.for
  pass: desugar
  node_kind: for
  rule: !Declarative
    target_kind: rec
    children:
      - !Create
        kind: assign
        children:
          - !Fresh "__xs"
          - !Keep 1
      - !Create
        kind: assign
        children:
          - !Fresh "__result"
          - !Create
            kind: array
            payload: { "children": [] }
      - !Create
        kind: assign
        children:
          - !Fresh "__result"
          - !Create
            kind: match
            children:
              - !Fresh "__xs"
              - !Create
                kind: block
                children:
                  - !Create
                    kind: arm
                    children:
                      - !Create
                        kind: array
                        payload: { "children": [] }
                      - !Fresh "__result"
                  - !Create
                    kind: arm
                    children:
                      - !Create
                        kind: array
                        children:
                          - !Keep 0
                          - !Create
                            kind: rest
                            children:
                              - !Fresh "rec_tail"
                      - !Create
                        kind: block
                        children:
                          - !KeepRest 2
                          - !Create
                            kind: assign
                            children:
                              - !Fresh "__xs"
                              - !Fresh "rec_tail"
