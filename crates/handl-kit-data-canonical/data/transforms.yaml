# Transform rule definitions (ADR-0094 — Generic AST Transform Engine).
#
# First-class `TransformDef` fragments, merged into `lang.transforms` at
# `Language` build. This file replaces the `desugar:` fields that used to
# sit on `AstShapeDef` rows in `ast.yaml`; the `desugar:` field still works
# (its rule is lowered into a `TransformDef` in pass "desugar" at merge)
# for backward compatibility with third-party fragments, but the canonical
# kit ships its transform rules here.
#
# Vocabulary (crates/handl-language/src/fragments/transform_def.rs):
#   rule:     !Declarative { target_kind, children, payload? }
#             | !Native "desugar.<form>"
#   children: !Keep <index> | !KeepRole <role> | !KeepPath [<i>, …]
#             | !KeepRest <index> | !Splice <index>
#             | !Create { kind, payload?, children }
#             | !Apply { rule_id, index }
#             | !Fresh <hint>
#   when:     !KindAt { index?, role?, kind } | !PayloadEq { path, value }
#             | !ChildCount <n> | !And […] | !Or […] | !Not <cond>

# `dimension` — `f<X, Y>` lowers to the application `f(X, Y)` (ADR-0106
# §11/§12). A dimension node's children are already `[target, args...]`,
# exactly a `call`'s, so the rewrite is a re-tagging: the proven `call`
# eval machinery then performs the application. Without this rule the
# desugar pass has no rewrite for the kind and the node is dropped from its
# parent's child list (it becomes unreachable), which is how the original
# `f<41>` silently evaluated to `41`.
- id: transform.desugar.dimension
  pass: desugar
  node_kind: dimension
  rule: !Declarative
    target_kind: call
    children:
      - !Keep 0
      - !KeepRest 1

# `entry` computed key (ADR-0081): `[expr]: value` parses the key child as
# an `array` node; desugar wraps the key expression in `paren` so the
# object evaluator treats it as a computed key (evaluated at runtime)
# rather than a literal key.
- id: transform.desugar.entry
  pass: desugar
  node_kind: entry
  when: !KindAt
    index: 0
    kind: array
  rule: !Declarative
    target_kind: entry
    children:
      - !Create
        kind: paren
        children:
          - !KeepPath
            - 0
            - 0
      - !Keep 1

# `do { body } while cond` → `block { body; while-expansion }`
# (ADR-0074 A.6). The body runs once before the condition is checked —
# expressed as `body` followed by the same `rec` feedback region `while`
# desugars to:
#   block { body,
#           rec { __continue = cond,
#                 __result = if __continue { body; __continue = cond }
#                            else { __result } } }
# The earlier `rec { __result = body, __continue = cond, __result = if … }`
# shape could never converge: `rec` re-evaluates every binding each
# fixpoint pass, so the `__result = body` init binding re-ran the body
# unconditionally and `__result` oscillated forever (fuel limit).
# (Formerly the `desugar.do_while` native.)
- id: transform.desugar.do_while
  pass: desugar
  node_kind: do-while
  rule: !Declarative
    target_kind: block
    children:
      # body — runs exactly once, before the condition is checked.
      - !Keep 0
      # then the `while cond { body }` expansion.
      - !Create
        kind: rec
        children:
          # __continue = cond
          - !Create
            kind: assign
            children:
              - !Fresh "__continue"
              - !Keep 1
          # __result = if __continue { body; __continue = cond } else __result
          - !Create
            kind: assign
            children:
              - !Fresh "__result"
              - !Create
                kind: if
                children:
                  - !Fresh "__continue"
                  - !Create
                    kind: block
                    children:
                      - !Keep 0
                      - !Create
                        kind: assign
                        children:
                          - !Fresh "__continue"
                          - !Keep 1
                  - !Fresh "__result"

# `lower` pass (ADR-0094 follow-up): canonicalize object entry keys so the
# bytecode/cranelift backends can stop guessing whether a literal key is a
# `var` or a `string`.  The rule is authored in language data; the payload
# rewrite is implemented by the engine that opts in to the pass.
- id: transform.lower.entry
  pass: lower
  node_kind: entry
  when: !KindAt
    role: key
    kind: string
  rule: !Native "lower.object_key"

# `nullish` — `a ?? b` → `match a { { _tag: "Some", value: rec_v }: rec_v, _: b }`.
- id: transform.desugar.nullish
  pass: desugar
  node_kind: nullish
  rule: !Declarative
    target_kind: match
    children:
      - !Keep 0
      - !Create
        kind: block
        children:
          - !Create
            kind: arm
            children:
              - !Create
                kind: object
                children:
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "_tag" }
                      - !Create { kind: lit, payload: "Some" }
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "value" }
                      - !Fresh "rec_v"
              - !Fresh "rec_v"
          - !Create
            kind: arm
            children:
              - !Create { kind: var, payload: "_" }
              - !Keep 1

# `opt-chain` — `a?.field` → `match a { { _tag: "Some", value: rec_v }: rec_v.field, _: {"_tag":"None"} }`.
- id: transform.desugar.opt-chain
  pass: desugar
  node_kind: opt-chain
  rule: !Declarative
    target_kind: match
    children:
      - !Keep 0
      - !Create
        kind: block
        children:
          - !Create
            kind: arm
            children:
              - !Create
                kind: object
                children:
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "_tag" }
                      - !Create { kind: lit, payload: "Some" }
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "value" }
                      - !Fresh "rec_v"
              - !Create
                kind: field-access
                children:
                  - !Fresh "rec_v"
                  - !Keep 1
          - !Create
            kind: arm
            children:
              - !Create { kind: var, payload: "_" }
              - !Create { kind: lit, payload: { "_tag": "None" } }

# State-passing `while { state } { closure }` form (child 1 is a `function`)
# is left untouched so the `loop_step` eval protocol can handle it.
- id: transform.desugar.while.state
  pass: desugar
  node_kind: while
  priority: -1
  when: !KindAt { index: 1, kind: function }
  rule: !Declarative
    target_kind: while
    children:
      - !Keep 0
      - !KeepRest 1

# `while cond { body }` → `rec { __continue = cond, __result = if __continue { body; __continue = cond } else { __result } }`.
- id: transform.desugar.while
  pass: desugar
  node_kind: while
  priority: 1
  rule: !Declarative
    target_kind: rec
    children:
      - !Create
        kind: assign
        children:
          - !Fresh "__continue"
          - !Keep 0
      - !Create
        kind: assign
        children:
          - !Fresh "__result"
          - !Create
            kind: if
            children:
              - !Fresh "__continue"
              - !Create
                kind: block
                children:
                  - !KeepRest 1
                  - !Create
                    kind: assign
                    children:
                      - !Fresh "__continue"
                      - !Keep 0
              - !Fresh "__result"

# `for x in xs { body }` → `block { __xs = xs; __result = []; rec {...} }`.
# The collection/accumulator init bindings are hoisted OUT of the `rec`
# region: `rec` re-evaluates every binding each fixpoint pass, so an
# in-region `__xs = xs` would reset the iterator every pass and the loop
# could never advance (fuel limit). Inside the region, `__xs`/`__result`
# are read from (and `__xs` written back to) the enclosing block scope via
# the `assign` feedback-wire semantics.
- id: transform.desugar.for
  pass: desugar
  node_kind: for
  rule: !Declarative
    target_kind: block
    children:
      # __xs = xs  (once — the iteration cursor)
      - !Create
        kind: assign
        children:
          - !Fresh "__xs"
          - !Keep 1
      # __result = []  (once — the accumulator seed)
      - !Create
        kind: assign
        children:
          - !Fresh "__result"
          - !Create
            kind: array
            payload: { "children": [] }
      # rec { __result = match __xs { []: __result, [x, ...rec_tail]: block { body; __xs = rec_tail } } }
      - !Create
        kind: rec
        children:
          - !Create
            kind: assign
            children:
              - !Fresh "__result"
              - !Create
                kind: match
                children:
                  - !Fresh "__xs"
                  - !Create
                    kind: block
                    children:
                      - !Create
                        kind: arm
                        children:
                          - !Create
                            kind: array
                            payload: { "children": [] }
                          - !Fresh "__result"
                      - !Create
                        kind: arm
                        children:
                          - !Create
                            kind: array
                            children:
                              - !Keep 0
                              - !Create
                                kind: rest
                                children:
                                  - !Fresh "rec_tail"
                          - !Create
                            kind: block
                            children:
                              - !KeepRest 2
                              - !Create
                                kind: assign
                                children:
                                  - !Fresh "__xs"
                                  - !Fresh "rec_tail"

# ---------------------------------------------------------------------------
# Meta-transform placeholder for N-dimensional arrow rewrites (ADR-0119).
# Real meta-transforms need `dim_arrow` rules (and a `rule` AST node that the
# canonical surface does not yet expose), so this is an identity placeholder.
# ---------------------------------------------------------------------------
- id: transform.meta.dim_arrow_identity
  pass: meta-transform
  node_kind: dim_arrow
  rule: !Declarative
    target_kind: dim_arrow
    children:
      - !KeepRest 0

# ---------------------------------------------------------------------------
# N-dimensional 2-cell arrow optimization (ADR-0119).
# Rewrites a 1-cell `flow` (`>>>`) chain using the module's `~[2]~>` rules
# supplied to the `n_dim_arrow_opt` native by the host CLI.
# ---------------------------------------------------------------------------
- id: transform.n_dim_opt.flow
  pass: n_dim_opt
  node_kind: flow
  rule: !Native "n_dim_arrow_opt"
