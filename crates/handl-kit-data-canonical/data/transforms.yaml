# Transform rule definitions (ADR-0094 — Generic AST Transform Engine).
#
# First-class `TransformDef` fragments, merged into `lang.transforms` at
# `Language` build. This file replaces the `desugar:` fields that used to
# sit on `AstShapeDef` rows in `ast.yaml`; the `desugar:` field still works
# (its rule is lowered into a `TransformDef` in pass "desugar" at merge)
# for backward compatibility with third-party fragments, but the canonical
# kit ships its transform rules here.
#
# Vocabulary (crates/handl-language/src/fragments/transform_def.rs):
#   rule:     !Declarative { target_kind, children, payload? }
#             | !Native "desugar.<form>"
#   children: !Keep <index> | !KeepRole <role> | !KeepPath [<i>, …]
#             | !KeepRest <index> | !Splice <index>
#             | !Create { kind, payload?, children }
#             | !Apply { rule_id, index }
#   when:     !KindAt { index?, role?, kind } | !PayloadEq { path, value }
#             | !ChildCount <n> | !And […] | !Or […] | !Not <cond>

# `call` → `json` (ADR-0060 Layer 1): json{...}(args) is syntactic sugar.
# When the callee (child 0) is a `json` node, desugar the `call` into a
# `json` node that carries all original children. The `json` eval scheme
# then evaluates the args and performs $0/$1/… placeholder substitution
# into the template string (carried by child 0's payload).
- id: transform.desugar.call
  pass: desugar
  node_kind: call
  when: !KindAt
    index: 0
    kind: json
  rule: !Declarative
    target_kind: json
    children:
      - !Keep 0
      - !KeepRest 1

# `entry` computed key (ADR-0081): `[expr]: value` parses the key child as
# an `array` node; desugar wraps the key expression in `paren` so the
# object evaluator treats it as a computed key (evaluated at runtime)
# rather than a literal key.
- id: transform.desugar.entry
  pass: desugar
  node_kind: entry
  when: !KindAt
    index: 0
    kind: array
  rule: !Declarative
    target_kind: entry
    children:
      - !Create
        kind: paren
        children:
          - !KeepPath
            - 0
            - 0
      - !Keep 1

# `a ?? b` → `match a { Some: rec_v, _: b }` (ADR-0074 A.5). The `some`
# pattern is the object-destructuring shape `{"_tag": "Some", "value":
# rec_v}`; the wildcard arm catches `none`/`null`/anything else.
# (Formerly the `desugar.nullish` native — expressible declaratively
# because the rewrite is a fixed `Create` tree over remapped children; the
# `rec_v` binder is a fixed `__`-namespace name, not a gensym.)
- id: transform.desugar.nullish
  pass: desugar
  node_kind: nullish
  rule: !Declarative
    target_kind: match
    children:
      - !Keep 0
      - !Create
        kind: block
        children:
          # arm(object {_tag: "Some", value: rec_v}, var rec_v)
          - !Create
            kind: arm
            children:
              - !Create
                kind: object
                children:
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "_tag" }
                      - !Create { kind: lit, payload: "Some" }
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "value" }
                      - !Create { kind: var, payload: "rec_v" }
              - !Create { kind: var, payload: "rec_v" }
          # arm(var "_", b)
          - !Create
            kind: arm
            children:
              - !Create { kind: var, payload: "_" }
              - !Keep 1

# `a?.field` → `match a { Some: rec_v.field, _: None }` (ADR-0074 A.5).
# (Formerly the `desugar.opt_chain` native.)
- id: transform.desugar.opt_chain
  pass: desugar
  node_kind: opt-chain
  rule: !Declarative
    target_kind: match
    children:
      - !Keep 0
      - !Create
        kind: block
        children:
          # arm(object {_tag: "Some", value: rec_v}, field-access(rec_v, field))
          - !Create
            kind: arm
            children:
              - !Create
                kind: object
                children:
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "_tag" }
                      - !Create { kind: lit, payload: "Some" }
                  - !Create
                    kind: entry
                    children:
                      - !Create { kind: var, payload: "value" }
                      - !Create { kind: var, payload: "rec_v" }
              - !Create
                kind: field-access
                children:
                  - !Create { kind: var, payload: "rec_v" }
                  - !Keep 1
          # arm(var "_", lit {"_tag": "None"})
          - !Create
            kind: arm
            children:
              - !Create { kind: var, payload: "_" }
              - !Create { kind: lit, payload: { _tag: "None" } }

# `while cond { body }` → `rec` feedback region (ADR-0074 A.4):
#   rec { __continue = cond,
#         __result = if __continue { body...; __continue = cond }
#                    else { __result } }
# Guard: the state-passing `while { state } { step-fn }` form (child 1 is a
# `function` node) is NOT desugared — it retains the `loop_step` eval
# protocol. serde_yaml cannot express `!Not` around an enum condition, so
# the guard is a higher-priority identity rewrite (rebuilds the node with
# remapped children — identical output to a pass-through).
# `__continue`/`__result` are fixed `__`-namespace names.
# (Formerly the `desugar.while` native.)
- id: transform.desugar.while.state_form
  pass: desugar
  node_kind: while
  priority: -1
  when: !KindAt
    index: 1
    kind: function
  rule: !Declarative
    target_kind: while
    children:
      - !Keep 0
      - !Keep 1
- id: transform.desugar.while
  pass: desugar
  node_kind: while
  rule: !Declarative
    target_kind: rec
    children:
      # __continue = cond
      - !Create
        kind: assign
        children:
          - !Create { kind: var, payload: "__continue" }
          - !Keep 0
      # __result = if __continue { body...; __continue = cond } else __result
      - !Create
        kind: assign
        children:
          - !Create { kind: var, payload: "__result" }
          - !Create
            kind: if
            children:
              - !Create { kind: var, payload: "__continue" }
              - !Create
                kind: block
                children:
                  - !KeepRest 1
                  - !Create
                    kind: assign
                    children:
                      - !Create { kind: var, payload: "__continue" }
                      - !Keep 0
              - !Create { kind: var, payload: "__result" }

# `do { body } while cond` → `rec` region, body-first (ADR-0074 A.6):
#   rec { __result = body, __continue = cond,
#         __result = if __continue { body; __continue = cond }
#                    else { __result } }
# (Formerly the `desugar.do_while` native.)
- id: transform.desugar.do_while
  pass: desugar
  node_kind: do-while
  rule: !Declarative
    target_kind: rec
    children:
      # __result = body (run body first)
      - !Create
        kind: assign
        children:
          - !Create { kind: var, payload: "__result" }
          - !Keep 0
      # __continue = cond
      - !Create
        kind: assign
        children:
          - !Create { kind: var, payload: "__continue" }
          - !Keep 1
      # __result = if __continue { body; __continue = cond } else __result
      - !Create
        kind: assign
        children:
          - !Create { kind: var, payload: "__result" }
          - !Create
            kind: if
            children:
              - !Create { kind: var, payload: "__continue" }
              - !Create
                kind: block
                children:
                  - !Keep 0
                  - !Create
                    kind: assign
                    children:
                      - !Create { kind: var, payload: "__continue" }
                      - !Keep 1
              - !Create { kind: var, payload: "__result" }

# `for x in xs { body }` → `rec` over the collection (ADR-0074 A.5):
#   rec { __xs = xs, __result = [],
#         __result = match __xs {
#           []: __result
#           [x, ...rec_tail]: { body...; __xs = rec_tail } } }
# (Formerly the `desugar.for` native.)
- id: transform.desugar.for
  pass: desugar
  node_kind: for
  rule: !Declarative
    target_kind: rec
    children:
      # __xs = xs
      - !Create
        kind: assign
        children:
          - !Create { kind: var, payload: "__xs" }
          - !Keep 1
      # __result = []
      - !Create
        kind: assign
        children:
          - !Create { kind: var, payload: "__result" }
          - !Create { kind: array }
      # __result = match __xs { []: __result, [x, ...rec_tail]: block }
      - !Create
        kind: assign
        children:
          - !Create { kind: var, payload: "__result" }
          - !Create
            kind: match
            children:
              - !Create { kind: var, payload: "__xs" }
              - !Create
                kind: block
                children:
                  # arm(array [], var __result)
                  - !Create
                    kind: arm
                    children:
                      - !Create { kind: array }
                      - !Create { kind: var, payload: "__result" }
                  # arm(array [pattern, rest(rec_tail)],
                  #     block { body..., __xs = rec_tail })
                  - !Create
                    kind: arm
                    children:
                      - !Create
                        kind: array
                        children:
                          - !Keep 0
                          - !Create
                            kind: rest
                            children:
                              - !Create { kind: var, payload: "rec_tail" }
                      - !Create
                        kind: block
                        children:
                          - !KeepRest 2
                          - !Create
                            kind: assign
                            children:
                              - !Create { kind: var, payload: "__xs" }
                              - !Create { kind: var, payload: "rec_tail" }

# `lower` pass (ADR-0094 follow-up): canonicalize object entry keys so the
# bytecode/cranelift backends can stop guessing whether a literal key is a
# `var` or a `string`.  The rule is authored in language data; the payload
# rewrite is implemented by the engine that opts in to the pass.
- id: transform.lower.entry
  pass: lower
  node_kind: entry
  when: !KindAt
    role: key
    kind: string
  rule: !Native "lower.object_key"
