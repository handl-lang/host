- id: ast.call
  node_kind: call
  payload_schema:
    properties:
      args:
        items:
          type: object
        type: array
      callee:
        type: object
    required:
      - callee
      - args
    type: object
  # ADR-0060 Layer 1: json{...}(args) is syntactic sugar — see
  # `transform.desugar.call` in transforms.yaml, which rewrites a `call`
  # whose callee is a `json` node into that `json` node.
- id: ast.export
  node_kind: export
  payload_schema:
    properties:
      name:
        type: string
      value:
        type: object
    required:
      - name
      - value
    type: object
- id: ast.field-access
  node_kind: field-access
  payload_schema:
    properties:
      field:
        type: string
      target:
        type: object
    required:
      - target
      - field
    type: object
- id: ast.forall
  node_kind: forall
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.function
  node_kind: function
  children:
    - role: params
    - role: body
  payload_schema:
    properties:
      body:
        type: object
      params:
        items:
          type: string
        type: array
    required:
      - params
      - body
    type: object
- id: ast.hello.greet
  node_kind: hello.greet
  payload_schema:
    properties:
      name:
        type: string
    type: object
- id: ast.if
  node_kind: if
  # Roles: `condition`/`then`/`else`. The `else` child is optional — a
  # else-less `if` has 2 children and evaluates to null when the condition
  # is false.
  children:
    - role: condition
    - role: then
    - role: else
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.import
  node_kind: import
  payload_schema:
    properties:
      items:
        items:
          type: string
        type: array
      path:
        type: string
    required:
      - path
    type: object
- id: ast.index
  node_kind: index
  payload_schema:
    properties:
      index:
        type: object
      target:
        type: object
    required:
      - target
      - index
    type: object
- id: ast.json
  node_kind: json
  payload_schema:
    properties:
      args:
        type: array
      expr:
        type: string
    type: object
# `let` — statement binding `let <name> :: <value>` (reinstated; the
# surface form binds via `::`, mirroring `assign`). Children are
# `[target, value]` where `target` is a `var` (or `type-annot`) node —
# the same shape as `assign`, so the generic `target`/`value` role
# convention binds it in block/rec statement position.
- id: ast.let
  node_kind: let
  children:
    - role: target
    - role: value
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.match
  node_kind: match
  payload_schema:
    properties:
      arms:
        items:
          properties:
            body:
              type: object
            pattern:
              type: object
          required:
            - pattern
            - body
          type: object
        type: array
      children:
        description: positional children [scrutinee, (motive,) block]
        items:
          type: integer
        minItems: 2
        maxItems: 3
        type: array
      motive:
        description: optional return motive function parsed between 'return' and 'with' (e.g. return (i) ~> T)
        type: object
      scrutinee:
        type: object
    required:
      - scrutinee
      - arms
    type: object
- id: ast.object
  node_kind: object
  pattern_role: entries
  payload_schema:
    properties:
      entries:
        items:
          properties:
            key:
              type: string
            value:
              type: object
          required:
            - key
            - value
          type: object
        type: array
    required:
      - entries
    type: object
- id: ast.entry
  node_kind: entry
  pattern_role: entry
  # `key`/`value` child roles + literal-key declaration (ADR-0081): a `var`
  # or `string` key child is a literal key (its payload is the key string),
  # while any other kind (e.g. `paren`, desugared from `[expr]:`) is a
  # computed key evaluated at runtime.
  children:
    - role: key
    - role: value
  literal_children:
    key:
      - var
      - string
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
  # The `array`-key desugar lives in transforms.yaml
  # (`transform.desugar.entry`).
- id: ast.paren
  node_kind: paren
  children:
    - role: body
      variadic: true
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.rest
  node_kind: rest
  pattern_role: rest
  children:
    - role: subject
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.resolve
  node_kind: resolve
  payload_schema:
    properties:
      path:
        type: string
    type: object
- id: ast.template
  node_kind: template
  payload_schema:
    properties:
      segments:
        items:
          type: object
        type: array
    required:
      - segments
    type: object
- id: ast.runtime-assert
  node_kind: runtime-assert
  children:
    - role: predicate
    - role: expr
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.type-annot
  node_kind: type-annot
  children:
    - role: subject
    - role: annot
  payload_schema:
    properties:
      type:
        type: string
    required:
      - type
    type: object
- id: ast.unary.neg
  node_kind: unary.neg
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.unary.not
  node_kind: unary.not
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.value
  node_kind: value
  payload_schema:
    properties:
      value: {}
    required:
      - value
    type: object
- id: ast.var
  node_kind: var
  pattern_role: leaf
  payload_schema:
    properties:
      name:
        type: string
    required:
      - name
    type: object
# ---------------------------------------------------------------------------
# v0.1 new node kinds (ADR-0074)
# ---------------------------------------------------------------------------
# `rec` — recursive region (like `loop` but with 1 child: the block).
- id: ast.rec
  node_kind: rec
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `while` — pre-test loop (2 children: condition + body).
- id: ast.while
  node_kind: while
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `for` — iteration (3 children: iterator + collection + body).
- id: ast.for
  node_kind: for
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
    required:
      - children
    type: object
# `return` — early exit (1 child: the value).
- id: ast.return
  node_kind: return
  children:
    - role: value
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `law` — compile-time law declaration (2 children: name + body).
- id: ast.law
  node_kind: law
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `trait` — compile-time trait declaration (1 child).
- id: ast.trait
  node_kind: trait
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `impl` — compile-time impl declaration (1 child).
- id: ast.impl
  node_kind: impl
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `infer` — name an inferred type (1 child).
- id: ast.infer
  node_kind: infer
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `type` — compile-time type declaration (1 child).
- id: ast.type
  node_kind: type
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `product` — categorical product `***` (2 children, like fanout).
- id: ast.product
  node_kind: product
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `nullish` — nullish coalescing `??` (2 children, like choice).
- id: ast.nullish
  node_kind: nullish
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `opt-chain` — optional chaining `?.` (2 children, like field-access).
- id: ast.opt-chain
  node_kind: opt-chain
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `data` — inductive type declaration (ADR-0082). Has two named children:
#   0. `type`   — the family name/parameter expression (`var(Name)` or
#                 `call(var(Name), params...)`) that carries the type name.
#   1. `constructors` — the constructor list expression (an `alt` tree or a
#                        single constructor).
# The type name is extracted from the `type` child. The desugar pass
# (`desugar_data`) reads the children to obtain the family and constructors.
- id: ast.data
  node_kind: data
  children:
    - role: type
    - role: constructors
  payload_schema:
    properties:
      children:
        description: positional children [type_expr, constructors_expr]
        items:
          type: integer
        maxItems: 2
        minItems: 1
        type: array
      name:
        type: string
      params:
        description: optional type parameters (indices) for inductive families
        items:
          type: string
        type: array
    required:
      - children
      - name
    type: object
# `alt` — constructor alternative node created by `|` pipe infix
# (ADR-0082). Two children: `left` and `right`. The desugar pass walks
# the `alt` tree to collect all constructors from a `data` declaration.
- id: ast.alt
  node_kind: alt
  children:
    - role: left
    - role: right
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `desugar-error` — error node emitted by the desugar pass when a
# declaration fails a compile-time check (e.g. strict positivity violation
# in `data`). The payload carries `{kind, reason}`. The eval scheme
# (`eval.desugar-error`) raises a `LangError` when evaluated, so the error
# surfaces at eval time instead of being silently swallowed.
- id: ast.desugar-error
  node_kind: desugar-error
  payload_schema:
    properties:
      kind:
        type: string
      reason:
        type: string
    required:
      - kind
      - reason
    type: object
# `erased` — proof-erasure placeholder (ADR-0032). The erase pass lowers
# proof terms to this leaf node before evaluation; the eval scheme
# (`eval.erased`) is a `const` with no literal, so it evaluates to `null`.
- id: ast.erased
  node_kind: erased
  payload_schema:
    type: "null"
