# ---------------------------------------------------------------------------
# v0.1 new node kinds (ADR-0074)
# ---------------------------------------------------------------------------
# `rec` — recursive region (like `loop` but with 1 child: the block).
- id: ast.rec
  node_kind: rec
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `while` — pre-test loop (2 children: condition + body).
- id: ast.while
  node_kind: while
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `for` — iteration (3 children: iterator + collection + body).
- id: ast.for
  node_kind: for
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
    required:
    - children
    type: object
# `return` — early exit (1 child: the value).
- id: ast.return
  node_kind: return
  children:
  - role: value
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `law` — compile-time law declaration (2 children: name + body).
- id: ast.law
  node_kind: law
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `trait` — compile-time trait declaration (1 child).
- id: ast.trait
  node_kind: trait
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `impl` — compile-time impl declaration (1 child).
- id: ast.impl
  node_kind: impl
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `infer` — name an inferred type (1 child).
- id: ast.infer
  node_kind: infer
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `type` — compile-time type declaration (1 child).
- id: ast.type
  node_kind: type
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `product` — categorical product `***` (2 children, like fanout).
- id: ast.product
  node_kind: product
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `nullish` — nullish coalescing `??` (2 children, like choice).
- id: ast.nullish
  node_kind: nullish
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `opt-chain` — optional chaining `?.` (2 children, like field-access).
- id: ast.opt-chain
  node_kind: opt-chain
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `data` — inductive type declaration (ADR-0082). Has two named children:
#   0. `type`   — the family name/parameter expression (`var(Name)` or
#                 `call(var(Name), params...)`) that carries the type name.
#   1. `constructors` — the constructor list expression (an `alt` tree or a
#                        single constructor).
# The type name is extracted from the `type` child. The desugar pass
# (`desugar_data`) reads the children to obtain the family and constructors.
- id: ast.data
  node_kind: data
  children:
  - role: type
  - role: constructors
  payload_schema:
    properties:
      children:
        description: positional children [type_expr, constructors_expr]
        items:
          type: integer
        maxItems: 2
        minItems: 1
        type: array
      name:
        type: string
      params:
        description: optional type parameters (indices) for inductive families
        items:
          type: string
        type: array
    required:
    - children
    - name
    type: object
# `alt` — constructor alternative node created by `|` pipe infix
# (ADR-0082). Two children: `left` and `right`. The desugar pass walks
# the `alt` tree to collect all constructors from a `data` declaration.
- id: ast.alt
  node_kind: alt
  children:
  - role: left
  - role: right
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `desugar-error` — error node emitted by the desugar pass when a
# declaration fails a compile-time check (e.g. strict positivity violation
# in `data`). The payload carries `{kind, reason}`. The eval scheme
# (`eval.desugar-error`) raises a `LangError` when evaluated, so the error
# surfaces at eval time instead of being silently swallowed.
- id: ast.desugar-error
  node_kind: desugar-error
  payload_schema:
    properties:
      kind:
        type: string
      reason:
        type: string
    required:
    - kind
    - reason
    type: object
