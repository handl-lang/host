    type: object
- id: ast.bind
  node_kind: bind
  payload_schema:
    properties:
      name:
        type: string
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - name
      - children
    type: object
- id: ast.binary.compare
  node_kind: binary.compare
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.binary.div
  node_kind: binary.div
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.binary.eq
  node_kind: binary.eq
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.binary.gt
  node_kind: binary.gt
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.binary.gte
  node_kind: binary.gte
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
