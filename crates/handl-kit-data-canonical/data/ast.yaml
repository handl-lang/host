# `dimension` — dimension specialization `f<...>` (ADR-0106 §11).
#
# The canonical surface writes the specialization brackets adjacent to a
# name-like target (`f<a>`, `f<(a >>> b)>`) so they are distinguishable from
# the ordinary comparison operator `<` (`f < a`); see the Pratt engine's
# `dimension_applies`. Child roles: the `target` expression, then one or more
# `args` (the dimension payloads — a type, value, arrow, proof, grade,
# algebra, or composition; the parser accepts any expression).
- id: ast.dimension
  node_kind: dimension
  children:
    - role: target
    - role: args
      variadic: true
  payload_schema:
    properties:
      children:
        items:
          type: integer
        minItems: 2
        type: array
    required:
      - children
    type: object

- id: ast.export
  node_kind: export
  payload_schema:
    properties:
      name:
        type: string
      value:
        type: object
    required:
      - name
      - value
    type: object
- id: ast.field-access
  node_kind: field-access
  children:
    - role: target
    - role: field
  payload_schema:
    properties:
      field:
        type: string
      target:
        type: object
    required:
      - target
      - field
    type: object
- id: ast.flow
  node_kind: flow
  children:
    - role: left
    - role: right
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `axis_flow` — axis-parameterized composition `a >>>[k] b` (ADR-0120
# Phase 2). The middle child is the composition axis, an ordinary
# expression position (literal, variable, or compound expression);
# unindexed `>>>` parses to `flow` and is `>>>[0]`.
- id: ast.axis_flow
  node_kind: axis_flow
  children:
    - role: left
    - role: axis
    - role: right
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
    required:
      - children
    type: object
- id: ast.forall
  node_kind: forall
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `pi` — dependent function type `Π (x: A) → B(x)` (ADR-0120 Phase 4).
# Internal type-level shape: children are [param-type, body-type]; the
# surface former is `Pi(A, x ~> B)` (a call).
- id: ast.pi
  node_kind: pi
  children:
    - role: param
    - role: body
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `sigma` — dependent pair type `Σ (x: A) × B(x)` (ADR-0120 Phase 4).
# Internal type-level shape: children are [param-type, body-type]; the
# surface former is `Sigma(A, x ~> B)` (a call).
- id: ast.sigma
  node_kind: sigma
  children:
    - role: param
    - role: body
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `family` — indexed family `A ↝ Type` (ADR-0120 Phase 4). Internal
# type-level shape: single child is the index/base type expression; the
# surface former is `Family(A)` (a call).
- id: ast.family
  node_kind: family
  children:
    - role: base
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.function
  node_kind: function
  children:
    - role: params
    - role: body
  payload_schema:
    properties:
      body:
        type: object
      params:
        items:
          type: string
        type: array
    required:
      - params
      - body
    type: object
# `dim_arrow` — N-dimensional arrow `A ~[N]~> B` (ADR-0119).
- id: ast.dim_arrow
  node_kind: dim_arrow
  children:
    - role: source
    - role: dim
    - role: target
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
    required:
      - children
    type: object
- id: ast.hello.greet
  node_kind: hello.greet
  payload_schema:
    properties:
      name:
        type: string
    type: object
- id: ast.if
  node_kind: if
  # Roles: `condition`/`then`/`else`. The `else` child is optional — a
  # else-less `if` has 2 children and evaluates to null when the condition
  # is false.
  children:
    - role: condition
    - role: then
    - role: else
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.import
  node_kind: import
  payload_schema:
    properties:
      items:
        items:
          type: string
        type: array
      path:
        type: string
    required:
      - path
    type: object
- id: ast.index
  node_kind: index
  payload_schema:
    properties:
      index:
        type: object
      target:
        type: object
    required:
      - target
      - index
    type: object
- id: ast.match
  node_kind: match
  # children = [scrutinee, (motive,) block] — the motive is an optional
  # middle slot (`match s return m with { .. }`), so `block`'s position is
  # arity-dependent: resolve via `Language::child_role_index_for`.
  children:
    - role: scrutinee
    - role: motive
      optional: true
    - role: block
  payload_schema:
    properties:
      arms:
        items:
          properties:
            body:
              type: object
            pattern:
              type: object
          required:
            - pattern
            - body
          type: object
        type: array
      children:
        description: positional children [scrutinee, (motive,) block]
        items:
          type: integer
        minItems: 2
        maxItems: 3
        type: array
      motive:
        description: optional return motive function parsed between 'return' and 'with' (e.g. return (i) ~> T)
        type: object
      scrutinee:
        type: object
    required:
      - scrutinee
      - arms
    type: object
- id: ast.object
  node_kind: object
  pattern_role: entries
  children:
    - role: entries
      variadic: true
  payload_schema:
    properties:
      entries:
        items:
          properties:
            key:
              type: string
            value:
              type: object
          required:
            - key
            - value
          type: object
        type: array
    required:
      - entries
    type: object
- id: ast.entry
  node_kind: entry
  pattern_role: entry
  # `key`/`value` child roles + literal-key declaration (ADR-0081): a `var`
  # or `string` key child is a literal key (its payload is the key string),
  # while any other kind (e.g. `paren`, desugared from `[expr]:`) is a
  # computed key evaluated at runtime.
  children:
    - role: key
    - role: value
  literal_children:
    key:
      - var
      - string
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
  # The `array`-key desugar lives in transforms.yaml
  # (`transform.desugar.entry`).
- id: ast.paren
  node_kind: paren
  children:
    - role: body
      variadic: true
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.rest
  node_kind: rest
  pattern_role: rest
  children:
    - role: subject
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.resolve
  node_kind: resolve
  payload_schema:
    properties:
      path:
        type: string
    type: object
- id: ast.template
  node_kind: template
  payload_schema:
    properties:
      segments:
        items:
          type: object
        type: array
    required:
      - segments
    type: object
- id: ast.runtime-assert
  node_kind: runtime-assert
  children:
    - role: predicate
    - role: expr
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
- id: ast.type-annot
  node_kind: type-annot
  children:
    - role: subject
    - role: annot
  payload_schema:
    properties:
      type:
        type: string
    required:
      - type
    type: object
- id: ast.unary.neg
  node_kind: unary.neg
  children:
    - role: operand
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.unary.not
  node_kind: unary.not
  children:
    - role: operand
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
- id: ast.value
  node_kind: value
  payload_schema:
    properties:
      value: {}
    required:
      - value
    type: object
- id: ast.var
  node_kind: var
  pattern_role: leaf
  payload_schema:
    properties:
      name:
        type: string
    required:
      - name
    type: object
# ---------------------------------------------------------------------------
# v0.1 new node kinds (ADR-0074)
# ---------------------------------------------------------------------------
# `rec` — recursive region (like `loop` but with 1 child: the block).
- id: ast.rec
  node_kind: rec
  children:
    - role: state
    - role: body
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `loop` — arrow fold node (ADR-0120 Phase 1). Children: [input, step].
# `step` is a function `(in, state) -> Either(result, next_state)` run as
# `Term::Loop` feedback; `input` is the value the fold runs over.
- id: ast.loop
  node_kind: loop
  children:
    - role: input
    - role: step
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `while` — pre-test loop (2 children: condition + body).
- id: ast.while
  node_kind: while
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
      - children
    type: object
# `for` — iteration (3 children: pattern + collection + body).
- id: ast.for
  node_kind: for
  children:
    - role: pattern
    - role: collection
    - role: body
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
    required:
      - children
    type: object
# `return` — early exit (1 child: the value).
- id: ast.return
  node_kind: return
  children:
    - role: value
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `law` — compile-time law declaration, a 2-cell expected to hold
# semantically (ADR-0100). Three children:
#   0. `name`   — the law name (`var(Name)`).
#   1. `source` — the source arrow expression (left of `=>`).
#   2. `target` — the target arrow expression (right of `=>`).
# The name string is also lifted into `payload.name` by the grammar row.
- id: ast.law
  node_kind: law
  children:
    - role: name
    - role: source
    - role: target
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
      name:
        type: string
    required:
      - children
    type: object
# `rewrite` — a directed rewrite rule (2-cell) the compiler/optimizer may
# use to replace the source with the target (ADR-0100). Same shape as `law`
# but a distinct node kind: [name, source, target].
- id: ast.rewrite
  node_kind: rewrite
  children:
    - role: name
    - role: source
    - role: target
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
      name:
        type: string
    required:
      - children
    type: object
# `sort` — graded-theory sort declaration; a generating 0-cell
# (ADR-0098/0100). Children:
#   0. `name`   — the sort head: `var(Name)` or `call(Name, params...)`. The
#                 type parameters/indices ride in the `call` node's argument
#                 children (the `data` declaration precedent).
#   1. `grades` — optional grade expression after the `grades` keyword.
# `payload.name` carries the extracted sort name.
- id: ast.sort
  node_kind: sort
  children:
    - role: name
    - role: grades
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 1
        type: array
      name:
        type: string
      params:
        description: optional type parameters (indices) of a parameterized sort
        items:
          type: string
        type: array
    required:
      - children
    type: object
# `grade` — grade declaration; a generating 0-cell that is a proposition
# (ADR-0100). One child:
#   0. `name` — the grade head: `var(Name)` or `call(Name, params...)`
#               (e.g. `grade Lengthable(n: Nat)`).
# `payload.name` carries the extracted grade name.
- id: ast.grade
  node_kind: grade
  children:
    - role: name
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
      name:
        type: string
      params:
        description: optional parameters of a value-indexed grade
        items:
          type: string
        type: array
    required:
      - children
    type: object
# `op` — graded operation declaration; a generating 1-cell
# (ADR-0098/0100). Two children:
#   0. `name`      — the operation head: `var(name)` or `call(name, params...)`
#                    for the parenthesized constraint form `op add(A: Addable)`.
#   1. `signature`  — the arrow expression: ungraded `A ~> B` (`function`) or
#                    dimensioned `A ~[N]~> B` (`dim_arrow`).
# `payload.name` carries the extracted op name.
- id: ast.op
  node_kind: op
  children:
    - role: name
    - role: signature
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
      name:
        type: string
    required:
      - children
    type: object
# `handle` — install a handler for the dynamic extent of an expression.
# `handle <target> with <handler>` — two children: `target` (the
# expression evaluated under the handler) and `impl` (the handler value,
# an ordinary record or arrow).
- id: ast.handle
  node_kind: handle
  children:
    - role: target
    - role: impl
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
      name:
        type: string
    required:
      - children
    type: object
# `trait` — compile-time trait declaration (1 child).
- id: ast.trait
  node_kind: trait
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `impl` — compile-time impl declaration (1 child).
- id: ast.impl
  node_kind: impl
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `infer` — name an inferred type (1 child).
- id: ast.infer
  node_kind: infer
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
# `type` — compile-time type declaration (1 child).
- id: ast.type
  node_kind: type
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
      - children
    type: object
