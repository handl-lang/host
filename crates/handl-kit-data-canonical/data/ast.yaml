# ---------------------------------------------------------------------------
# v0.1 new node kinds (ADR-0074)
# ---------------------------------------------------------------------------
# `rec` — recursive region (like `loop` but with 1 child: the block).
- id: ast.rec
  node_kind: rec
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `while` — pre-test loop (2 children: condition + body).
- id: ast.while
  node_kind: while
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `for` — iteration (3 children: iterator + collection + body).
- id: ast.for
  node_kind: for
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 3
        minItems: 3
        type: array
    required:
    - children
    type: object
# `return` — early exit (1 child: the value).
- id: ast.return
  node_kind: return
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `law` — compile-time law declaration (2 children: name + body).
- id: ast.law
  node_kind: law
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `trait` — compile-time trait declaration (1 child).
- id: ast.trait
  node_kind: trait
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `impl` — compile-time impl declaration (1 child).
- id: ast.impl
  node_kind: impl
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `infer` — name an inferred type (1 child).
- id: ast.infer
  node_kind: infer
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `type` — compile-time type declaration (1 child).
- id: ast.type
  node_kind: type
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 1
        minItems: 1
        type: array
    required:
    - children
    type: object
# `product` — categorical product `***` (2 children, like fanout).
- id: ast.product
  node_kind: product
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `nullish` — nullish coalescing `??` (2 children, like choice).
- id: ast.nullish
  node_kind: nullish
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
# `opt-chain` — optional chaining `?.` (2 children, like field-access).
- id: ast.opt-chain
  node_kind: opt-chain
  payload_schema:
    properties:
      children:
        items:
          type: integer
        maxItems: 2
        minItems: 2
        type: array
    required:
    - children
    type: object
