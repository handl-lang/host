- id: ast.call
  node_kind: call
  payload_schema:
    properties:
      args:
        items:
          type: object
        type: array
      callee:
        type: object
    required:
    - callee
    - args
    type: object
  # ADR-0060 Layer 1: json{...}(args) is syntactic sugar. When the callee
  # (child 0) is a `json` node, desugar the `call` into a `json` node that
  # carries all original children. The `json` eval scheme then evaluates
  # the args and performs $0/$1/… placeholder substitution into the template
  # string (carried by child 0's payload).
  desugar:
    target_kind: json
    when:
      child_index: 0
      child_kind: json
    children:
    - !Keep 0
    - !KeepRest 1
