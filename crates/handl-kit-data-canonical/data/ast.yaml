- id: ast.match
  node_kind: match
  payload_schema:
    properties:
      arms:
        items:
          properties:
            body:
              type: object
            pattern:
              type: object
          required:
          - pattern
          - body
          type: object
        type: array
      children:
        description: positional children [scrutinee, (motive,) arms]
        items:
          type: integer
        minItems: 2
        maxItems: 3
        type: array
      motive:
        description: optional return motive function (return (i) ~> T)
        type: object
      scrutinee:
        type: object
    required:
    - scrutinee
    - arms
    type: object
- id: ast.object
