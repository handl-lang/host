# AST shape definitions — v0.1 surface syntax (ADR-0074).
# Removed: arrow_app, arrow_bind, returnA, loop, pipe, handle, typeof,
#   const, module, mood.int, mood.pot, mood.norm, mood.neg, mood.cnd, vau.
# Added: rec, while, for, return, law, trait, impl, infer, type,
#   product, nullish, opt-chain.
- id: ast.apply
  node_kind: apply
  payload_schema:
    properties:
      args:
        items:
          type: object
        type: array
      callee:
        type: object
    required:
    - callee
    - args
    type: object
- id: ast.array
  node_kind: array
  payload_schema:
    properties:
      elements:
        items:
          type: object
        type: array
    required:
    - elements
    type: object
- id: ast.arm
  node_kind: arm
  payload_schema:
    properties:
