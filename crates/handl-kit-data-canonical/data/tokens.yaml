# Token kind definitions — v0.1 surface syntax (ADR-0074).
# Removed: arrow_app, arrow_bind, pipe, returnA, loop, where, handle,
#   typeof, module, const, is, may, must, when, not (keyword), vau.
# Added: rec, while, for, return, law, trait, impl, infer, type, from,
#   product (***), nullish (??), opt_chain (?.).
# Retained: axiom (compatible alias for law).
- id: token.and
  label: '&&'
- id: token.arrow
  label: ~>
- id: token.bang
  label: null
- id: token.bool
  label: bool
  literal: Bool
- id: token.choice
  label: '|||'
- id: token.colon
  label: ':'
- id: token.comma
  label: ','
- id: token.comment
  label: comment
  trivia: true
- id: token.doc_comment
  label: doc_comment
  trivia: true
- id: token.dot
  label: .
- id: token.ellipsis
  label: '...'
- id: token.eof
  label: eof
- id: token.eqeq
  label: ==
- id: token.equal
  label: =
- id: token.fanout
  label: '&&&'
- id: token.flow
  label: '>>>'
- id: token.gt
  label: '>'
- id: token.gte
  label: '>='
- id: token.identifier
  label: identifier
- id: token.if
  label: null
- id: token.json
  label: json
  literal: !StripAffix
    prefix: 'json{'
    suffix: '}'
    wrap:
    - '{'
    - '}'
- id: token.keyword.as
  label: as
- id: token.keyword.axiom
  label: axiom
- id: token.keyword.data
  label: data
- id: token.keyword.do
  label: do
- id: token.keyword.else
  label: else
- id: token.keyword.export
  label: export
- id: token.keyword.for
  label: for
- id: token.keyword.from
  label: from
- id: token.keyword.if
  label: if
- id: token.keyword.impl
  label: impl
- id: token.keyword.import
  label: import
- id: token.keyword.in
  label: in
- id: token.keyword.infer
  label: infer
- id: token.keyword.law
  label: law
- id: token.keyword.let
  label: let
- id: token.keyword.match
  label: match
- id: token.keyword.rec
  label: rec
- id: token.keyword.return
  label: return
- id: token.keyword.then
  label: then
- id: token.keyword.trait
  label: trait
- id: token.keyword.type
  label: type
- id: token.keyword.while
  label: while
- id: token.lbrace
  label: '{'
- id: token.lbracket
  label: '['
- id: token.let
  label: null
- id: token.lparen
  label: (
- id: token.lt
  label: <
- id: token.lte
  label: <=
- id: token.minus
  label: '-'
- id: token.neq
  label: '!='
- id: token.null
  label: 'null'
  literal: 'Null'
- id: token.nullish
  label: '??'
- id: token.number
  label: number
  literal: Number
- id: token.opt_chain
  label: '?.'
- id: token.or
  label: '||'
- id: token.pipe
  label: '|'
- id: token.percent
  label: '%'
- id: token.plus
  label: +
- id: token.pow
  label: '**'
- id: token.product
  label: '***'
- id: token.question
  label: null
- id: token.rbrace
  label: '}'
- id: token.rbracket
  label: ']'
- id: token.rparen
  label: )
- id: token.semicolon
  label: ;
- id: token.slash
  label: /
- id: token.spaceship
  label: <=>
- id: token.star
  label: '*'
- id: token.string
  label: string
  literal: !String
    delim_chars: 1
    escapes:
    - - '\n'
      - "\n"
    - - '\t'
      - "\t"
    - - '\"'
      - '"'
    - - '\\'
      - '\'
- id: token.template
  label: null
