# Token kind definitions — v0.1 surface syntax (ADR-0074).
# Removed: arrow_app, arrow_bind, pipe, returnA, loop, where, handle,
#   typeof, module, const, is, may, must, when, not (keyword), vau.
# Added: rec, while, for, return, law, trait, impl, infer, type, from,
#   product (***), nullish (??), opt_chain (?.).
# Retained: axiom (compatible alias for law).
#
# `category` is the tooling classification consumed by host-lsp /
# host-tooling via `Language::token_category` (ADR-0044 — no hardcoded
# kind-string checks in tooling). Vocabulary: keyword, identifier, number,
# string, bool, null, template, operator, punctuation, open-bracket,
# close-bracket, comment, doc-comment, eof.
# `pair` links a bracket kind to its matching counterpart; `doc` is the
# hover markdown surfaced by the LSP.
- id: token.and
  label: "&&"
  category: operator
- id: token.arrow
  label: ~>
  category: operator
- id: token.bang
  label: null
  category: operator
- id: token.bool
  label: bool
  literal: Bool
  category: bool
- id: token.choice
  label: "|||"
  category: operator
- id: token.colon
  label: ":"
  category: punctuation
- id: token.comma
  label: ","
  category: punctuation
- id: token.comment
  label: comment
  trivia: true
  category: comment
- id: token.doc_comment
  label: doc_comment
  trivia: true
  category: doc-comment
- id: token.dot
  label: .
  category: punctuation
- id: token.ellipsis
  label: "..."
  category: operator
- id: token.eof
  label: eof
  category: eof
- id: token.eqeq
  # Retained: `==` is lexed to the equality token (`token.equal`) so existing
  # `a == b` sources keep working while `=` is now also equality. No grammar
  # row references `token.eqeq` anymore.
  label: ==
  category: operator
- id: token.bind
  label: "::"
  category: operator
- id: token.equal
  label: =
  category: operator
- id: token.fanout
  label: "&&&"
  category: operator
- id: token.flow
  label: ">>>"
  category: operator
- id: token.gt
  label: ">"
  category: operator
- id: token.gte
  label: ">="
  category: operator
- id: token.identifier
  label: identifier
  category: identifier
- id: token.if
  label: null
  category: keyword
- id: token.json
  label: json
  literal: !StripAffix
    prefix: "json{"
    suffix: "}"
    wrap:
      - "{"
      - "}"
  category: string
- id: token.keyword.as
  label: as
  category: keyword
- id: token.keyword.axiom
  label: axiom
  category: keyword
- id: token.keyword.data
  label: data
  category: keyword
- id: token.keyword.do
  label: do
  category: keyword
  doc: "**Do-while loop body** `do`\n\n```\ndo { `body` } while `cond`\n```"
- id: token.keyword.else
  label: else
  category: keyword
  doc: "**Else-branch of `if`** `else`\n\n```\nelse { `expr` }\n```"
- id: token.keyword.export
  label: export
  category: keyword
- id: token.keyword.for
  label: for
  category: keyword
  doc: "**For loop — iterate over a collection** `for`\n\n```\nfor `x` in `coll` { `body` }\n```"
- id: token.keyword.from
  label: from
  category: keyword
  doc: "**Module source for an import** `from`\n\n```\nimport `name` from `module`\n```"
- id: token.keyword.if
  label: if
  category: keyword
  doc: "**Conditional expression** `if`\n\n```\nif `cond` { `a` } else { `b` }\n```"
- id: token.keyword.impl
  label: impl
  category: keyword
  doc: "**Implementation of a trait** `impl`\n\n```\nimpl `Trait` for `Type` { `members` }\n```"
- id: token.keyword.import
  label: import
  category: keyword
  doc: "**Import a module / arrow** `import`\n\n```\nimport `name` from `module`\n```"
- id: token.keyword.in
  label: in
  category: keyword
  doc: "**Iterator binding — used with `for`** `in`\n\n```\nfor `x` in `coll` { `body` }\n```"
- id: token.keyword.infer
  label: infer
  category: keyword
  doc: "**Infer a type or contract** `infer`\n\n```\ninfer `name` : `signature`\n```"
- id: token.keyword.law
  label: law
  category: keyword
  doc: "**Law declaration — assert a contract signature** `law`\n\n```\nlaw `name` : `signature`\n```"
# `let` is removed from the language (ADR-0079 completed). The keyword
# token is retained with NO grammar row — the same tombstone pattern as
# `token.keyword.then`/`token.keyword.axiom` — so `let` stays a reserved
# word and `let x :: v` fails to parse ("unexpected token") instead of
# silently lexing as an identifier.
- id: token.keyword.let
  label: let
  category: keyword
- id: token.keyword.match
  label: match
  category: keyword
  doc: "**Pattern-match on a value** `match`\n\n```\nmatch `expr` { `pat` { `body` }, … }\n```"
- id: token.keyword.rec
  label: rec
  category: keyword
  doc: "**Feedback loop — arrow `Loop` combinator in surface syntax** `rec`\n\n```\nrec { `state` } { `body` }\n```"
- id: token.keyword.return
  label: return
  category: keyword
  doc: "**Return a value from an arrow** `return`\n\n```\nreturn `expr`\n```"
- id: token.keyword.then
  label: then
  category: keyword
- id: token.keyword.trait
  label: trait
  category: keyword
  doc: "**Trait declaration — a set of laws / operations** `trait`\n\n```\ntrait `Name` { `members` }\n```"
- id: token.keyword.type
  label: type
  category: keyword
  doc: "**Type declaration** `type`\n\n```\ntype `Name` = `definition`\n```"
- id: token.keyword.while
  label: while
  category: keyword
  doc: "**While loop — iterate while a condition holds** `while`\n\n```\nwhile `cond` { `body` }\n```"
- id: token.keyword.with
  label: with
  category: keyword
- id: token.lbrace
  label: "{"
  category: open-bracket
  pair: token.rbrace
- id: token.lbracket
  label: "["
  category: open-bracket
  pair: token.rbracket
- id: token.lparen
  label: (
  category: open-bracket
  pair: token.rparen
- id: token.lt
  label: <
  category: operator
- id: token.lte
  label: <=
  category: operator
- id: token.minus
  label: "-"
  category: operator
- id: token.neq
  label: "!="
  category: operator
- id: token.null
  label: "null"
  literal: "Null"
  category: "null"
- id: token.nullish
  label: "??"
  category: operator
- id: token.number
  label: number
  literal: Number
  category: number
- id: token.opt_chain
  label: "?."
  category: operator
- id: token.or
  label: "||"
  category: operator
- id: token.pipe
  label: "|"
  category: operator
- id: token.percent
  label: "%"
  category: operator
- id: token.plus
  label: +
  category: operator
- id: token.pow
  label: "**"
  category: operator
- id: token.product
  label: "***"
  category: operator
- id: token.question
  label: null
  category: operator
- id: token.rbrace
  label: "}"
  category: close-bracket
  pair: token.lbrace
- id: token.rbracket
  label: "]"
  category: close-bracket
  pair: token.lbracket
- id: token.rparen
  label: )
  category: close-bracket
  pair: token.lparen
- id: token.semicolon
  label: ;
  category: punctuation
- id: token.slash
  label: /
  category: operator
- id: token.spaceship
  label: <=>
  category: operator
- id: token.star
  label: "*"
  category: operator
- id: token.string
  label: string
  literal: !String
    delim_chars: 1
    escapes:
      - - '\n'
        - "\n"
      - - '\r'
        - "\r"
      - - '\t'
        - "\t"
      - - '\"'
        - '"'
      - - '\\'
        - '\'
  category: string
- id: token.template
  label: null
  category: template
