# The canonical language kit.
#
# Loaded by `handl_kit_data_canonical::manifest()`: a single `canonical-yaml`
# fragment source (the embedded YAML data files) plus runtime engine selection.
# No library modules — the canonical kit is the language only.
fragments:
  - name: canonical-yaml
    source: !Emitter canonical-yaml
runtime:
  lex: data
  parse: pratt
  eval: tree-walk
  typecheck: nbe
modules: []
