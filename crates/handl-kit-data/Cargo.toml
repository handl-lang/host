[package]
name = "handl-kit-data"
version.workspace = true
edition.workspace = true
description = "The **data-driven kit assembly** framework for ADR-0044 Phase 5."
license.workspace = true
repository.workspace = true

[dependencies]
handl-language = { workspace = true }
handl-platform = { path = "../platform" }
handl-runtime = { path = "../handl-runtime" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Fragment sources read a serialized `Language` (ADR-0044 §6 end
# state) — YAML is the canonical fragment format, TOML/JSON are also accepted.
serde_yaml = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }