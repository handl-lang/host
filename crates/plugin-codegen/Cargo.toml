[package]
name = "handl-plugin-codegen"
version.workspace = true
edition.workspace = true
description = "Handl codegen registry: IR families, CodegenRequest/CodegenTarget records, and the Source -> Emitter -> Change -> Engine lifecycle wiring (P-001/PL-004, renamed from plugin-sdkgen)."
license.workspace = true
repository.workspace = true

[dependencies]
# `CodegenRequest` carries the language emitted sources canonicalize
# against (ADR-0128 §0.1 — the target registry lives on the port).
handl-language = { workspace = true }
# The desired-state lifecycle kernel (P-001): IrModule/Source/Emitter
# traits, Change sets, ArtifactStore, Engine plan/apply/destroy/revert.
hnl-tool-codegen = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
ureq = "2"

[dev-dependencies]
tempfile = "3"
