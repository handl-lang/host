[package]
name = "handl-plugin-compile-llvm"
version.workspace = true
edition.workspace = true
description = "LLVM compiler for the Handl arrow calculus (ADR-0114 Phase 8)."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-compile = { path = "../plugin-compile" }
handl-language = { path = "../handl-language" }
plugin-engine = { path = "../plugin-engine" }
plugin-engine-typecheck = { path = "../plugin-engine-typecheck", package = "handl-plugin-engine-typecheck" }
serde_json = { workspace = true }

inkwell = { version = "0.5", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "compile_benchmark"
harness = false

[features]
default = []
inkwell = ["dep:inkwell"]
