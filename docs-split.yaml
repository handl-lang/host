# docs-split.yaml — ADR-0129 assignment manifest (project-docs split)
#
# Maps every path under `project/` to the repo that owns it. Consumed by
# `scripts/split-project-docs.sh`, which writes one paths-file per repo and
# runs `git filter-repo --paths-from-file <file> --path-rename project/:`
# on a CLONE of host, emitting an orphan `project` branch per repo.
#
# Invariants (checked by the script):
#   * every path under project/ appears exactly once, or as a `splits:` parent;
#   * a `splits:` parent's file stays in `host` and its halves are new
#     ADRs allocated from project/adrs/INDEX.md.
#
# Paths are relative to `project/` (e.g. `adrs/0040-....md`).

version: 1

# Cross-cutting ADRs: the parent file stays in `host`; each target gets a
# NEW ADR (allocated from INDEX.md) carrying the moved half. Numbers are never
# reused, so `host` keeps the canonical citation.
splits:
  - parent: adrs/0044-language-as-data-and-runtime-split.md
    stays: host
    targets:
