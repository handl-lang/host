# SDK generation config for OpenSSL's libssl — the TLS layer `wss://`
# needs. Client surface: context creation, session wrap of an fd,
# handshake, read/write, shutdown, teardown, and certificate
# verification (default CA paths, `SSL_set1_host`
# hostname matching, `SSL_get_verify_result`, `SSL_ctrl` for SNI).
# Opaque SSL*/SSL_CTX* pointers are `handle` descriptors.
library: libssl.so.3

headers:
  ssl.h:
    include:
      [
        "SSL_CTX_new",
        "SSL_new",
        "SSL_set_fd",
        "SSL_connect",
        "SSL_read",
        "SSL_write",
        "SSL_shutdown",
        "SSL_free",
        "SSL_CTX_free",
        "SSL_get_error",
        "TLS_client_method",
        "OPENSSL_init_ssl",
        "SSL_CTX_set_default_verify_paths",
        "SSL_set_verify",
        "SSL_set1_host",
        "SSL_get_verify_result",
        "SSL_ctrl",
        "SSL_ERROR_*",
        "SSL_VERIFY_*",
      ]
    exclude:
      - "__*"

# Constants from headers pulled in by ssl.h's include closure:
# X509_V_OK (x509_vfy.h) is the `SSL_get_verify_result` success word;
# SSL_CTRL_SET_TLSEXT_HOSTNAME + TLSEXT_NAMETYPE_host_name (tls1.h) are
# the `SSL_ctrl` pair `SSL_set_tlsext_host_name` expands to for SNI.
constants:
  [
    "X509_V_OK",
    "SSL_VERIFY_PEER",
    "SSL_CTRL_SET_TLSEXT_HOSTNAME",
    "TLSEXT_NAMETYPE_host_name",
    "SSL_ERROR_*",
  ]

symbols:
  # const SSL_METHOD *TLS_client_method(void) — returns the method
  # object; `handle` keeps it opaque.
  TLS_client_method:
    args: []
    ret: "Handle"

  # SSL_CTX *SSL_CTX_new(const SSL_METHOD *meth) — new context.
  SSL_CTX_new:
    args: ["handle"]
    ret: "Handle"

  # SSL *SSL_new(SSL_CTX *ctx) — new session over the context.
  SSL_new:
    args: ["handle"]
    ret: "Handle"

  # int SSL_set_fd(SSL *ssl, int fd) — bind the session to the socket.
  SSL_set_fd:
    args: ["handle", "i32"]

  # int SSL_connect(SSL *ssl) — TLS handshake (1 = ok, <=0 = error).
  SSL_connect:
    args: ["handle"]

  # int SSL_read(SSL *ssl, void *buf, int num) — out_buf consumes the
  # (buf,num) pair; `ret` is the decrypted byte count.
  SSL_read:
    args: ["handle", "out_buf:65536"]

  # int SSL_write(SSL *ssl, const void *buf, int num) — in_buf takes
  # Bytes and expands to (ptr, len).
  SSL_write:
    args: ["handle", "in_buf"]

  # int SSL_get_error(const SSL *ssl, int ret) — classify a <=0 ret.
  SSL_get_error:
    args: ["handle", "i32"]

  # int SSL_shutdown(SSL *ssl) — bidirectional close_notify.
  SSL_shutdown:
    args: ["handle"]

  # void SSL_free(SSL *ssl) / void SSL_CTX_free(SSL_CTX *ctx).
  SSL_free:
    args: ["handle"]
  SSL_CTX_free:
    args: ["handle"]

  # int OPENSSL_init_ssl(uint64_t opts, const void *settings) —
  # one-time init; OpenSSL 3 also self-inits on first use.
  OPENSSL_init_ssl:
    args: ["u64", "ptr"]

  # int SSL_CTX_set_default_verify_paths(SSL_CTX *ctx) — load the system
  # CA store (honours SSL_CERT_FILE/SSL_CERT_DIR); 1 = ok.
  SSL_CTX_set_default_verify_paths:
    args: ["handle"]

  # void SSL_set_verify(SSL *ssl, int mode, callback) — SSL_VERIFY_PEER
  # with a null callback = verify against the loaded CA store. The C
  # decl's function-pointer param doesn't parse, so the signature is
  # rescued whole: void return, no errno guard.
  SSL_set_verify:
    args: ["handle", "i32", "ptr"]
    ret: "()"
    guard: false

  # int SSL_set1_host(SSL *ssl, const char *host) — expected DNS
  # hostname for certificate verification; 1 = ok.
  SSL_set1_host:
    args: ["handle", "cstr"]

  # long SSL_get_verify_result(const SSL *ssl) — X509_V_OK (0) = the
  # peer chain verified.
  SSL_get_verify_result:
    args: ["handle"]

  # long SSL_ctrl(SSL *ssl, int cmd, long larg, void *parg) — used for
  # SNI: cmd=SSL_CTRL_SET_TLSEXT_HOSTNAME, larg=TLSEXT_NAMETYPE_host_name,
  # parg=hostname (`cstr` marshals the string pointer).
  SSL_ctrl:
    args: ["handle", "i32", "i64", "cstr"]
    ret: "Int"
    descriptor: "i64"
