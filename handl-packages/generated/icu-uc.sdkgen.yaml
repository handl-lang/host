# SDK generation config for ICU4C common library (libicuuc.so).
#
# Covers the `ubrk_*` (break iteration), `uloc_*` (locale id utilities),
# `uldn_*` (locale display names), and `ures_*` (resource bundles — used
# for CLDR `listPattern` data) surface used by `handl-packages/intl-c`.
# ICU renames every public symbol through `unicode/urename.h`, so all
# names below carry the host's version suffix — regenerate when the
# system ICU major version changes.
#
# `UErrorCode*` out-params are not auto-mappable, so each function taking
# one is rescued with an explicit `io_scalar:i32` tail arg; callers seed
# it with 0 and read the written code back from `vals`. UTF-16 `UChar*`
# buffers map to `in_ptr`/`out_ptr:N` — the semantic layer owns encoding
# and length bookkeeping (ICU wants *unit* counts, not bytes).

library: libicuuc.so

# ICU reports failures through `UErrorCode*` status words, never
# `errno` — disable the POSIX `ret < 0 -> err(errno())` guard
# library-wide (per-symbol `symbols.<name>.guard` would still win).
guard: false

headers:
  ubrk.h:
    include:
      [
        "ubrk_open_78",
        "ubrk_first_78",
        "ubrk_last_78",
        "ubrk_next_78",
        "ubrk_previous_78",
        "ubrk_current_78",
        "ubrk_getRuleStatus_78",
        "ubrk_close_78",
        "ubrk_countAvailable_78",
        "ubrk_getAvailable_78",
      ]
  uloc.h:
    include:
      [
        "uloc_getLanguage_78",
        "uloc_getScript_78",
        "uloc_getCountry_78",
        "uloc_getVariant_78",
        "uloc_getName_78",
        "uloc_forLanguageTag_78",
        "uloc_toLanguageTag_78",
        "uloc_canonicalForm_78",
        "uloc_countAvailable_78",
        "uloc_getAvailable_78",
      ]
  uldnames.h:
    include:
      [
        "uldn_open_78",
        "uldn_close_78",
        "uldn_localeDisplayName_78",
        "uldn_languageDisplayName_78",
        "uldn_scriptDisplayName_78",
        "uldn_regionDisplayName_78",
        "uldn_keyDisplayName_78",
        "uldn_keyValueDisplayName_78",
      ]
  ures.h:
    include: ["ures_open_78", "ures_close_78", "ures_getByKey_78", "ures_getUTF8String_78"]

symbols:
  # UBreakIterator* ubrk_open(UBreakIteratorType, const char *locale,
  #   const UChar *text, int32_t textLength, UErrorCode *status)
  # UBRK_CHARACTER=0, WORD=1, LINE=2, SENTENCE=3.
  # `text` is `ptr` not `in_ptr`: ubrk_open borrows the text pointer for the
  # iterator's whole lifetime, so the caller must hand it memory that stays
  # valid until ubrk_close — not an FFI arg buffer freed when the call
  # returns. intl-c mallocs the UTF-16 text, memcpy's into it, then frees
  # after ubrk_close.
  ubrk_open_78:
    args: ["i32", "cstr", "ptr", "i32", "io_scalar:i32"]
    names: ["type", "locale", "text", "text_length", "status"]
    ret: Int
    descriptor: "handle"

  # int32_t ubrk_first/last/next/previous/current(UBreakIterator*)
  # Boundary indices into the text, or UBRK_DONE (-1).
  ubrk_first_78:
    args: ["handle"]
    names: ["bi"]
    ret: Int
    descriptor: "i32"

  ubrk_last_78:
    args: ["handle"]
    names: ["bi"]
    ret: Int
    descriptor: "i32"

  ubrk_next_78:
    args: ["handle"]
    names: ["bi"]
    ret: Int
    descriptor: "i32"

  ubrk_previous_78:
    args: ["handle"]
    names: ["bi"]
    ret: Int
    descriptor: "i32"

  ubrk_current_78:
    args: ["handle"]
    names: ["bi"]
    ret: Int
    descriptor: "i32"

  # int32_t ubrk_getRuleStatus(UBreakIterator*) — status of the break
  # position most recently returned (word/line rule tags).
  ubrk_getRuleStatus_78:
    args: ["handle"]
    names: ["bi"]
    ret: Int
    descriptor: "i32"

  # void ubrk_close(UBreakIterator*)
  ubrk_close_78:
    args: ["handle"]
    names: ["bi"]

  # int32_t ubrk_countAvailable(void)
  ubrk_countAvailable_78:
    args: []
    names: []
    ret: Int
    descriptor: "i32"

  # const char* ubrk_getAvailable(int32_t index)
  ubrk_getAvailable_78:
    args: ["i32"]
    names: ["index"]
    ret: String
    descriptor: "cstr"

  # int32_t uloc_getLanguage/Script/Country/Variant(localeID, char*, int32_t,
  #   UErrorCode*) — component extraction into C-string buffers.
  uloc_getLanguage_78:
    args: ["cstr", "out_ptr:64", "i32", "io_scalar:i32"]
    names: ["locale_id", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  uloc_getScript_78:
    args: ["cstr", "out_ptr:64", "i32", "io_scalar:i32"]
    names: ["locale_id", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  uloc_getCountry_78:
    args: ["cstr", "out_ptr:64", "i32", "io_scalar:i32"]
    names: ["locale_id", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  uloc_getVariant_78:
    args: ["cstr", "out_ptr:64", "i32", "io_scalar:i32"]
    names: ["locale_id", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t uloc_getName(localeID, char *name, int32_t cap, UErrorCode*)
  uloc_getName_78:
    args: ["cstr", "out_ptr:128", "i32", "io_scalar:i32"]
    names: ["locale_id", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t uloc_forLanguageTag(const char *langtag, char *localeID,
  #   int32_t cap, int32_t *parsedLength, UErrorCode *status)
  uloc_forLanguageTag_78:
    args: ["cstr", "out_ptr:128", "i32", "io_scalar:i32", "io_scalar:i32"]
    names: ["langtag", "capacity", "parsed_length", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t uloc_toLanguageTag(const char *localeID, char *langtag,
  #   int32_t cap, UBool strict, UErrorCode *status)
  uloc_toLanguageTag_78:
    args: ["cstr", "out_ptr:128", "i32", "i32", "io_scalar:i32"]
    names: ["locale_id", "capacity", "strict", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t uloc_canonicalForm(const char *localeID, char *name, int32_t
  #   cap, UErrorCode *status)
  uloc_canonicalForm_78:
    args: ["cstr", "out_ptr:128", "i32", "io_scalar:i32"]
    names: ["locale_id", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t uloc_countAvailable(void)
  uloc_countAvailable_78:
    args: []
    names: []
    ret: Int
    descriptor: "i32"

  # const char* uloc_getAvailable(int32_t n)
  uloc_getAvailable_78:
    args: ["i32"]
    names: ["index"]
    ret: String
    descriptor: "cstr"

  # ULocaleDisplayNames* uldn_open(const char *locale, UDialectHandling,
  #   UErrorCode*)
  uldn_open_78:
    args: ["cstr", "i32", "io_scalar:i32"]
    names: ["locale", "dialect", "status"]
    ret: Int
    descriptor: "handle"

  # void uldn_close(ULocaleDisplayNames*)
  uldn_close_78:
    args: ["handle"]
    names: ["ldn"]

  # int32_t uldn_*DisplayName(ldn, const char *code, UChar*, int32_t,
  #   UErrorCode*)
  uldn_localeDisplayName_78:
    args: ["handle", "cstr", "out_ptr:256", "i32", "io_scalar:i32"]
    names: ["ldn", "locale", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  uldn_languageDisplayName_78:
    args: ["handle", "cstr", "out_ptr:256", "i32", "io_scalar:i32"]
    names: ["ldn", "lang", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  uldn_scriptDisplayName_78:
    args: ["handle", "cstr", "out_ptr:256", "i32", "io_scalar:i32"]
    names: ["ldn", "script", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  uldn_regionDisplayName_78:
    args: ["handle", "cstr", "out_ptr:256", "i32", "io_scalar:i32"]
    names: ["ldn", "region", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  uldn_keyDisplayName_78:
    args: ["handle", "cstr", "out_ptr:256", "i32", "io_scalar:i32"]
    names: ["ldn", "key", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t uldn_keyValueDisplayName(ldn, const char *key,
  #   const char *value, UChar*, int32_t, UErrorCode*)
  uldn_keyValueDisplayName_78:
    args: ["handle", "cstr", "cstr", "out_ptr:256", "i32", "io_scalar:i32"]
    names: ["ldn", "key", "value", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # UResourceBundle* ures_open(const char *packageName, const char *locale,
  #   UErrorCode *status). NULL package = ICU's own data tree — `ptr` with
  # 0 is passed from handl.
  ures_open_78:
    args: ["ptr", "cstr", "io_scalar:i32"]
    names: ["package", "locale", "status"]
    ret: Int
    descriptor: "handle"

  # void ures_close(UResourceBundle*)
  ures_close_78:
    args: ["handle"]
    names: ["res"]

  # UResourceBundle* ures_getByKey(parent, const char *key,
  #   UResourceBundle *fillIn, UErrorCode *status). `fill_in` = 0.
  ures_getByKey_78:
    args: ["handle", "cstr", "ptr", "io_scalar:i32"]
    names: ["res", "key", "fill_in", "status"]
    ret: Int
    descriptor: "handle"

  # const char* ures_getUTF8String(res, char *dest, int32_t *length,
  #   UBool forceCopy, UErrorCode *status)
  ures_getUTF8String_78:
    args: ["handle", "out_ptr:256", "io_scalar:i32", "i32", "io_scalar:i32"]
    names: ["res", "length", "force_copy", "status"]
    ret: String
    descriptor: "cstr"
