# SDK generation config for libcurl — the C backend for `fetch-c`.
#
# Only the non-variadic easy-API surface is generated here. The variadic
# calls (`curl_easy_setopt`, `curl_easy_getinfo`) are bound by hand in
# fetch-c.hnl via direct `ffi.call` — the variadic tail is per-call-site,
# exactly like `syscall`/`fcntl` in libc.sdkgen.yaml.
library: libcurl.so.4

headers:
  # Spec input is curl-spec/curl.h (re-declares the easy.h functions —
  # the collector only binds main-file decls). Key is the spec's stem.
  curl.h:
    include:
      [
        "curl_easy_init",
        "curl_easy_perform",
        "curl_easy_cleanup",
        "curl_easy_strerror",
        "curl_slist_append",
        "curl_slist_free_all",
        "CURLOPT_URL",
        "CURLOPT_WRITEDATA",
        "CURLOPT_HEADERDATA",
        "CURLOPT_HTTPHEADER",
        "CURLOPT_POSTFIELDS",
        "CURLOPT_POSTFIELDSIZE",
        "CURLOPT_COPYPOSTFIELDS",
        "CURLOPT_CUSTOMREQUEST",
        "CURLOPT_NOBODY",
        "CURLOPT_FOLLOWLOCATION",
        "CURLOPT_TIMEOUT_MS",
        "CURLOPT_USERAGENT",
        "CURLOPT_NOSIGNAL",
        "CURLOPT_SSL_VERIFYPEER",
        "CURLOPT_SSL_VERIFYHOST",
        "CURLINFO_RESPONSE_CODE",
        "CURLINFO_EFFECTIVE_URL",
        "CURLINFO_ACTIVESOCKET",
        "CURLE_OK",
        "curl_multi_init",
        "curl_multi_add_handle",
        "curl_multi_remove_handle",
        "curl_multi_perform",
        "curl_multi_fdset",
        "curl_multi_timeout",
        "curl_multi_info_read",
        "curl_multi_cleanup",
        "curl_multi_strerror",
        "curl_ws_send",
        "curl_ws_recv",
        "CURLM_OK",
        "CURLMSG_DONE",
        "CURLOPT_CONNECT_ONLY",
        "CURLOPT_WS_OPTIONS",
        "CURLWS_TEXT",
        "CURLWS_BINARY",
        "CURLWS_CONT",
        "CURLWS_PING",
        "CURLWS_PONG",
        "CURLWS_CLOSE",
        "CURLWS_RAW_MODE",
      ]

symbols:
  # Opaque handles map to `ptr`; CURLcode maps to `i32`.
  # CURL *curl_easy_init(void)
  curl_easy_init:
    args: []
    descriptor: "ptr"
  # CURLcode curl_easy_perform(CURL*)
  curl_easy_perform:
    args: ["ptr"]
    descriptor: "i32"
  # void curl_easy_cleanup(CURL*)
  curl_easy_cleanup:
    args: ["ptr"]
    descriptor: "void"
  # const char *curl_easy_strerror(CURLcode)
  curl_easy_strerror:
    args: ["i32"]
    descriptor: "cstr"
  # struct curl_slist *curl_slist_append(struct curl_slist *, const char *)
  curl_slist_append:
    args: ["ptr", "cstr"]
    descriptor: "ptr"
  # void curl_slist_free_all(struct curl_slist *)
  curl_slist_free_all:
    args: ["ptr"]
    descriptor: "void"

  # multi API — CURLM* is opaque, CURLMcode maps to `i32`.
  # CURLM *curl_multi_init(void)
  curl_multi_init:
    args: []
    descriptor: "ptr"
  # CURLMcode curl_multi_add_handle / remove_handle(CURLM*, CURL*)
  curl_multi_add_handle:
    args: ["ptr", "ptr"]
    descriptor: "i32"
  curl_multi_remove_handle:
    args: ["ptr", "ptr"]
    descriptor: "i32"
  # CURLMcode curl_multi_perform(CURLM*, int *running)
  curl_multi_perform:
    args: ["ptr", "io_scalar:i32"]
    descriptor: "i32"
  # CURLMcode curl_multi_fdset(CURLM*, fd_set *r, *w, *x, int *max_fd)
  # fd_set is FD_SETSIZE bits = 128 bytes on linux x86_64.
  curl_multi_fdset:
    args: ["ptr", "out_ptr:128", "out_ptr:128", "out_ptr:128", "io_scalar:i32"]
    descriptor: "i32"
  # CURLMcode curl_multi_timeout(CURLM*, long *ms)
  curl_multi_timeout:
    args: ["ptr", "io_scalar:i64"]
    descriptor: "i32"
  # CURLMsg *curl_multi_info_read(CURLM*, int *msgs_in_queue)
  curl_multi_info_read:
    args: ["ptr", "io_scalar:i32"]
    descriptor: "ptr"
  # CURLMcode curl_multi_cleanup(CURLM*)
  curl_multi_cleanup:
    args: ["ptr"]
    descriptor: "i32"
  # const char *curl_multi_strerror(CURLMcode)
  curl_multi_strerror:
    args: ["i32"]
    descriptor: "cstr"

  # WebSocket API — client only (libcurl has no WS server). The frame
  # struct is read through `ffi.read` from the meta pointer curl_ws_recv
  # hands back, so no `curl_ws_frame` binding is needed.
  # CURLcode curl_ws_send(CURL*, const void *buf, size_t n, size_t *sent,
  #                       curl_off_t fragsize, unsigned int flags)
  curl_ws_send:
    args: ["ptr", "in_buf", "io_scalar:usize", "i64", "i32"]
    descriptor: "i32"
    # CURLcode signals failure with a positive value (CURLE_OK is 0), so
    # the POSIX `ret < 0` guard would swallow every error.
    guard: false
  # CURLcode curl_ws_recv(CURL*, void *buf, size_t n, size_t *recv,
  #                       const struct curl_ws_frame **metap)
  # 65536 is the receive window; `io_scalar:usize` is the received byte
  # count, `out_ptr:8` the meta pointer.
  curl_ws_recv:
    args: ["ptr", "out_buf:65536", "io_scalar:usize", "out_ptr:8"]
    descriptor: "i32"
    guard: false
