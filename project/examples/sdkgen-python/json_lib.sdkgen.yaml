package: json_lib
doc: |
  real JSON parser/stringifier built on the OS Python json module.

  This package hides the FFI calls; consumers just use `parse` and `serialize`
  like any other Handl library.
library: libpython3.14.so
python_init: Py_Initialize
python_run: PyRun_SimpleString
env_get: getenv
env_get_lib: libc.so.6
env_var: HANDL_JQ_OUT
functions:
  - name: parse
    doc: Parse a JSON string into a compact, sorted JSON string.
    args:
      - name: json_string
        type: String
    script: "import json, os; d = json.loads('''$$json_string$$'''); os.putenv('HANDL_JQ_OUT', json.dumps(d, sort_keys=True))"
  - name: serialize
    doc: Serialize / normalize a JSON string through Python's json.loads/dumps.
    args:
      - name: json_string
        type: String
    script: "import json, os; d = json.loads('''$$json_string$$'''); os.putenv('HANDL_JQ_OUT', json.dumps(d, sort_keys=True))"
