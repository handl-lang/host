package: fs
doc: |
  tiny filesystem helpers backed by OS Python for now.

  Exposes `read_file` and other basic file operations.  The FFI stays
  inside this package so consumers just see ordinary Handl arrows.
library: libpython3.14.so
python_init: Py_Initialize
python_run: PyRun_SimpleString
env_get: getenv
env_get_lib: libc.so.6
env_var: HANDL_FILE
functions:
  - name: read_file
    doc: Read the contents of a local text file as a String.
    args:
      - name: path
        type: String
    script: "import os; f = open('''$$path$$''', 'r'); os.putenv('HANDL_FILE', f.read())"
