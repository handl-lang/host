# Parked ideas — the durable registry of retired Rust reifications.
#
# Principle (ADR-0040): the kernel holds only the composition primitives
# (`Plugin`, `Host`, `Operation`, `Behavior`, `RuleAcceptor`, `Contribution`);
# everything else is generic tooling, or Handl over a C ABI / SDK-gen contract.
# When a Rust crate implements an idea that is *not* kernel and *not* generic
# tooling, the crate is the wrong reification — retire the crate, keep the idea.
#
# This file is the idea. It is validated by
# `crates/platform-tests/tests/wiring.rs`, which fails the build if:
#   * a retired crate is still a workspace member (park it, don't keep it warm),
#   * a workspace member is depended on by nothing and is not listed below,
#   * an entry below refers to a crate that no longer exists.
#
# Retiring is reversible: every crate removed for a `retired` entry was tagged
# `parked/<family>-2026` immediately before removal, so
# `git checkout parked/<family>-2026 -- crates/<dir>` restores it.
#
# status:
#   superseded  — a successor exists; do not unpark, use the successor.
#   proposed    — an ADR that was never accepted; unpark only if accepted.
#   unproven    — implemented but never wired; unpark if the need appears.

version: 1

# Crates with no in-repo dependent that are legitimate entry points: binaries,
# benches, workspace-level test crates, dev-only helpers, and the root facade.
entry_points:
  - crate: handl
    why: root facade package (re-exports `handl-platform`).
  - crate: handl-host-cli
    why: the `hnl` binary — the main runtime entry point.
  - crate: handl-host-lsp
    why: the language-server binary.
  - crate: handl-bench
    why: "`cargo bench` harness."
  - crate: handl-ext-tests
    why: workspace-level cross-crate integration tests.
  - crate: handl-platform-tests
    why: workspace-level invariant tests (this gate lives here).
  - crate: handl-defining-handl
    why: self-hosting corpus tests.
  - crate: handl-test-utils
    why: shared test helpers, consumed as a dev-dependency.
  - crate: handl-plugin-engine-typecheck-nbe
    why: ADR-0125 bootstrap type synthesiser — mid-wiring.

# Crates that nothing depends on but that are build *artifacts* rather than
# entry points — e.g. a cdylib loaded at runtime by another crate's tests.
exempt:
  - crate: handl-plugin-loader-native-fixture-echo
    why: "Test fixture cdylib loaded at runtime by `plugin-loader-native`'s tests; intentionally not a Cargo dependency."

retired:
  # ---------------------------------------------------------------------------
  # Exec-control plugins (ADR-0040). A self-contained island: `logging` was
  # referenced only by `allow`/`deny`. `plugin-exec-cache` is unaffected (live
  # via `plugin-engine-test`).
  # ---------------------------------------------------------------------------
  - was: handl-plugin-exec-allow
    loc: 177
    idea: Per-exec policy plugins — allow, deny, count, map, trace, and call/depth limits.
    adr: ADR-0040
    status: superseded
    superseded_by: "Engine-internal limits: ADR-0040's own status records that `SandboxHost` already carries `max_depth`/`max_calls`, and the exec engines enforce their own policy."
    unpark: "Only if a host needs exec policy *outside* the engines; per the kernel rule that belongs in a Handl policy over a small `exec` C-ABI op, not a Rust crate."
  - was: handl-plugin-exec-deny
    loc: 176
    idea: Deny-list exec policy plugin.
    adr: ADR-0040
    status: superseded
    superseded_by: "Same as `handl-plugin-exec-allow`."
    unpark: "Same as `handl-plugin-exec-allow`."
  - was: handl-plugin-exec-counter
    loc: 208
    idea: Count executed operations.
    adr: ADR-0040
    status: superseded
    superseded_by: "Engine-internal limits (the `max_calls` family) and `plugin-exec-cache`."
    unpark: "Re-express as a Handl-visible counter over the exec op if a consumer appears."
  - was: handl-plugin-exec-map
    loc: 257
    idea: Rewrite a call's callee (identity-specific exec control).
    adr: ADR-0040
    status: superseded
    superseded_by: "The AST engines' native ops; `plugin-exec-map` was named in the engine-genericity audit as an identity-specific leftover."
    unpark: "No — the transform engine (ADR-0094) is the right seam for call rewriting."
  - was: handl-plugin-exec-trace
    loc: 259
    idea: Emit an execution trace.
    adr: ADR-0040
    status: superseded
    superseded_by: "The `TestEvent` sink (ADR-0089) and the transform `--trace` output (ADR-0094)."
    unpark: "Only if a finer-grained exec trace is needed; wire it through the event sink."
  - was: handl-plugin-exec-max-calls
    loc: 201
    idea: Cap the number of executed calls.
    adr: ADR-0040
    status: superseded
    superseded_by: "`SandboxHost::max_calls` (ADR-0040 status)."
    unpark: "No — inlined in the sandbox."
  - was: handl-plugin-exec-max-depth
    loc: 209
    idea: Cap call/recursion depth.
    adr: ADR-0040
    status: superseded
    superseded_by: "`SandboxHost::max_depth` (ADR-0040 status)."
    unpark: "No — inlined in the sandbox."
  - was: handl-plugin-exec-logging
    loc: 166
    idea: Log each exec-control decision.
    adr: ADR-0040
    status: superseded
    superseded_by: "Only `allow`/`deny` consumed it; both are retired. The engine-genericity audit already flagged it as identity-specific."
    unpark: "Re-express via the event sink if a consumer appears."

  # ---------------------------------------------------------------------------
  # Loaders (ADR-0035) — an ADR that was never accepted (status: Proposed).
  # ---------------------------------------------------------------------------
  - was: handl-plugin-loader-wasm
    loc: 232
    idea: Load `.wasm` plugins via wasmi.
    adr: ADR-0035
    status: proposed
    unpark: "Unpark only if ADR-0035 is accepted. Its own conclusion is that hosts should run the Handl `load` capability instead of hard-coding a loader."
  - was: handl-plugin-loader-web
    loc: 198
    idea: Load plugins over HTTP.
    adr: ADR-0035
    status: proposed
    unpark: "Same as `handl-plugin-loader-wasm`."

  # ---------------------------------------------------------------------------
  # Placeholders and unimplemented ideas.
  # ---------------------------------------------------------------------------
  - was: handl-plugin-ext-build
    loc: 3
    idea: A `build` extension plugin.
    adr: ADR-0034
    status: proposed
    superseded_by: "ADR-0034 is archived; the extension slot survived as a name only."
    unpark: "No — recreate from the ADR when a build pipeline actually exists."
  - was: handl-plugin-engine-transform-parallel
    loc: 438
    idea: Parallel bottom-up transform pass (partition at the root's top-level children).
    adr: ADR-0094
    status: unproven
    superseded_by: "The sequential `RewriteEngine`. ADR-0094 records it as implemented but out of scope for reachable inputs; the crate's own docs note the 1M-node threshold keeps it on the sequential fallback."
    unpark: "Unpark if a transform workload exceeds ~1M AST nodes and the arena-merge overhead becomes the bottleneck."
  - was: handl-plugin-diag-expression
    loc: 168
    idea: Expression-level diagnostics as a `LintBehavior` contributor.
    adr: ADR-0091
    status: superseded
    superseded_by: "`plugin-ext-diag` (shared diagnostics, ADR-0091) plus lint-rules-as-data (`plugin-engine-lint`, ADR-0097). `host-tooling` had already dropped it as a dead dependency."
    unpark: "No — use `plugin-ext-diag` + `lint_source`."
  - was: handl-plugin-source
    loc: 396
    idea: Format-agnostic `SourceLocation`/`SourceMap` for span tracking.
    adr: ADR-0097
    status: superseded
    superseded_by: "Spans ride on the Pratt AST and `plugin-ext-diag::Span`; ADR-0097 notes the AST already carries the spans the old token-zipping hack tried to recover."
    unpark: "No — if a non-AST consumer needs line/col, add it to `plugin-ext-diag`."
