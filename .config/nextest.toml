# Nextest profiles — the default profile runs everything (the full gate).
#
# `fast` is the local-iteration lane: it skips `loader_parity` (68 s).
# `dependent_structure`/`axis_flow_boundaries` moved to the
# `engine-typecheck-nbe` repo — they no longer apply here. The
# remaining tests finish in minutes at `-j 2`. Run the default profile
# before pushing anything that touches the loader.

[profile.fast]
default-filter = 'not test(loader_parity)'
