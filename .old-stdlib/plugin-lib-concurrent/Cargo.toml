[package]
name = "handl-plugin-lib-concurrent"
version.workspace = true
edition.workspace = true

[dependencies]
handl-platform = { workspace = true }
handl-plugin-module = { path = "../plugin-module" }
handl-plugin-lib-handl = { path = "../plugin-lib-handl" }
handl-plugin-ext-eval = { path = "../plugin-ext-eval" }
serde_json = "1"
parking_lot = "0.12"
crossbeam-deque = "0.8"
mio = { version = "1", features = ["net", "os-poll"] }

[dev-dependencies]
criterion = "0.5.1"
proptest = "1.6"
loom = "0.7"

[[bench]]
name = "concurrent"
path = "benches/concurrent.rs"
harness = false
