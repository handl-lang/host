name: dogfood

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  dogfood:
    name: hnl dogfood gate over handl-packages and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dogfood-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: dogfood-cargo-${{ runner.os }}-

      - name: Build hnl
        run: cargo build -p handl-host-cli

      - name: Run dogfood gate
        run: ./scripts/dogfood-gate.sh
