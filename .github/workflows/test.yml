name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Trim debuginfo: the workspace debug target is ~8.5 GB with it and does
  # not fit on small runners. Does not affect test outcomes.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  workspace:
    name: workspace tests + doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-cargo-${{ runner.os }}-

      # `-j 2` is deliberate, not timidity: in nextest `-j` is the number of
      # *tests* running at once (not binaries, and `--test-threads` is an
      # alias for it). Several cases — the cranelift JIT and
      # `standalone_bootstrap`, which compiles the corpus to native and runs
      # it — use multiple GB each, so a high `-j` OOMs the runner. See
      # AGENTS.md §"Prefer nextest for the full suite".
      - name: Workspace tests
        run: cargo nextest run --workspace -j 2

      # nextest does not run doctests, so they need their own step. Without
      # this they are gated nowhere: the coverage job is `continue-on-error`
      # and only includes doctests when `--doctests` is passed.
      - name: Doctests
        run: cargo test --doc --workspace
