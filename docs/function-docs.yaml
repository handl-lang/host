parse:
  parse:
    description: Parse a string using a registered parser.
    details: Given `input` and `parser`, `parse.parse` dispatches to the registered
      parser. `parser` must be a parser object such as `url_whatwg` or `url_rfc`.
    examples:
    - 'parse.parse("https://example.com:8080/path?a=1#frag", url_whatwg)'
    - 'parse.parse("https://example.com/%ZZ", url_rfc)'
    params:
    - name: input
      type: String
      description: the `input` string to parse
    - name: parser
      type: Object
      description: a parser object
    return_value: Object
    see: []
    signature: 'parse.parse(input: String, parser: Object)'
url_whatwg:
  url_whatwg:
    description: Return the WHATWG URL parser object.
    details: >
      `url_whatwg` returns a parser token for the WHATWG URL Standard. It must
      be passed to `parse.parse`.
    examples:
    - 'parse.parse("HTtpS://EXAMPLE.com/../a/../b", url_whatwg)'
    params: []
    return_value: Object
    see: []
    signature: 'url_whatwg()'
url_rfc:
  url_rfc:
    description: Return the strict RFC 3986 URI parser object.
    details: >
      `url_rfc` returns a parser token for strict RFC 3986 URIs. It must be
      passed to `parse.parse`.
    examples:
    - 'parse.parse("https://example.com:8080/path?a=1#frag", url_rfc)'
    params: []
    return_value: Object
    see: []
    signature: 'url_rfc()'

