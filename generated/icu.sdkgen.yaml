  # void unum_setTextAttribute(fmt, UNumberFormatTextAttribute,
  #   const UChar*, int32_t, UErrorCode*)
  unum_setTextAttribute_78:
    args: ["handle", "i32", "in_ptr", "i32", "io_scalar:i32"]
    names: ["format", "tag", "value", "value_length", "status"]

  # void unum_setAttribute(fmt, UNumberFormatAttribute, int32_t, UErrorCode*)
  unum_setAttribute_78:
    args: ["handle", "i32", "i32", "io_scalar:i32"]
    names: ["format", "attr", "value", "status"]

  # int32_t unum_getAttribute(fmt, UNumberFormatAttribute, UErrorCode*)
  unum_getAttribute_78:
    args: ["handle", "i32", "io_scalar:i32"]
    names: ["format", "attr", "status"]
    ret: Int
    descriptor: "i32"

  # UPluralRules* uplrules_open(const char *locale, UErrorCode *status)
  uplrules_open_78:
    args: ["cstr", "io_scalar:i32"]
    names: ["locale", "status"]
    ret: Int
    descriptor: "handle"

  # UPluralRules* uplrules_openForType(const char*, UPluralType, UErrorCode*)
  uplrules_openForType_78:
    args: ["cstr", "i32", "io_scalar:i32"]
    names: ["locale", "type", "status"]
    ret: Int
    descriptor: "handle"

  # int32_t uplrules_select(const UPluralRules*, double, UChar*, int32_t,
  #                         UErrorCode*)
  uplrules_select_78:
    args: ["handle", "f64", "out_ptr:128", "i32", "io_scalar:i32"]
