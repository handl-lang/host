# SDK generation config for ICU4C (libicui18n.so).
#
# Covers the `ucol_*` (collation) and `unum_*` (number formatting) surface
# used by `handl-packages/intl-c`. ICU renames every public symbol through
# `unicode/urename.h` (`ucol_open` -> `ucol_open_78` on this host), so all
# names below carry the host's version suffix — regenerate when the system
# ICU major version changes.
#
# `UErrorCode*` out-params are not auto-mappable, so each function taking
# one is rescued with an explicit `io_scalar:i32` tail arg; callers seed it
# with 0 and read the written code back from `vals`. UTF-16 `UChar*`
# buffers map to `in_ptr`/`out_ptr:N` — the semantic layer owns encoding
# and length bookkeeping (ICU wants *unit* counts, not bytes).

library: libicui18n.so

# ICU reports failures through `UErrorCode*` status words, never
# `errno` — disable the POSIX `ret < 0 -> err(errno())` guard
# library-wide (per-symbol `symbols.<name>.guard` would still win).
guard: false

headers:
  ucol.h:
    include:
      [
        "ucol_open_78",
        "ucol_openRules_78",
        "ucol_close_78",
        "ucol_strcoll_78",
        "ucol_strcollUTF8_78",
        "ucol_equal_78",
        "ucol_greater_78",
        "ucol_greaterOrEqual_78",
        "ucol_getSortKey_78",
        "ucol_getStrength_78",
        "ucol_setStrength_78",
        "ucol_getAttribute_78",
        "ucol_setAttribute_78",
        "ucol_getDisplayName_78",
        "ucol_getLocaleByType_78",
        "ucol_getAvailable_78",
        "ucol_countAvailable_78",
      ]
  unum.h:
    include:
      [
        "unum_open_78",
        "unum_openForCurrentLocale_78",
        "unum_close_78",
        "unum_formatDouble_78",
        "unum_format_78",
        "unum_formatInt64_78",
        "unum_formatDecimal_78",
        "unum_formatDoubleForFields_78",
        "unum_getSymbol_78",
        "unum_setSymbol_78",
        "unum_setTextAttribute_78",
        "unum_setAttribute_78",
        "unum_getAttribute_78",
        "unum_toPattern_78",
        "unum_getLocaleByType_78",
      ]
  upluralrules.h:
    include:
      ["uplrules_open_78", "uplrules_openForType_78", "uplrules_select_78", "uplrules_close_78"]
  ureldatefmt.h:
    include:
      [
        "ureldatefmt_open_78",
        "ureldatefmt_format_78",
        "ureldatefmt_formatNumeric_78",
        "ureldatefmt_close_78",
      ]
  udat.h:
    include:
      [
        "udat_open_78",
        "udat_format_78",
        "udat_formatForFields_78",
        "udat_parse_78",
        "udat_close_78",
      ]
  ufieldpositer.h:
    include: ["ufieldpositer_open_78", "ufieldpositer_next_78", "ufieldpositer_close_78"]
  unumberformatter.h:
    include:
      [
        "unumf_openForSkeletonAndLocale_78",
        "unumf_openResult_78",
        "unumf_formatDouble_78",
        "unumf_resultToString_78",
        "unumf_close_78",
        "unumf_closeResult_78",
      ]
  uformattednumber.h:
    include: ["unumf_openResult_78", "unumf_resultToString_78", "unumf_closeResult_78"]

symbols:
  # const UCollator* ucol_open(const char *loc, UErrorCode *status)
  # NULL loc = ICU default locale; callers pass a locale string or use
  # the contract layer's default.
  ucol_open_78:
    args: ["cstr", "io_scalar:i32"]
    names: ["locale", "status"]
    ret: Int
    descriptor: "handle"

  # void ucol_close(UCollator*) — `coll` is a resource record, not an int.
  ucol_close_78:
    args: ["handle"]
    names: ["coll"]

  # UColAttributeValue-ish strength getter/setter — `coll` is a handle.
  ucol_getStrength_78:
    args: ["handle"]
    names: ["coll"]
    ret: Int
    descriptor: "i32"

  ucol_setStrength_78:
    args: ["handle", "i32"]
    names: ["coll", "strength"]

  # UCollator* ucol_openRules(const UChar *rules, int32_t rulesLength,
  #   UColRuleOption mode, UParseError *parseError, UErrorCode *status)
  ucol_openRules_78:
    args: ["in_ptr", "i32", "i32", "ptr", "io_scalar:i32"]
    names: ["rules", "rules_length", "mode", "parse_error", "status"]
    ret: Int
    descriptor: "handle"

  # UCollationResult ucol_strcoll(const UCollator*, const UChar*, int32_t,
  #                               const UChar*, int32_t)
  # in_ptr keeps the UTF-16 units opaque; unit lengths stay explicit
  # (in_buf's implicit length is a byte count — wrong for UChar*).
  ucol_strcoll_78:
    args: ["handle", "in_ptr", "i32", "in_ptr", "i32"]
    names: ["coll", "source", "source_length", "target", "target_length"]
    ret: Int
    descriptor: "i32"

  # ucol_strcollUTF8 — UTF-8 fast path; in_buf supplies the byte length.
  ucol_strcollUTF8_78:
    args: ["handle", "in_buf", "in_buf", "io_scalar:i32"]
    names: ["coll", "source", "target", "status"]
    ret: Int
    descriptor: "i32"

  ucol_equal_78:
    args: ["handle", "in_ptr", "i32", "in_ptr", "i32"]
    names: ["coll", "source", "source_length", "target", "target_length"]
    ret: Int
    descriptor: "i32"

  ucol_greater_78:
    args: ["handle", "in_ptr", "i32", "in_ptr", "i32"]
    names: ["coll", "source", "source_length", "target", "target_length"]
    ret: Int
    descriptor: "i32"

  ucol_greaterOrEqual_78:
    args: ["handle", "in_ptr", "i32", "in_ptr", "i32"]
    names: ["coll", "source", "source_length", "target", "target_length"]
    ret: Int
    descriptor: "i32"

  # int32_t ucol_getSortKey(coll, const UChar*, int32_t, uint8_t*, int32_t)
  ucol_getSortKey_78:
    args: ["handle", "in_ptr", "i32", "out_ptr:4096", "i32"]
    names: ["coll", "source", "source_length", "capacity"]
    ret: Int
    descriptor: "i32"

  # UColAttributeValue ucol_getAttribute(coll, UColAttribute, UErrorCode*)
  ucol_getAttribute_78:
    args: ["handle", "i32", "io_scalar:i32"]
    names: ["coll", "attr", "status"]
    ret: Int
    descriptor: "i32"

  # void ucol_setAttribute(coll, UColAttribute, UColAttributeValue, UErrorCode*)
  ucol_setAttribute_78:
    args: ["handle", "i32", "i32", "io_scalar:i32"]
    names: ["coll", "attr", "value", "status"]

  # int32_t ucol_getDisplayName(objLoc, dispLoc, UChar *result, int32_t cap,
  #                             UErrorCode *status)
  ucol_getDisplayName_78:
    args: ["cstr", "cstr", "out_ptr:512", "i32", "io_scalar:i32"]
    names: ["obj_locale", "display_locale", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # const char* ucol_getLocaleByType(coll, ULocDataLocaleType, UErrorCode*)
  ucol_getLocaleByType_78:
    args: ["handle", "i32", "io_scalar:i32"]
    names: ["coll", "type", "status"]
    ret: String
    descriptor: "cstr"

  # UNumberFormat* unum_open(UNumberFormatStyle style, const UChar *pattern,
  #   int32_t patternLength, const char *locale, UParseError *parseError,
  #   UErrorCode *status)
  unum_open_78:
    args: ["i32", "ptr", "i32", "cstr", "ptr", "io_scalar:i32"]
    names: ["style", "pattern", "pattern_length", "locale", "parse_error", "status"]
    ret: Int
    descriptor: "handle"

  # void unum_close(UNumberFormat*) — `format` is a resource record.
  unum_close_78:
    args: ["handle"]
    names: ["format"]

  # UNumberFormat* unum_openForCurrentLocale(UNumberFormatStyle, UErrorCode*)
  unum_openForCurrentLocale_78:
    args: ["i32", "io_scalar:i32"]
    names: ["style", "status"]
    ret: Int
    descriptor: "handle"

  # int32_t unum_formatDouble(fmt, double, UChar *result, int32_t cap,
  #                           UFieldPosition *pos, UErrorCode *status)
  unum_formatDouble_78:
    args: ["handle", "f64", "out_ptr:512", "i32", "ptr", "io_scalar:i32"]
    names: ["format", "number", "capacity", "pos", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t unum_format(fmt, int32_t, UChar*, int32_t, UFieldPosition*, UErrorCode*)
  unum_format_78:
    args: ["handle", "i32", "out_ptr:512", "i32", "ptr", "io_scalar:i32"]
    names: ["format", "number", "capacity", "pos", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t unum_formatInt64(fmt, int64_t, UChar*, int32_t, UFieldPosition*, UErrorCode*)
  unum_formatInt64_78:
    args: ["handle", "i64", "out_ptr:512", "i32", "ptr", "io_scalar:i32"]
    names: ["format", "number", "capacity", "pos", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t unum_formatDecimal(fmt, const char *number, int32_t length,
  #                            UChar*, int32_t, UFieldPosition*, UErrorCode*)
  unum_formatDecimal_78:
    args: ["handle", "cstr", "i32", "out_ptr:512", "i32", "ptr", "io_scalar:i32"]
    names: ["format", "number", "number_length", "capacity", "pos", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t unum_getSymbol(fmt, UNumberFormatSymbol, UChar *buffer,
  #                        int32_t size, UErrorCode *status)
  unum_getSymbol_78:
    args: ["handle", "i32", "out_ptr:128", "i32", "io_scalar:i32"]
    names: ["format", "symbol", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # void unum_setSymbol(fmt, UNumberFormatSymbol, const UChar *value,
  #                     int32_t length, UErrorCode *status)
  unum_setSymbol_78:
    args: ["handle", "i32", "in_ptr", "i32", "io_scalar:i32"]
    names: ["format", "symbol", "value", "length", "status"]

  # int32_t unum_toPattern(fmt, UBool isPatternLocalized, UChar *result,
  #                        int32_t cap, UErrorCode *status)
  unum_toPattern_78:
    args: ["handle", "i32", "out_ptr:256", "i32", "io_scalar:i32"]
    names: ["format", "localized", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # const char* unum_getLocaleByType(fmt, ULocDataLocaleType, UErrorCode*)
  unum_getLocaleByType_78:
    args: ["handle", "i32", "io_scalar:i32"]
    names: ["format", "type", "status"]
    ret: String
    descriptor: "cstr"

  # int32_t unum_formatDoubleForFields(fmt, double, UChar*, int32_t,
  #   UFieldPositionIterator*, UErrorCode*)
  unum_formatDoubleForFields_78:
    args: ["handle", "f64", "out_ptr:512", "i32", "handle", "io_scalar:i32"]
    names: ["format", "number", "capacity", "fpositer", "status"]
    ret: Int
