  # URelativeDateTimeFormatter* ureldatefmt_open(const char*, UNumberFormat*,
  #   UDateRelativeDateTimeFormatterStyle, UDisplayContext, UErrorCode*)
  ureldatefmt_open_78:
    args: ["cstr", "ptr", "i32", "i32", "io_scalar:i32"]
    names: ["locale", "nf_to_adopt", "width", "capitalization", "status"]
    ret: Int
    descriptor: "handle"

  # int32_t ureldatefmt_format(fmt, double, URelativeDateTimeUnit, UChar*,
  #                            int32_t, UErrorCode*)
  ureldatefmt_format_78:
    args: ["handle", "f64", "i32", "out_ptr:512", "i32", "io_scalar:i32"]
    names: ["fmt", "offset", "unit", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # int32_t ureldatefmt_formatNumeric(fmt, double, URelativeDateTimeUnit,
  #   UChar*, int32_t, UErrorCode*)
  ureldatefmt_formatNumeric_78:
    args: ["handle", "f64", "i32", "out_ptr:512", "i32", "io_scalar:i32"]
    names: ["fmt", "offset", "unit", "capacity", "status"]
    ret: Int
    descriptor: "i32"

  # void ureldatefmt_close(URelativeDateTimeFormatter*)
  ureldatefmt_close_78:
