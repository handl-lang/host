  udat_close_78:
    args: ["handle"]
    names: ["format"]

  # UFieldPositionIterator* ufieldpositer_open(UErrorCode *status)
  ufieldpositer_open_78:
    args: ["io_scalar:i32"]
    names: ["status"]
    ret: Int
    descriptor: "handle"

  # int32_t ufieldpositer_next(iter, int32_t *beginIndex, int32_t *endIndex)
  ufieldpositer_next_78:
    args: ["handle", "io_scalar:i32", "io_scalar:i32"]
    names: ["iter", "begin_index", "end_index"]
    ret: Int
    descriptor: "i32"

  # void ufieldpositer_close(UFieldPositionIterator*)
  ufieldpositer_close_78:
