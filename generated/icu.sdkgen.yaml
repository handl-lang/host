  # UDateFormat* udat_open(UDateFormatStyle timeStyle, UDateFormatStyle
  #   dateStyle, const char *locale, const UChar *tzID, int32_t tzIDLength,
  #   const UChar *pattern, int32_t patternLength, UErrorCode *status)
  # `pattern` stays `ptr` (NULL — style-driven formatting); `tz_id` carries
  # an optional UTF-16 zone id (empty = platform default).
  udat_open_78:
    args: ["i32", "i32", "cstr", "in_ptr", "i32", "ptr", "i32", "io_scalar:i32"]
    names:
      [
        "time_style",
        "date_style",
        "locale",
        "tz_id",
        "tz_id_length",
        "pattern",
        "pattern_length",
        "status",
      ]
    ret: Int
    descriptor: "handle"

  # int32_t udat_format(fmt, UDate, UChar*, int32_t, UFieldPosition*, UErrorCode*)
  udat_format_78:
    args: ["handle", "f64", "out_ptr:512", "i32", "ptr", "io_scalar:i32"]
    names: ["format", "date", "capacity", "position", "status"]
    ret: Int
