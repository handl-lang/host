# SDK generation config for libc.
# Overrides exist for signatures whose C intent isn't recoverable from the
# type system: out-buffers, out-params, and unparseable decls that are
# still worth a binding.
library: libc.so.6

# glibc gates some declarations behind feature-test macros.
defines:
  - _GNU_SOURCE

# Per-header narrowing — the equivalent of `--include`/`--exclude`, kept
# in config so regeneration is reproducible without remembering CLI flags.
headers:
  random.h:
    include: ["getrandom", "getentropy", "GRND_*"]
  netdb.h:
    include: ["getaddrinfo", "freeaddrinfo", "gai_strerror", "AI_*", "EAI_*"]
  unistd.h:
    include: ["close", "read", "write", "pipe", "pipe2", "dup", "dup2", "lseek", "syscall"]
  time.h:
    include:
      [
        "time",
        "clock",
        "difftime",
        "nanosleep",
        "clock_getres",
        "clock_gettime",
        "clock_settime",
        "timespec",
        "CLOCK_MONOTONIC",
        "CLOCK_REALTIME",
      ]
  # sys/epoll.h — the basename keys the entry, like socket.h's port.
  # epoll_event/epoll_data stay unlisted: epoll_data is a union (unions
  # aren't collected) and both bound functions carry hand-written struct
  # descriptors below, so the records would emit and be pruned anyway.
  epoll.h:
    include:
      [
        "epoll_create1",
        "epoll_ctl",
        "epoll_wait",
        "EPOLLIN",
        "EPOLLPRI",
        "EPOLLOUT",
        "EPOLLRDHUP",
        "EPOLLERR",
        "EPOLLHUP",
        "EPOLLET",
        "EPOLLONESHOT",
        "EPOLL_CLOEXEC",
        "EPOLL_CTL_ADD",
        "EPOLL_CTL_MOD",
        "EPOLL_CTL_DEL",
      ]
  fcntl.h:
    include:
      ["fcntl", "F_GETFL", "F_SETFL", "F_GETFD", "F_SETFD", "FD_CLOEXEC", "O_NONBLOCK", "O_CLOEXEC"]
  # netinet/tcp.h — constants-only run (TCP_NODELAY/TCP_CORK are consumed
  # through the already-bound setsockopt). With no emitted function the
  # unreferenced-type prune is a no-op, so `exclude` trims the
  # sys/types.h/pthread/socket debris the include closure drags in.
  tcp.h:
    include: ["TCP_NODELAY", "TCP_CORK"]
    exclude:
      [
        "__*",
        "*_t",
        "u_*",
        "timeval",
        "timespec",
        "fd_set",
        "fd_mask",
        "iovec",
        "sockaddr",
        "sockaddr_storage",
        "msghdr",
        "mmsghdr",
        "ucred",
        "linger",
        "osockaddr",
        "ulong",
        "ushort",
        "uint",
        "register_t",
        "error_t",
      ]
  # errno.h — the E* names are #defines folded by the macro probe.
  # `error_t` is the header's only type decl; excluded so the module
  # stays constants-only.
  errno.h:
    include:
      [
        "EAGAIN",
        "EWOULDBLOCK",
        "EINTR",
        "EINPROGRESS",
        "ECONNRESET",
        "EPIPE",
        "ECONNABORTED",
        "ENOTCONN",
        "EBADF",
        "EADDRNOTAVAIL",
        "ECONNREFUSED",
      ]
    exclude: ["error_t"]

symbols:
  # long syscall(long sysno, ...) — bound for the memfd_create shape:
  # syscall(SYS_memfd_create, name, flags). Other syscall forms would need
  # their own arg lists (the variadic tail is per-call-site).
  syscall:
    args: ["i64", "cstr", "u32"]
    names: ["sysno", "name", "flags"]

  # ssize_t recv(int fd, void *buf, size_t len, int flags)
  # out_buf expands to (ptr,len) — consumes the `len` C slot — and wraps
  # the return as { ret, buf }. Port args: (fd, flags).
  recv:
    args: ["i32", "out_buf:65536", "i32"]

  # ssize_t read(int fd, void *buf, size_t n) — same trick.
  read:
    args: ["i32", "out_buf:65536"]

  # ssize_t getrandom(void *buf, size_t len, unsigned flags)
  # getrandom(2) returns at most 256 bytes per call — out_buf:256 is both
  # the allocation and the request size; `ret` is the actual count.
  # Port args: (flags). Pass GRND_NONBLOCK for the urandom pool.
  getrandom:
    args: ["out_buf:256", "u32"]
    names: ["flags"]

  # int getentropy(void *buf, size_t len) — same shape, ≤256 bytes.
  getentropy:
    args: ["out_buf:256"]

  # int getaddrinfo(node, service, hints, res) — `res` is `addrinfo **`:
  # io_scalar:usize passes &cell and reads the head pointer back as an
  # Int in `vals[0]`; `ffi.read` then walks the `ai_next` chain and
  # `freeaddrinfo` releases it. `hints` is an in_struct over the real
  # LP64 layout (glibc, 48 bytes — fields a Handl record omits stay
  # zeroed).
  getaddrinfo:
    args:
      [
        "cstr",
        "cstr",
        "in_struct:{ai_flags:i32@0:4,ai_family:i32@4:4,ai_socktype:i32@8:4,ai_protocol:i32@12:4,ai_addrlen:u32@16:4,ai_addr:ptr@24:8,ai_canonname:ptr@32:8,ai_next:ptr@40:8}",
        "io_scalar:usize",
      ]
    names: ["node", "service", "hints", "res"]

  # void freeaddrinfo(struct addrinfo *res) — `ptr` takes the head
  # address captured by getaddrinfo's io_scalar out-cell.
  freeaddrinfo:
    args: ["ptr"]

  # const char *gai_strerror(int errcode) — auto-maps the cstr return.
  gai_strerror:
    args: ["i32"]

  # int accept(int fd, struct sockaddr *addr, socklen_t *addrlen)
  # (addr, addrlen) is the POSIX value-result pair: `io_buf:128` allocates
  # a sockaddr_storage-sized buffer plus a len cell seeded with 128 and
  # passes (ptr, &len). `ret` is the new fd — the emitter returns the
  # whole `{ ret, buf, outs }` record as AcceptResult.
  accept:
    args: ["i32", "io_buf:128"]
    names: ["fd"]
  accept4:
    args: ["i32", "io_buf:128", "i32"]
    names: ["fd", "flags"]
  getsockname:
    args: ["i32", "io_buf:128"]
    names: ["fd"]
  getpeername:
    args: ["i32", "io_buf:128"]
    names: ["fd"]

  # ssize_t recvfrom(fd, buf, len, flags, src_addr, addrlen) — a plain
  # out_buf for the payload plus an io_buf value-result pair for the
  # peer address. Two out-slots → RecvfromResult record.
  recvfrom:
    args: ["i32", "out_buf:65536", "i32", "io_buf:128"]
    names: ["fd", "flags"]

  # int socketpair(d, t, p, int sv[2]) — sv is an 8-byte fixed-size
  # out-param passed as a bare pointer → out_ptr:8.
  socketpair:
    args: ["i32", "i32", "i32", "out_ptr:8"]
    names: ["domain", "type", "protocol"]

  # int pipe(int fildes[2]) — same fixed out-array as socketpair.
  pipe:
    args: ["out_ptr:8"]
  pipe2:
    args: ["out_ptr:8", "i32"]
    names: ["flags"]

  # time_t time(time_t *tloc) — scalar out-param → out_ptr:8; the value
  # is also the return, so TimeResult carries both.
  time:
    args: ["out_ptr:8"]

  # ssize_t sendmsg(int fd, const struct msghdr *msg, int flags)
  # in_struct builds msghdr from a Handl record: `bytes` fields embed a
  # pointer to the arg's bytes, `iov` builds an iovec array from a
  # List<Bytes>, and absent `*len` scalars auto-fill (namelen = addr
  # length, iovlen = element count, controllen = control length).
  sendmsg:
    args:
      [
        "i32",
        "in_struct:{msg_name:bytes,msg_namelen:u32,msg_iov:iov,msg_iovlen:u64,msg_control:bytes,msg_controllen:u64,msg_flags:i32}",
        "i32",
      ]
    names: ["fd", "msg", "flags"]

  # ssize_t recvmsg(int fd, struct msghdr *msg, int flags)
  # io_struct allocates everything callee-side: buf:N fields read back as
  # Bytes trimmed by the following *len scalar, iovbuf:K:M becomes K
  # buffers of M bytes read back as List<Bytes> trimmed by ret.
  recvmsg:
    args:
      [
        "i32",
        "io_struct:{msg_name:buf:128,msg_namelen:u32,msg_iov:iovbuf:8:65536,msg_iovlen:u64,msg_control:buf:256,msg_controllen:u64,msg_flags:i32}",
        "i32",
      ]
    names: ["fd", "flags"]

  # mmsghdr arrays aren't expressible (array of structs with embedded
  # msghdr), and recvmmsg's timespec* out-param would wrongly drop the
  # message-count return — skip rather than misgenerate.
  sendmmsg:
    skip: true
  recvmmsg:
    skip: true

  # int inet_pton(int af, const char *src, void *dst)
  # dst is a 4- or 16-byte out-buffer — `out_ptr` (full buffer): the
  # return is a 0/1 status, not a byte count, so `out_buf`'s ByRet
  # trim would cut buf to 1 byte.
  inet_pton:
    args: ["i32", "cstr", "out_ptr:16"]

  # const char *inet_ntop(int af, const void *src, char *dst, socklen_t n)
  # src is the packed address as a 16-byte in_buf; dst is out_buf:64.
  # The visible return is the buffer (NUL-terminated text inside) — the
  # emitter unwraps { ret, buf } → buf, so the port reports Bytes.
  inet_ntop:
    args: ["i32", "in_buf", "out_buf:64", "i32"]

  # int epoll_ctl(int epfd, int op, int fd, struct epoll_event *event)
  # glibc's epoll_event is packed — { u32 events; epoll_data_t data; } is
  # 12 bytes on x86_64 with data at offset 4 (no natural-alignment pad),
  # so the field offsets are spelled out explicitly. `data` flattens the
  # epoll_data union to its widest member: u64 covers ptr/fd/u32/u64 —
  # callers normally put the watched fd in it. `op` is renamed
  # `operation` — bare `op` is a grammar keyword and won't parse.
  epoll_ctl:
    args: ["i32", "i32", "i32", "in_struct:{events:u32@0,data:u64@4}"]
    names: ["epfd", "operation", "fd", "event"]

  # int epoll_wait(int epfd, struct epoll_event *events, int maxevents,
  #                int timeout)
  # events is an out-array of packed 12-byte records and the vocabulary
  # has no struct-array out-param, so out_ptr:384 hands back raw bytes
  # for 32 events; handl decodes each {events:u32,data:u64} record
  # itself (mirroring the recvmsg read-back split). Callers must keep
  # maxevents <= 32 — the allocated span — while `ret` is the event
  # count, so EpollWaitResult stays the full { ret, buf, outs } record.
  epoll_wait:
    args: ["i32", "out_ptr:384", "i32", "i32"]
    names: ["epfd", "maxevents", "timeout"]

  # int fcntl(int fd, int cmd, ...) — variadic like syscall; bound for
  # the int-arg shapes an epoll server uses (F_GETFL/F_SETFL with
  # O_NONBLOCK, F_GETFD/F_SETFD with FD_CLOEXEC). Other cmd forms
  # (F_SETLK's struct flock *, F_NOTIFY, ...) would need their own
  # arg lists — the variadic tail is per-call-site.
  fcntl:
    args: ["i32", "i32", "i32"]
    names: ["fd", "cmd", "arg"]

  # int bind/connect(int fd, const struct sockaddr *addr, socklen_t len)
  # __CONST_SOCKADDR_ARG is a transparent union the backend can't map,
  # so in_buf passes handl-packed sockaddr bytes as (ptr, len) — the two
  # slots it expands to are exactly (addr, addrlen).
  bind:
    args: ["i32", "in_buf"]
    names: ["fd"]
  connect:
    args: ["i32", "in_buf"]
    names: ["fd"]

  # int getsockopt(int fd, int level, int optname, void *optval,
  #                socklen_t *optlen)
  # io_buf is the (optval, optlen) value-result pair: allocates the
  # buffer plus a len cell seeded with 16 and passes (ptr, &len).
  # Needed for the SO_ERROR check after a nonblocking connect.
  getsockopt:
    args: ["i32", "i32", "i32", "io_buf:16"]
    names: ["fd", "level", "optname"]
