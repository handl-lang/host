category:
  slug: lib-ws-rfc
  title: WebSocket (RFC 6455)
module:
  name: ws_rfc
  title: Websocket Rfc
functions:
  client:
    description: Create a new RFC 6455 WebSocket client.
    details: "`ws_rfc.client()` returns a client object with `client_id`.

      "
    signature: ws_rfc.client() -> object
    params: []
    return_value: object
    examples:
      - let s = ws_rfc.client()
    see: []
  connect:
    description: Connect a client to a URL.
    details: "`ws_rfc.connect(client, url)` sets the client URL and marks it connected.

      `client` is the object returned by `ws_rfc.client()`.

      "
    signature: "ws_rfc.connect(client: object, url: string) -> null"
    params:
      - name: client
        type: object
        description: the client object
      - name: url
        type: string
        description: the WebSocket URL to connect to
    return_value: null
    examples:
      - ws_rfc.connect(s, "wss://echo.websocket.org/")
    see: []
  send:
    description: Send a message from a client.
    details: "`ws_rfc.send(client, msg)` queues a message on the client.

      `msg` may be a string or an object with `text` or `binary` keys.

      "
    signature: "ws_rfc.send(client: object, msg: any) -> null"
    params:
      - name: client
        type: object
        description: the client object
      - name: msg
        type: any
        description: the message to send
    return_value: null
    examples:
      - ws_rfc.send(s, "hello")
      - 'ws_rfc.send(s, { text: "hello" })'
    see: []
  recv:
    description: Receive a message from a client.
    details: "`ws_rfc.recv(client)` returns the next queued message, or `null` if
      none.

      "
    signature: "ws_rfc.recv(client: object) -> any"
    params:
      - name: client
        type: object
        description: the client object
    return_value: any
    examples:
      - ws_rfc.recv(s)
    see: []
  close:
    description: Close a client connection.
    details: "`ws_rfc.close(client)` removes the client.

      "
    signature: "ws_rfc.close(client: object) -> null"
    params:
      - name: client
        type: object
        description: the client object
    return_value: null
    examples:
      - ws_rfc.close(s)
    see: []
  server:
    description: Create a new RFC 6455 WebSocket server.
    details: "`ws_rfc.server()` returns a server object with `server_id`.

      "
    signature: ws_rfc.server() -> object
    params: []
    return_value: object
    examples:
      - let srv = ws_rfc.server()
    see: []
  listen:
    description: Start listening on an address.
    details: "`ws_rfc.listen(server, addr, handler)` registers an address and handler

      for the server.

      "
    signature: "ws_rfc.listen(server: object, addr: string, handler: any) -> null"
    params:
      - name: server
        type: object
        description: the server object
      - name: addr
        type: string
        description: the address to listen on
      - name: handler
        type: any
        description: the connection handler
    return_value: null
    examples:
      - ws_rfc.listen(srv, "ws://0.0.0.0:9001", fn (conn, msg) -> msg)
    see: []
  stop:
    description: Stop a server.
    details: "`ws_rfc.stop(server)` removes the server and unregisters its address.

      "
    signature: "ws_rfc.stop(server: object) -> null"
    params:
      - name: server
        type: object
        description: the server object
    return_value: null
    examples:
      - ws_rfc.stop(srv)
    see: []
