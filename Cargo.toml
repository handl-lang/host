[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = "1"
serde_json = "1"
rand = "0.9"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
indexmap = "2"
rayon = "1"
sha2 = "0.10"
thiserror = "2"
flate2 = "1"
tar = "0.4"
pass-lang = "1"
driver-lang = "1"
libloading = "0.8"
chrono = { version = "0.4", features = ["serde"] }
cranelift = { version = "0.115", features = ["frontend", "native"] }
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-object = "0.115"

