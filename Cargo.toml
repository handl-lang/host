[package]
name = "handl"
version = "0.1.0"
edition = "2024"
description = "`handl` is the root facade for the Handl language platform."
license.workspace = true
repository.workspace = true

[workspace]
members = [
  "crates/pkg-vendor",
  "crates/bench",
  "crates/ext-tests",
  "crates/platform-tests",
  "crates/plugin-ext-detect",
  "crates/plugin-ext-diag",
  "crates/plugin-ext-compile",
  "crates/plugin-ext-eval",
  "crates/plugin-ext-fmt",
  "crates/plugin-ext-kit",
  "crates/plugin-ext-lint",
  "crates/plugin-ext-plugin",
  "crates/plugin-ext-refinement",
  "crates/plugin-ext-test",
  "crates/plugin-ext-typecheck",
  "crates/plugin-load",
  "crates/plugin-loader-native",
  "crates/plugin-loader-native/tests/fixtures/native-echo",
  "crates/plugin-lib-handl",

  "crates/plugin-lib-scheduler",
  "crates/plugin-lib-tag",
    "crates/plugin-lib-stdlib",
  "crates/plugin-applier",
  "crates/platform",
  "crates/plugin-exec-cache",
  "crates/plugin-module",
  "crates/host-tooling",
  "crates/handl-test-utils",
  "crates/handl-kit-arrow-lower",
  "crates/plugin-compile",
  "crates/handl-runtime",
  "crates/handl-kit-data",
  "crates/plugin-sdkgen",
  "crates/plugin-ext-sdkgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/handl-lang/host"
[workspace.dependencies]
serde = "1"
serde_json = "1"
rand = "0.9"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
indexmap = "2"
rayon = "1"
sha2 = "0.10"
thiserror = "2"
tar = "0.4"
pass-lang = "1"
driver-lang = "1"
libloading = "0.8"
chrono = { version = "0.4", features = ["serde"] }
cranelift = { version = "0.115", features = ["frontend", "native"] }
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-object = "0.115"
serde_yaml = "0.9"
toml = "0.8"
glob = "0.3"
heck = "0.5"
target-lexicon = "0.12"

handl-plugin-ext-detect = { path = "crates/plugin-ext-detect" }
handl-plugin-ext-diag = { path = "crates/plugin-ext-diag" }
handl-plugin-ext-compile = { path = "crates/plugin-ext-compile" }
handl-plugin-ext-eval = { path = "crates/plugin-ext-eval" }
handl-plugin-ext-fmt = { path = "crates/plugin-ext-fmt" }
handl-plugin-applier = { path = "crates/plugin-applier" }
handl-plugin-ext-kit = { path = "crates/plugin-ext-kit" }
handl-plugin-ext-lint = { path = "crates/plugin-ext-lint" }
handl-plugin-ext-plugin = { path = "crates/plugin-ext-plugin" }
handl-plugin-ext-refinement = { path = "crates/plugin-ext-refinement" }
handl-plugin-ext-test = { path = "crates/plugin-ext-test" }
handl-plugin-ext-typecheck = { path = "crates/plugin-ext-typecheck" }
# ADR-0128 Phase 11: `handl-kit-prelude` lives in the `kit-prelude`
# repo, `handl-kit-data-prelude` in `lang`; local development resolves
# them from the sibling checkouts via the `[patch]` tables below.
handl-kit-prelude = { git = "https://github.com/handl-lang/kit-prelude", branch = "main" }
# ADR-0128 Phase 3: the stdlib crates live in the `stdlib` repo; local
# development resolves them from the sibling checkout via `[patch]` below.
handl-plugin-lib-stdlib = { path = "crates/plugin-lib-stdlib" }
# ADR-0128 §"1a": the `.hnl` sources of `str-handl` live in its own
# repo; that crate exports the sources as consts so this workspace can
# include them without owning the files.
handl-lib-str-handl = { git = "https://github.com/handl-lang/lib-str-handl", branch = "main" }
handl-lib-loader = { git = "https://github.com/handl-lang/lib-loader", branch = "main" }
handl-lib-desugar = { git = "https://github.com/handl-lang/lib-desugar", branch = "main" }
handl-lib-tag = { git = "https://github.com/handl-lang/lib-tag", branch = "main" }
handl-lib-collections = { git = "https://github.com/handl-lang/lib-collections", branch = "main" }
handl-plugin-load = { path = "crates/plugin-load" }
handl-plugin-loader-native = { path = "crates/plugin-loader-native" }
handl-lib-encoding = { git = "https://github.com/handl-lang/lib-encoding", branch = "main" }

handl-plugin-lib-handl = { path = "crates/plugin-lib-handl" }
handl-plugin-lib-kv = { git = "https://github.com/handl-lang/lib-kv", branch = "main" }
handl-plugin-lib-kv-hashmap = { git = "https://github.com/handl-lang/lib-kv-hashmap", branch = "main" }
# ADR-0128 Phase 4: the otlp modules live in the `otlp` repo; local
# development resolves them from the sibling checkout via `[patch]` below.
handl-plugin-lib-otlp-std = { git = "https://github.com/handl-lang/lib-otlp-std", branch = "main" }
handl-plugin-lib-parse = { git = "https://github.com/handl-lang/host", branch = "main" }

handl-plugin-applier-bootstrap = { path = "crates/plugin-applier-bootstrap" }
handl-plugin-applier-default = { path = "crates/plugin-applier-default" }
handl-plugin-lib-serialize = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-scheduler = { path = "crates/plugin-lib-scheduler" }
handl-plugin-lib-tag = { path = "crates/plugin-lib-tag" }
handl-platform = { path = "crates/platform" }
handl-plugin-exec-cache = { path = "crates/plugin-exec-cache" }
handl-plugin-module = { path = "crates/plugin-module" }
handl-host-tooling = { path = "crates/host-tooling" }
# ADR-0040/0128: the arrow-calculus kernel (`hnl-engine`,
# `handl-language`, `handl-value`) lives in the `kernel` repo; local
# development resolves it from the sibling checkout via `[patch]` below.
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-arrow-lower = { path = "crates/handl-kit-arrow-lower" }
handl-plugin-compile = { path = "crates/plugin-compile" }
# ADR-0128 Phase 5: the js compiler + webidl backend live in the `web`
# repo; local development resolves them from the sibling checkout via
# `[patch]` below.
handl-plugin-compile-js = { git = "https://github.com/handl-lang/compile-js", branch = "main" }
# ADR-0128 Phase 6: the native engines/compilers live in the native
# repo; local development resolves them from the sibling checkout.
handl-plugin-compile-llvm = { git = "https://github.com/handl-lang/compile-llvm", branch = "main" }
handl-plugin-compile-handl = { git = "https://github.com/handl-lang/compile-handl", branch = "main" }
handl-plugin-compile-term = { git = "https://github.com/handl-lang/compile-term", branch = "main" }
handl-plugin-compile-dot = { git = "https://github.com/handl-lang/compile-dot", branch = "main" }
handl-plugin-compile-sexp = { git = "https://github.com/handl-lang/compile-sexp", branch = "main" }
handl-test-utils = { path = "crates/handl-test-utils" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-engine-lex = { git = "https://github.com/handl-lang/engine-lex", branch = "main" }
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse = { git = "https://github.com/handl-lang/engine-parse", branch = "main" }
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
hnl-engine-typecheck = { git = "https://github.com/handl-lang/engine-typecheck", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }
hnl-engine-test = { git = "https://github.com/handl-lang/engine-test", branch = "main" }
hnl-engine-exec-bytecode = { git = "https://github.com/handl-lang/engine-exec-bytecode", branch = "main" }
hnl-engine-exec-cranelift = { git = "https://github.com/handl-lang/engine-exec-cranelift", branch = "main" }
hnl-engine-fmt = { git = "https://github.com/handl-lang/engine-fmt", branch = "main" }
hnl-engine-lint = { git = "https://github.com/handl-lang/engine-lint", branch = "main" }
hnl-engine-transform = { git = "https://github.com/handl-lang/engine-transform", branch = "main" }
hnl-engine-transform-rewrite = { git = "https://github.com/handl-lang/engine-transform-rewrite", branch = "main" }
handl-runtime = { path = "crates/handl-runtime" }
handl-kit-data = { path = "crates/handl-kit-data" }
handl-kit-data-prelude = { git = "https://github.com/handl-lang/kit-data-prelude", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-sdkgen = { path = "crates/plugin-sdkgen" }
handl-plugin-ext-sdkgen = { path = "crates/plugin-ext-sdkgen" }

handl-plugin-lib-char-native = { git = "https://github.com/handl-lang/lib-char-native", branch = "main" }
handl-plugin-lib-crypto = { git = "https://github.com/handl-lang/lib-crypto", branch = "main" }
handl-plugin-lib-lang-compile = { git = "https://github.com/handl-lang/lib-lang-compile", branch = "main" }
handl-plugin-lib-lang-eval = { git = "https://github.com/handl-lang/lib-lang-eval", branch = "main" }
handl-plugin-lib-lang-lex = { git = "https://github.com/handl-lang/lib-lang-lex", branch = "main" }
handl-plugin-lib-lang-parse = { git = "https://github.com/handl-lang/lib-lang-parse", branch = "main" }
handl-plugin-lib-lang-run-compiled = { git = "https://github.com/handl-lang/lib-lang-run-compiled", branch = "main" }
handl-plugin-lib-lang-typecheck = { git = "https://github.com/handl-lang/lib-lang-typecheck", branch = "main" }
[features]
default = []

[dependencies.handl-platform]
workspace = true

[dev-dependencies]
serde_json = "1"

# ADR-0128 §Resolution — local development resolves the extracted repos
# from sibling checkouts; without the checkouts (or this block), the git
# sources are used. A git source must still resolve — before the remotes
# exist, point them at the local clones, e.g.:
#
#   CARGO_NET_GIT_FETCH_WITH_CLI=true \
#   GIT_CONFIG_COUNT=2 \
#   GIT_CONFIG_KEY_0="url.file:///home/luis/GitHub/handl-lang/kit-data-prelude.insteadOf" \
#   GIT_CONFIG_VALUE_0="https://github.com/handl-lang/kit-data-prelude" \
#   GIT_CONFIG_KEY_1="url.file:///home/luis/GitHub/handl-lang/kit-prelude.insteadOf" \
#   GIT_CONFIG_VALUE_1="https://github.com/handl-lang/kit-prelude" \
#   cargo check --workspace
