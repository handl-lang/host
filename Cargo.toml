[features]
default = []

[dependencies.handl-platform]
workspace = true

[dev-dependencies]
serde_json = "1"

# ADR-0128 §Resolution — local development resolves the extracted repos
# from sibling checkouts; without the checkouts (or this block), the git
# sources are used. A git source must still resolve — before the remotes
# exist, point them at the local clones, e.g.:
#
#   CARGO_NET_GIT_FETCH_WITH_CLI=true \
#   GIT_CONFIG_COUNT=2 \
#   GIT_CONFIG_KEY_0="url.file:///home/luis/GitHub/handl-lang/lang.insteadOf" \
#   GIT_CONFIG_VALUE_0="https://github.com/handl-lang/lang" \
#   GIT_CONFIG_KEY_1="url.file:///home/luis/GitHub/handl-lang/kit-canonical.insteadOf" \
#   GIT_CONFIG_VALUE_1="https://github.com/handl-lang/kit-canonical" \
#   cargo check --workspace
[patch."https://github.com/handl-lang/lang"]
handl-kit-data-canonical = { path = "../lang/crates/handl-kit-data-canonical" }

[patch."https://github.com/handl-lang/kit-canonical"]
handl-kit-canonical = { path = "../kit-canonical/crates/kit-canonical" }

# The moved crates' manifests dep on platform crates over the platform git
# source; unify them with the in-tree copies so this workspace never builds
# a platform crate twice (a path `handl-runtime` and a git `handl-runtime`
# would be distinct, incompatible packages).
[patch."https://github.com/handl-lang/stdlib"]
handl-plugin-lib-stdlib = { path = "../stdlib/crates/plugin-lib-stdlib" }
handl-plugin-lib-kv = { path = "../stdlib/modules/kv" }
handl-plugin-lib-kv-hashmap = { path = "../stdlib/modules/kv-hashmap" }
handl-plugin-lib-crypto = { path = "../stdlib/modules/crypto" }
handl-plugin-lib-encoding = { path = "../stdlib/modules/encoding" }
handl-plugin-lib-parse = { path = "../stdlib/modules/parse" }
handl-plugin-lib-serialize = { path = "../stdlib/modules/serialize" }
handl-plugin-lib-char-native = { path = "../stdlib/modules/char-native" }
handl-plugin-lib-lang-lex = { path = "../stdlib/modules/lib-lang-lex" }
handl-plugin-lib-lang-parse = { path = "../stdlib/modules/lib-lang-parse" }
handl-plugin-lib-lang-eval = { path = "../stdlib/modules/lib-lang-eval" }
handl-plugin-lib-lang-typecheck = { path = "../stdlib/modules/lib-lang-typecheck" }
handl-plugin-lib-lang-compile = { path = "../stdlib/modules/lib-lang-compile" }
handl-plugin-lib-lang-run-compiled = { path = "../stdlib/modules/lib-lang-run-compiled" }

[patch."https://github.com/handl-lang/platform"]
handl-emitters = { path = "crates/handl-emitters" }
handl-kit-data = { path = "crates/handl-kit-data" }
handl-language = { path = "crates/handl-language" }
handl-platform = { path = "crates/platform" }
handl-plugin-engine-exec = { path = "crates/plugin-engine-exec" }
handl-plugin-engine-exec-bytecode = { path = "crates/plugin-engine-exec-bytecode" }
handl-plugin-engine-exec-cranelift = { path = "crates/plugin-engine-exec-cranelift" }
handl-plugin-engine-exec-tree-walk = { path = "crates/plugin-engine-exec-tree-walk" }
handl-plugin-engine-lex-pattern = { path = "crates/plugin-engine-lex-pattern" }
handl-plugin-engine-parse = { path = "crates/plugin-engine-parse" }
handl-plugin-engine-parse-pratt = { path = "crates/plugin-engine-parse-pratt" }
handl-plugin-engine-transform = { path = "crates/plugin-engine-transform" }
handl-plugin-engine-transform-rewrite = { path = "crates/plugin-engine-transform-rewrite" }
handl-plugin-engine-typecheck = { path = "crates/plugin-engine-typecheck" }
handl-plugin-engine-typecheck-handl = { path = "crates/plugin-engine-typecheck-handl" }
handl-plugin-ext-diag = { path = "crates/plugin-ext-diag" }
handl-plugin-ffi = { path = "crates/plugin-ffi" }


handl-plugin-lib-handl = { path = "crates/plugin-lib-handl" }






handl-plugin-lib-tag = { path = "crates/plugin-lib-tag" }
handl-plugin-module = { path = "crates/plugin-module" }
handl-runtime = { path = "crates/handl-runtime" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
debug = 1 # line tables only (default is 2 = full debug info)
split-debuginfo = "unpacked" # faster linking on Linux
