handl-plugin-lib-lang-eval = { git = "https://github.com/handl-lang/stdlib", rev = "a4a357f8a9b462e3bb0d70bbdc8189a300a5b0f1" }
handl-plugin-lib-lang-lex = { git = "https://github.com/handl-lang/stdlib", rev = "a4a357f8a9b462e3bb0d70bbdc8189a300a5b0f1" }
handl-plugin-lib-lang-parse = { git = "https://github.com/handl-lang/stdlib", rev = "a4a357f8a9b462e3bb0d70bbdc8189a300a5b0f1" }
handl-plugin-lib-lang-run-compiled = { git = "https://github.com/handl-lang/stdlib", rev = "a4a357f8a9b462e3bb0d70bbdc8189a300a5b0f1" }
handl-plugin-lib-lang-typecheck = { git = "https://github.com/handl-lang/stdlib", rev = "a4a357f8a9b462e3bb0d70bbdc8189a300a5b0f1" }
[features]
default = []

[dependencies.handl-platform]
workspace = true

[dev-dependencies]
serde_json = "1"

# ADR-0128 §Resolution — local development resolves the extracted repos
# from sibling checkouts; without the checkouts (or this block), the git
# sources are used. A git source must still resolve — before the remotes
# exist, point them at the local clones, e.g.:
#
#   CARGO_NET_GIT_FETCH_WITH_CLI=true \
#   GIT_CONFIG_COUNT=2 \
#   GIT_CONFIG_KEY_0="url.file:///home/luis/GitHub/handl-lang/lang.insteadOf" \
#   GIT_CONFIG_VALUE_0="https://github.com/handl-lang/lang" \
#   GIT_CONFIG_KEY_1="url.file:///home/luis/GitHub/handl-lang/kit-canonical.insteadOf" \
#   GIT_CONFIG_VALUE_1="https://github.com/handl-lang/kit-canonical" \
#   cargo check --workspace
# dev-link: begin
[patch."https://github.com/handl-lang/c"]
handl-plugin-sdkgen-backend-c = { path = "../c/modules/sdkgen-c" }
[patch."https://github.com/handl-lang/dot"]
handl-plugin-compile-dot = { path = "../dot/modules/compile-dot" }
[patch."https://github.com/handl-lang/ffi"]
handl-plugin-ffi = { path = "../ffi/modules/ffi" }
[patch."https://github.com/handl-lang/handl"]
