[package]
name = "handl-plugin-lib-stdlib"
version.workspace = true
edition.workspace = true
description = "The handl-backed standard library, consolidated per the \"library-as-data\" architecture: every `plugin-lib-*` shell crate is replaced by a row in [`packages::PACKAGES`] / ..."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-module = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-lib-encoding = { git = "https://github.com/handl-lang/lib-encoding", branch = "main" }
# Shared op helpers (throwaway — see the lib-ops README).
handl-lib-ops = { git = "https://github.com/handl-lang/lib-ops", branch = "main" }
# ADR-0128: port packages live in their own repos.
handl-lib-base64 = { git = "https://github.com/handl-lang/lib-base64", branch = "main" }
handl-lib-hex = { git = "https://github.com/handl-lang/lib-hex", branch = "main" }
handl-lib-prim = { git = "https://github.com/handl-lang/lib-prim", branch = "main" }
handl-lib-prim-handl = { git = "https://github.com/handl-lang/lib-prim-handl", branch = "main" }
handl-lib-hello = { git = "https://github.com/handl-lang/lib-hello", branch = "main" }
handl-lib-type = { git = "https://github.com/handl-lang/lib-type", branch = "main" }
handl-lib-arrow-iter = { git = "https://github.com/handl-lang/lib-arrow-iter", branch = "main" }
handl-lib-stats = { git = "https://github.com/handl-lang/lib-stats", branch = "main" }
handl-lib-combinators = { git = "https://github.com/handl-lang/lib-combinators", branch = "main" }
handl-lib-mood = { git = "https://github.com/handl-lang/lib-mood", branch = "main" }
handl-lib-tar = { git = "https://github.com/handl-lang/lib-tar", branch = "main" }
handl-lib-obj = { git = "https://github.com/handl-lang/lib-obj", branch = "main" }
handl-lib-error = { git = "https://github.com/handl-lang/lib-error", branch = "main" }
handl-lib-cmp = { git = "https://github.com/handl-lang/lib-cmp", branch = "main" }
handl-lib-bytes = { git = "https://github.com/handl-lang/lib-bytes", branch = "main" }
handl-plugin-lib-parse = { path = "../../modules/parse" }
handl-plugin-lib-serialize = { path = "../../modules/serialize" }
base64 = "0.22"
tar = "0.4"
hex = "0.4"
iri-string = "=0.7.12"
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
url = "2"

[dev-dependencies]
handl-kit-data-canonical = { git = "https://github.com/handl-lang/lang", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-exec-tree-walk = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-lib-tag = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-lib-parse = { path = "../../modules/parse" }
handl-plugin-lib-serialize = { path = "../../modules/serialize" }
plugin-engine = { git = "https://github.com/handl-lang/platform", branch = "main" }
serde_json = "1"
