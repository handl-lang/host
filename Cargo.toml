handl-plugin-load = { path = "../host/crates/plugin-load" }
handl-plugin-loader-native = { path = "../host/crates/plugin-loader-native" }
handl-plugin-module = { path = "../host/crates/plugin-module" }
handl-run = { path = "../host/crates/run" }
# PL-004 Phase 1/T-076: `handl-plugin-codegen` (renamed from
# plugin-sdkgen) and `handl-plugin-ext-codegen` (renamed from
# plugin-ext-sdkgen) are workspace members now. `handl-plugin-sdkgen`
