[package]
name = "handl"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/ast",
    "crates/ast-common",
    "crates/source",
    "crates/typecheck-core",
    "crates/vm-type",
    "crates/lexer",
    "crates/lexer-common",
    "crates/parser",
    "crates/parser-common",
    "crates/kit-canonical",
    "crates/lib-hello",
    "crates/lib-archive",
    "crates/lib-compress",
    "crates/lib-encoding",
    "crates/lib-parse",
    "crates/lib-serialize",
    "crates/target-native",
    "crates/platform",
    "crates/ext-fmt",
    "crates/ext-lint",
    "crates/ext-lexer",
    "crates/ext-parser",
    "crates/ext-typecheck",
    "crates/ext-eval",
    "crates/ext-build",
    "crates/ext-compile",
    "crates/ext-kit",
    "crates/ext-plugin",
    "crates/ext-cli",
    "crates/ext-lsp",
    "crates/host-cli",
    "crates/host-lsp",
    "crates/plugin-comments",
    "crates/plugin-doc-comments",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = "1"
serde_json = "1"
rand = "0.9"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
indexmap = "2"
rayon = "1"
sha2 = "0.10"
thiserror = "2"
flate2 = "1"
tar = "0.4"
pass-lang = "1"
driver-lang = "1"
libloading = "0.8"

