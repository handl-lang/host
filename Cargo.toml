[package]
name = "handl"
version = "0.1.0"
edition = "2024"
description = "`handl` is the root facade for the Handl language platform."
license.workspace = true
repository.workspace = true

[workspace]
members = [
  "crates/bench",
  "crates/ext-tests",
  "crates/platform-tests",
  "crates/plugin-ext-diag",
  "crates/plugin-ext-compile",
  "crates/plugin-ext-eval",
  "crates/plugin-ext-fmt",
  "crates/plugin-ext-kit",
  "crates/plugin-ext-lint",
  "crates/plugin-ext-plugin",
  "crates/plugin-ext-refinement",
  "crates/plugin-ext-test",
  "crates/plugin-ext-typecheck",
  "crates/plugin-load",
  "crates/plugin-loader-native",
  "crates/plugin-loader-native/tests/fixtures/native-echo",
  "crates/plugin-lib-handl",


  "crates/plugin-lib-scheduler",
  "crates/plugin-lib-tag",
  "crates/plugin-applier",
  "crates/platform",
  "crates/plugin-exec-cache",
  "crates/plugin-module",
  "crates/host-tooling",
  "crates/handl-test-utils",
  "crates/handl-kit-arrow-lower",
  "crates/plugin-engine-lex",
  "crates/plugin-engine-lex-pattern",
  "crates/plugin-engine-parse",
  "crates/plugin-engine-exec",
  "crates/plugin-engine-typecheck",
  "crates/plugin-engine-typecheck-handl",
  "crates/plugin-engine-parse-pratt",
  "crates/plugin-engine-exec-tree-walk",
  "crates/plugin-engine-test",
  "crates/plugin-engine-transform",
  "crates/plugin-engine-transform-rewrite",
  "crates/plugin-engine-exec-bytecode",
  "crates/plugin-engine-fmt",
  "crates/plugin-engine-lint",
  "crates/plugin-compile",
  "crates/handl-runtime",
  "crates/handl-kit-data",
  "crates/plugin-sdkgen",
  "crates/plugin-sdkgen-emitter-file",
  "crates/plugin-ext-sdkgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/platform"
[workspace.dependencies]
serde = "1"
serde_json = "1"
rand = "0.9"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
indexmap = "2"
rayon = "1"
sha2 = "0.10"
thiserror = "2"
tar = "0.4"
pass-lang = "1"
driver-lang = "1"
libloading = "0.8"
chrono = { version = "0.4", features = ["serde"] }
cranelift = { version = "0.115", features = ["frontend", "native"] }
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-object = "0.115"
serde_yaml = "0.9"
toml = "0.8"
glob = "0.3"
heck = "0.5"
target-lexicon = "0.12"

handl-plugin-ext-diag = { path = "crates/plugin-ext-diag" }
handl-plugin-ext-compile = { path = "crates/plugin-ext-compile" }
handl-plugin-ext-eval = { path = "crates/plugin-ext-eval" }
handl-plugin-ext-fmt = { path = "crates/plugin-ext-fmt" }
handl-plugin-applier = { path = "crates/plugin-applier" }
handl-plugin-ext-kit = { path = "crates/plugin-ext-kit" }
handl-plugin-ext-lint = { path = "crates/plugin-ext-lint" }
handl-plugin-ext-plugin = { path = "crates/plugin-ext-plugin" }
handl-plugin-ext-refinement = { path = "crates/plugin-ext-refinement" }
handl-plugin-ext-test = { path = "crates/plugin-ext-test" }
handl-plugin-ext-typecheck = { path = "crates/plugin-ext-typecheck" }
# ADR-0128 Phase 11: `handl-kit-canonical` lives in the `kit-canonical`
# repo, `handl-kit-data-canonical` in `lang`; local development resolves
# them from the sibling checkouts via the `[patch]` tables below.
handl-kit-canonical = { git = "https://github.com/handl-lang/kit-canonical", branch = "main" }
# ADR-0128 Phase 3: the stdlib crates live in the `stdlib` repo; local
# development resolves them from the sibling checkout via `[patch]` below.
handl-plugin-lib-stdlib = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
# ADR-0128 §"1a": the `.hnl` sources of `str-handl` and `dedent` live in their
# own repos; those crates export the sources as consts so this workspace can
# include them without owning the files.
handl-lib-str-handl = { git = "https://github.com/handl-lang/lib-str-handl", branch = "main" }
handl-lib-dedent = { git = "https://github.com/handl-lang/lib-dedent", branch = "main" }
handl-plugin-load = { path = "crates/plugin-load" }
handl-plugin-loader-native = { path = "crates/plugin-loader-native" }
handl-lib-encoding = { git = "https://github.com/handl-lang/lib-encoding", branch = "main" }

handl-plugin-lib-handl = { path = "crates/plugin-lib-handl" }
handl-plugin-lib-kv = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-kv-hashmap = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
# ADR-0128 Phase 4: the otlp modules live in the `otlp` repo; local
# development resolves them from the sibling checkout via `[patch]` below.
handl-plugin-lib-otlp-std = { git = "https://github.com/handl-lang/otlp", branch = "main" }
handl-plugin-lib-parse = { git = "https://github.com/handl-lang/stdlib", branch = "main" }

handl-plugin-applier-bootstrap = { path = "crates/plugin-applier-bootstrap" }
handl-plugin-applier-default = { path = "crates/plugin-applier-default" }
handl-plugin-lib-serialize = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-scheduler = { path = "crates/plugin-lib-scheduler" }
handl-plugin-lib-tag = { path = "crates/plugin-lib-tag" }
handl-platform = { path = "crates/platform" }
handl-plugin-exec-cache = { path = "crates/plugin-exec-cache" }
handl-plugin-module = { path = "crates/plugin-module" }
handl-host-tooling = { path = "crates/host-tooling" }
# ADR-0040/0128: the arrow-calculus kernel (`plugin-engine`,
# `handl-language`, `handl-value`) lives in the `kernel` repo; local
# development resolves it from the sibling checkout via `[patch]` below.
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-arrow-lower = { path = "crates/handl-kit-arrow-lower" }
handl-plugin-compile = { path = "crates/plugin-compile" }
# ADR-0128 Phase 5: the js compiler + webidl backend live in the `web`
# repo; local development resolves them from the sibling checkout via
# `[patch]` below.
handl-plugin-compile-js = { git = "https://github.com/handl-lang/web", branch = "main" }
# ADR-0128 Phase 6: the native engines/compilers live in the native
# repo; local development resolves them from the sibling checkout.
handl-plugin-compile-llvm = { git = "https://github.com/handl-lang/native", branch = "main" }
handl-plugin-compile-handl = { git = "https://github.com/handl-lang/handl", branch = "main" }
handl-plugin-compile-term = { git = "https://github.com/handl-lang/term", branch = "main" }
handl-plugin-compile-dot = { git = "https://github.com/handl-lang/dot", branch = "main" }
handl-plugin-compile-sexp = { git = "https://github.com/handl-lang/sexp", branch = "main" }
handl-test-utils = { path = "crates/handl-test-utils" }
plugin-engine = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-engine-lex = { path = "crates/plugin-engine-lex" }
handl-plugin-engine-lex-pattern = { path = "crates/plugin-engine-lex-pattern" }
handl-plugin-engine-parse = { path = "crates/plugin-engine-parse" }
handl-plugin-engine-exec = { path = "crates/plugin-engine-exec" }
handl-plugin-engine-typecheck = { path = "crates/plugin-engine-typecheck" }
handl-plugin-engine-typecheck-handl = { path = "crates/plugin-engine-typecheck-handl" }
handl-plugin-engine-parse-pratt = { path = "crates/plugin-engine-parse-pratt" }
handl-plugin-engine-exec-tree-walk = { path = "crates/plugin-engine-exec-tree-walk" }
handl-plugin-engine-test = { path = "crates/plugin-engine-test" }
handl-plugin-engine-exec-bytecode = { path = "crates/plugin-engine-exec-bytecode" }
handl-plugin-engine-exec-cranelift = { git = "https://github.com/handl-lang/native", branch = "main" }
handl-plugin-engine-fmt = { path = "crates/plugin-engine-fmt" }
handl-plugin-engine-lint = { path = "crates/plugin-engine-lint" }
handl-plugin-engine-transform = { path = "crates/plugin-engine-transform" }
handl-plugin-engine-transform-rewrite = { path = "crates/plugin-engine-transform-rewrite" }
handl-runtime = { path = "crates/handl-runtime" }
handl-kit-data = { path = "crates/handl-kit-data" }
handl-kit-data-canonical = { git = "https://github.com/handl-lang/lang", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-sdkgen = { path = "crates/plugin-sdkgen" }
handl-plugin-sdkgen-emitter-file = { path = "crates/plugin-sdkgen-emitter-file" }
handl-plugin-ext-sdkgen = { path = "crates/plugin-ext-sdkgen" }

handl-plugin-lib-char-native = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-crypto = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-lang-compile = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-lang-eval = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-lang-lex = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-lang-parse = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-lang-run-compiled = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
handl-plugin-lib-lang-typecheck = { git = "https://github.com/handl-lang/stdlib", branch = "main" }
[features]
default = []

[dependencies.handl-platform]
workspace = true

[dev-dependencies]
serde_json = "1"

# ADR-0128 §Resolution — local development resolves the extracted repos
# from sibling checkouts; without the checkouts (or this block), the git
# sources are used. A git source must still resolve — before the remotes
# exist, point them at the local clones, e.g.:
#
#   CARGO_NET_GIT_FETCH_WITH_CLI=true \
#   GIT_CONFIG_COUNT=2 \
#   GIT_CONFIG_KEY_0="url.file:///home/luis/GitHub/handl-lang/lang.insteadOf" \
#   GIT_CONFIG_VALUE_0="https://github.com/handl-lang/lang" \
#   GIT_CONFIG_KEY_1="url.file:///home/luis/GitHub/handl-lang/kit-canonical.insteadOf" \
#   GIT_CONFIG_VALUE_1="https://github.com/handl-lang/kit-canonical" \
#   cargo check --workspace
