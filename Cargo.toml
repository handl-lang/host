libloading = "0.8"

[features]
default = [
  "vm",
  "host",
  "lib-utils",
  "lib-datetime",
  "lib-intl",
  "lib-crypto",
  "lib-rand",
  "lib-test",
  "lib-kv",
  "lib-kv-hashmap",
  "lib-os",
  "lib-os-std",
  "lib-http-client",
  "lib-http-client-std",
  "lib-http-server",
  "lib-http-server-std",
  "lib-otlp",
  "lib-otlp-std",
  "lib-unicode",
  "lib-ip",
]

vm = ["handl-vm", "handl-vm-backend-rust-interpreter"]
host = ["dep:handl-vm-host-eval", "vm"]
lib-utils = ["dep:handl-lib-utils", "vm", "dep:handl-vm-common"]
lib-datetime = ["dep:handl-lib-datetime", "vm", "dep:handl-vm-common"]
lib-intl = ["dep:handl-lib-intl", "vm", "dep:handl-vm-common"]
lib-crypto = ["dep:handl-lib-crypto", "vm", "dep:handl-vm-common"]
lib-rand = ["dep:handl-lib-rand", "vm", "dep:handl-vm-common"]
lib-test = ["dep:handl-lib-test", "vm", "dep:handl-vm-common"]
lib-tls = ["dep:handl-lib-tls", "vm", "dep:handl-vm-common"]
lib-kv = ["dep:handl-lib-kv", "vm", "dep:handl-vm-common"]
lib-kv-hashmap = ["dep:handl-lib-kv-hashmap", "lib-kv"]
lib-os = ["dep:handl-lib-os", "vm", "dep:handl-vm-common"]
lib-os-std = ["dep:handl-lib-os-std", "lib-os"]
lib-http-client = ["dep:handl-lib-http-client", "vm", "dep:handl-vm-common"]
lib-http-client-std = ["dep:handl-lib-http-client-std", "lib-http-client"]
lib-http-server = ["dep:handl-lib-http-server", "vm", "dep:handl-vm-common"]
lib-http-server-std = ["dep:handl-lib-http-server-std", "lib-http-server"]
lib-otlp = ["dep:handl-lib-otlp", "vm", "dep:handl-vm-common"]
lib-otlp-std = ["dep:handl-lib-otlp-std", "lib-otlp"]
lib-unicode = ["dep:handl-lib-unicode", "vm", "dep:handl-vm-common"]
lib-ip = ["dep:handl-lib-ip"]
lib-url-rfc = ["dep:handl-lib-url-rfc"]
lib-url-whatwg = ["dep:handl-lib-url-whatwg"]

[dependencies]
handl-ast.workspace = true
handl-ast-canonical.workspace = true
handl-ast-common.workspace = true
handl-dialect.workspace = true
handl-vm-values-json.workspace = true
handl-source.workspace = true
handl-platform.workspace = true

handl-vm-common = { workspace = true, optional = true }
handl-vm = { workspace = true, optional = true }
handl-vm-backend-rust-interpreter = { workspace = true, optional = true }
handl-vm-host-eval = { workspace = true, optional = true }
handl-lib-utils = { workspace = true, optional = true }
handl-lib-datetime = { workspace = true, optional = true }
handl-lib-intl = { workspace = true, optional = true }
handl-lib-crypto = { workspace = true, optional = true }
handl-lib-rand = { workspace = true, optional = true }
handl-lib-test = { workspace = true, optional = true }
handl-lib-tls = { workspace = true, optional = true }
handl-lib-kv = { workspace = true, optional = true }
handl-lib-kv-hashmap = { workspace = true, optional = true }
handl-lib-os = { workspace = true, optional = true }
handl-lib-os-std = { workspace = true, optional = true }
handl-lib-http-client = { workspace = true, optional = true }
handl-lib-http-client-std = { workspace = true, optional = true }
handl-lib-http-server = { workspace = true, optional = true }
handl-lib-http-server-std = { workspace = true, optional = true }
handl-lib-otlp = { workspace = true, optional = true }
handl-lib-otlp-std = { workspace = true, optional = true }
handl-lib-unicode = { workspace = true, optional = true }
handl-lib-ip = { workspace = true, optional = true }
handl-lib-url-rfc = { workspace = true, optional = true }
handl-lib-url-whatwg = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[[example]]
name = "basic"
path = "examples/rust/basic/main.rs"

[[example]]
name = "functions"
path = "examples/rust/functions/main.rs"

[[example]]
name = "fields"
path = "examples/rust/fields/main.rs"

[[example]]
name = "handlers"
path = "examples/rust/handlers/main.rs"

[[example]]
