[features]
default = []

[dependencies.handl-plugin-source]
workspace = true

[dependencies.handl-platform]
workspace = true

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
debug = 1          # line tables only (default is 2 = full debug info)
split-debuginfo = "unpacked"  # faster linking on Linux
