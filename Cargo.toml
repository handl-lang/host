[package]
name = "handl-plugin-lib-stdlib"
version.workspace = true
edition.workspace = true
description = "The handl-backed standard library, consolidated per the \"library-as-data\" architecture: every `plugin-lib-*` shell crate is replaced by a row in [`packages::PACKAGES`] / ..."
license.workspace = true
repository.workspace = true

[dependencies]
handl-plugin-module = { git = "https://github.com/handl-lang/platform" }
handl-value = { git = "https://github.com/handl-lang/platform" }
handl-language = { git = "https://github.com/handl-lang/platform" }
handl-platform = { git = "https://github.com/handl-lang/platform" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/platform" }
handl-plugin-lib-encoding = { path = "../../modules/encoding" }
handl-plugin-lib-parse = { path = "../../modules/parse" }
handl-plugin-lib-serialize = { path = "../../modules/serialize" }
base64 = "0.22"
tar = "0.4"
hex = "0.4"
iri-string = "=0.7.12"
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
url = "2"

[dev-dependencies]
handl-kit-data-canonical = { git = "https://github.com/handl-lang/lang" }
handl-language = { git = "https://github.com/handl-lang/platform" }
handl-platform = { git = "https://github.com/handl-lang/platform" }
handl-plugin-engine-exec-tree-walk = { git = "https://github.com/handl-lang/platform" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/platform" }
handl-plugin-lib-tag = { git = "https://github.com/handl-lang/platform" }
handl-plugin-lib-parse = { path = "../../modules/parse" }
handl-plugin-lib-serialize = { path = "../../modules/serialize" }
plugin-engine = { git = "https://github.com/handl-lang/platform" }
serde_json = "1"
