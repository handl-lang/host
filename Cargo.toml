[package]
name = "handl"
version = "0.1.0"
edition = "2024"
description = "`handl` is the root facade for the Handl language platform."
license.workspace = true
repository.workspace = true

[workspace]
members = [
  "crates/pkg-vendor",
  "crates/bench",
  "crates/ext-tests",
  "crates/platform-tests",
  "crates/plugin-ext-detect",
  "crates/plugin-ext-diag",
  "crates/plugin-ext-compile",
  "crates/plugin-ext-eval",
  "crates/plugin-ext-fmt",
  "crates/plugin-ext-kit",
  "crates/plugin-ext-lint",
  "crates/plugin-ext-plugin",
  "crates/plugin-ext-refinement",
  "crates/plugin-ext-test",
  "crates/plugin-ext-typecheck",
  "crates/plugin-load",
  "crates/plugin-loader-native",
  "crates/plugin-loader-native/tests/fixtures/native-echo",
  "crates/plugin-lib-handl",

  "crates/plugin-lib-scheduler",
  "crates/plugin-lib-tag",
    "crates/plugin-lib-stdlib",
  "crates/plugin-applier",
  "crates/platform",
  "crates/plugin-exec-cache",
  "crates/plugin-module",
  "crates/host-tooling",
  "crates/handl-test-utils",
  "crates/handl-kit-arrow-lower",
  "crates/handl-kit-core",
  "crates/handl-kit-prelude-lang",
  "crates/handl-kit-data-prelude",
  "crates/handl-kit-stdlib",
  "crates/handl-kit-server",
  "crates/handl-kit-ffi",
  "crates/handl-kit-lang",
  "crates/kit-prelude",
  "crates/kit-mlopt",
  "crates/hnl-ext-mlopt",
  "crates/handl-kit-eqsat",
  "crates/plugin-ffi",
  "crates/plugin-compile",
  "crates/handl-runtime",
  "crates/handl-kit-data",
  "crates/plugin-codegen",
  "crates/plugin-ext-codegen",
  "crates/plugin-codemod",
  "crates/plugin-ext-codemod",
  "crates/run",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/handl-lang/host"
[workspace.dependencies]
serde = "1"
serde_json = "1"
rand = "0.9"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
indexmap = "2"
rayon = "1"
sha2 = "0.10"
thiserror = "2"
tar = "0.4"
pass-lang = "1"
driver-lang = "1"
libloading = "0.8"
chrono = { version = "0.4", features = ["serde"] }
cranelift = { version = "0.115", features = ["frontend", "native"] }
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-object = "0.115"
serde_yaml = "0.9"
toml = "0.8"
glob = "0.3"
heck = "0.5"
target-lexicon = "0.12"

handl-plugin-ext-detect = { path = "crates/plugin-ext-detect" }
handl-plugin-ext-diag = { path = "crates/plugin-ext-diag" }
handl-plugin-ext-compile = { path = "crates/plugin-ext-compile" }
handl-plugin-ext-eval = { path = "crates/plugin-ext-eval" }
handl-plugin-ext-fmt = { path = "crates/plugin-ext-fmt" }
handl-plugin-applier = { path = "crates/plugin-applier" }
handl-plugin-ext-kit = { path = "crates/plugin-ext-kit" }
handl-plugin-ext-lint = { path = "crates/plugin-ext-lint" }
handl-plugin-ext-plugin = { path = "crates/plugin-ext-plugin" }
handl-plugin-ext-refinement = { path = "crates/plugin-ext-refinement" }
handl-plugin-ext-test = { path = "crates/plugin-ext-test" }
handl-plugin-ext-typecheck = { path = "crates/plugin-ext-typecheck" }
# ADR-0128 Phase 11 / T-126 Phase D: `handl-kit-prelude` (+ `handl-kit-mlopt`,
# `hnl-ext-mlopt`) folded into this workspace from the `kit-prelude` repo.
# `handl-kit-data-prelude` and `handl-kit-prelude-lang` folded in at T-124
# Phase B.
handl-kit-prelude = { path = "crates/kit-prelude" }
handl-kit-mlopt = { path = "crates/kit-mlopt" }
hnl-ext-mlopt = { path = "crates/hnl-ext-mlopt" }
# T-126 Phase D: `handl-kit-eqsat` (the eqsat law/cost data corpus) folded
# in from the `kit-eqsat` repo.
handl-kit-eqsat = { path = "crates/handl-kit-eqsat" }
# ADR-0128 Phase 3: the stdlib crates live in the `stdlib` repo; local
# development resolves them from the sibling checkout via `[patch]` below.
handl-plugin-lib-stdlib = { path = "crates/plugin-lib-stdlib" }
handl-plugin-load = { path = "crates/plugin-load" }
handl-plugin-loader-native = { path = "crates/plugin-loader-native" }

handl-plugin-lib-handl = { path = "crates/plugin-lib-handl" }
handl-plugin-lib-kv-hashmap = { git = "https://github.com/handl-lang/lib-kv-hashmap", branch = "main" }
# ADR-0128 Phase 4: the otlp modules live in the `otlp` repo; local
# development resolves them from the sibling checkout via `[patch]` below.
handl-plugin-lib-otlp-std = { git = "https://github.com/handl-lang/lib-otlp-std", branch = "main" }

handl-plugin-applier-bootstrap = { path = "crates/plugin-applier-bootstrap" }
handl-plugin-applier-default = { path = "crates/plugin-applier-default" }
handl-plugin-lib-tag = { path = "crates/plugin-lib-tag" }
handl-platform = { path = "crates/platform" }
handl-plugin-exec-cache = { path = "crates/plugin-exec-cache" }
handl-plugin-module = { path = "crates/plugin-module" }
handl-host-tooling = { path = "crates/host-tooling" }
# ADR-0040/0128: the arrow-calculus kernel (`hnl-engine`,
# `handl-language`, `handl-value`) lives in the `kernel` repo; local
# development resolves it from the sibling checkout via `[patch]` below.
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-arrow-lower = { path = "crates/handl-kit-arrow-lower" }
handl-plugin-compile = { path = "crates/plugin-compile" }
# ADR-0128 Phase 5: the js compiler + webidl backend live in the `web`
# repo; local development resolves them from the sibling checkout via
# `[patch]` below.
handl-plugin-compile-js = { git = "https://github.com/handl-lang/tool-compile-js", branch = "main" }
# ADR-0128 Phase 6: the native engines/compilers live in the native
# repo; local development resolves them from the sibling checkout.
handl-plugin-compile-llvm = { git = "https://github.com/handl-lang/tool-compile-llvm", branch = "main" }
handl-plugin-compile-handl = { git = "https://github.com/handl-lang/tool-compile-handl", branch = "main" }
handl-plugin-compile-term = { git = "https://github.com/handl-lang/tool-compile-term", branch = "main" }
handl-plugin-compile-dot = { git = "https://github.com/handl-lang/tool-compile-dot", branch = "main" }
handl-plugin-compile-sexp = { git = "https://github.com/handl-lang/tool-compile-sexp", branch = "main" }
handl-test-utils = { path = "crates/handl-test-utils" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-tool-lex = { git = "https://github.com/handl-lang/tool-lex", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-exec = { git = "https://github.com/handl-lang/exec", branch = "main" }
hnl-tool-typecheck = { git = "https://github.com/handl-lang/tool-typecheck", branch = "main" }
hnl-tool-typecheck-nbe = { git = "https://github.com/handl-lang/tool-typecheck-nbe", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
hnl-exec-tree-walk = { git = "https://github.com/handl-lang/exec-tree-walk", branch = "main" }
hnl-tool-test = { git = "https://github.com/handl-lang/tool-test", branch = "main" }
handl-kit-test = { git = "https://github.com/handl-lang/tool-test", branch = "main" }
# The `tensor.*` host-op kit (`exec-tensor` repo): `handl-host-tensor`
# carries `src/kit.rs` — `tensor` module registration into the shared
# `handl-kit-core` table, consumed by `handl-kit-prelude`'s `register()`.
handl-host-tensor = { git = "https://github.com/handl-lang/exec-tensor", branch = "main" }
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
hnl-exec-bytecode = { git = "https://github.com/handl-lang/exec-bytecode", branch = "main" }
hnl-exec-cranelift = { git = "https://github.com/handl-lang/exec-cranelift", branch = "main" }
hnl-tool-fmt = { git = "https://github.com/handl-lang/tool-fmt", branch = "main" }
hnl-tool-lint = { git = "https://github.com/handl-lang/tool-lint", branch = "main" }
# PL-004 Phase 0/1: the desired-state codegen kernel lives in the
# `tool-codegen` repo. Git dep — the sibling checkout wins via the
# `[patch]` entry below (T-079 repo wiring).
hnl-tool-codegen = { git = "https://github.com/handl-lang/tool-codegen", branch = "main" }
hnl-tool-transform = { git = "https://github.com/handl-lang/tool-transform", branch = "main" }
hnl-tool-transform-rewrite = { git = "https://github.com/handl-lang/tool-transform-rewrite", branch = "main" }
handl-runtime = { path = "crates/handl-runtime" }
handl-kit-data = { path = "crates/handl-kit-data" }
handl-kit-core = { path = "crates/handl-kit-core" }
handl-kit-prelude-lang = { path = "crates/handl-kit-prelude-lang" }
handl-kit-data-prelude = { path = "crates/handl-kit-data-prelude" }
# T-125 Phase C: the four kit repos folded into this workspace.
handl-kit-stdlib = { path = "crates/handl-kit-stdlib" }
handl-kit-server = { path = "crates/handl-kit-server" }
handl-kit-ffi = { path = "crates/handl-kit-ffi" }
handl-plugin-ffi = { path = "crates/plugin-ffi" }
handl-kit-lang = { path = "crates/handl-kit-lang" }
# Vendored .hnl-only lib packages consumed by handl-kit-stdlib
# (ADR-0160 P3); resolved from the sibling lib-* checkouts via [patch].
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-codegen = { path = "crates/plugin-codegen" }
handl-plugin-ext-codegen = { path = "crates/plugin-ext-codegen" }
# P-003: the `hnl run <script>` task runner — consumed by ext-eval's
# `run` command dispatch (script names vs `.hnl` files).
handl-run = { path = "crates/run" }
# PL-004 T-085/T-086: the codemod engine — git dep; the sibling
# checkout wins via the `[patch]` entry below (T-079 repo wiring).
hnl-tool-codemod = { git = "https://github.com/handl-lang/tool-codemod", branch = "main" }
handl-plugin-codemod = { path = "crates/plugin-codemod" }
handl-plugin-ext-codemod = { path = "crates/plugin-ext-codemod" }

handl-plugin-lib-lang-compile = { git = "https://github.com/handl-lang/lib-lang-compile", branch = "main" }
handl-plugin-lib-lang-eval = { git = "https://github.com/handl-lang/lib-lang-eval", branch = "main" }
handl-plugin-lib-lang-lex = { git = "https://github.com/handl-lang/lib-lang-lex", branch = "main" }
handl-plugin-lib-lang-parse = { git = "https://github.com/handl-lang/lib-lang-parse", branch = "main" }
handl-plugin-lib-lang-run-compiled = { git = "https://github.com/handl-lang/lib-lang-run-compiled", branch = "main" }
handl-plugin-lib-lang-typecheck = { git = "https://github.com/handl-lang/lib-lang-typecheck", branch = "main" }
[features]
default = []

[dependencies.handl-platform]
workspace = true

[dev-dependencies]
serde_json = "1"

# ADR-0128 §Resolution — local development resolves the extracted repos
# from sibling checkouts; without the checkouts (or this block), the git
# sources are used. A git source must still resolve — before the remotes
# exist, point them at the local clones, e.g.:
#
#   CARGO_NET_GIT_FETCH_WITH_CLI=true \
#   GIT_CONFIG_COUNT=2 \
#   GIT_CONFIG_KEY_0="url.file:///home/luis/GitHub/handl-lang/kit-data-prelude.insteadOf" \
#   GIT_CONFIG_VALUE_0="https://github.com/handl-lang/kit-data-prelude" \
#   GIT_CONFIG_KEY_1="url.file:///home/luis/GitHub/handl-lang/kit-prelude.insteadOf" \
#   GIT_CONFIG_VALUE_1="https://github.com/handl-lang/kit-prelude" \
#   cargo check --workspace
# dev-link: begin
[patch."https://github.com/handl-lang/tool-compile-dot"]
handl-plugin-compile-dot = { path = "../tool-compile-dot/modules/compile-dot" }
[patch."https://github.com/handl-lang/tool-compile-handl"]
handl-plugin-compile-handl = { path = "../tool-compile-handl/modules/compile-handl" }
[patch."https://github.com/handl-lang/tool-compile-js"]
handl-plugin-compile-js = { path = "../tool-compile-js" }
[patch."https://github.com/handl-lang/tool-compile-llvm"]
handl-plugin-compile-llvm = { path = "../tool-compile-llvm" }
[patch."https://github.com/handl-lang/tool-compile-sexp"]
handl-plugin-compile-sexp = { path = "../tool-compile-sexp/modules/compile-sexp" }
[patch."https://github.com/handl-lang/tool-compile-term"]
handl-plugin-compile-term = { path = "../tool-compile-term/modules/compile-term" }
[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }
[patch."https://github.com/handl-lang/exec"]
hnl-exec = { path = "../exec" }
[patch."https://github.com/handl-lang/exec-bytecode"]
hnl-exec-bytecode = { path = "../exec-bytecode" }
[patch."https://github.com/handl-lang/exec-cranelift"]
hnl-exec-cranelift = { path = "../exec-cranelift" }
[patch."https://github.com/handl-lang/exec-tree-walk"]
hnl-exec-tree-walk = { path = "../exec-tree-walk" }
[patch."https://github.com/handl-lang/tool-fmt"]
hnl-tool-fmt = { path = "../tool-fmt" }
[patch."https://github.com/handl-lang/tool-lex"]
hnl-tool-lex = { path = "../tool-lex" }
[patch."https://github.com/handl-lang/tool-lex-pattern"]
hnl-tool-lex-pattern = { path = "../tool-lex-pattern" }
[patch."https://github.com/handl-lang/tool-lint"]
hnl-tool-lint = { path = "../tool-lint" }
# PL-004: the codegen kernel resolves from the sibling checkout.
[patch."https://github.com/handl-lang/tool-codegen"]
hnl-tool-codegen = { path = "../tool-codegen" }
# P-013 T-152: the atoms.yaml source + TypeScript emitter (external
# client bindings) resolve from the sibling checkout.
[patch."https://github.com/handl-lang/tool-codegen-ffi"]
handl-plugin-codegen-ffi = { path = "../tool-codegen-ffi" }
# PL-004 T-085/T-086: the codemod engine resolves from the sibling
# checkout, same convention as tool-codegen above.
[patch."https://github.com/handl-lang/tool-codemod"]
hnl-tool-codemod = { path = "../tool-codemod" }
[patch."https://github.com/handl-lang/tool-parse"]
hnl-tool-parse = { path = "../tool-parse" }
[patch."https://github.com/handl-lang/tool-parse-pratt"]
hnl-tool-parse-pratt = { path = "../tool-parse-pratt" }
[patch."https://github.com/handl-lang/tool-test"]
hnl-tool-test = { path = "../tool-test" }
handl-kit-test = { path = "../tool-test/crates/kit-test" }
[patch."https://github.com/handl-lang/tool-watch"]
hnl-tool-watch = { path = "../tool-watch" }
[patch."https://github.com/handl-lang/tool-transform"]
hnl-tool-transform = { path = "../tool-transform" }
[patch."https://github.com/handl-lang/tool-transform-rewrite"]
hnl-tool-transform-rewrite = { path = "../tool-transform-rewrite" }
[patch."https://github.com/handl-lang/tool-typecheck"]
hnl-tool-typecheck = { path = "../tool-typecheck" }
[patch."https://github.com/handl-lang/tool-typecheck-nbe"]
hnl-tool-typecheck-nbe = { path = "../tool-typecheck-nbe" }
[patch."https://github.com/handl-lang/kit-core"]
# T-123 Phase A: `handl-kit-core` is a workspace member now — external kits
# (kit-stdlib, kit-prelude, kit-ffi, …) that still declare the git dep
# resolve to this member until the consumer-repoint sweep.
handl-kit-core = { path = "crates/handl-kit-core" }

# T-125 Phase C: the four kit crates are workspace members now — external
# consumers that still declare the kit-* git deps resolve to these members
# until the consumer-repoint sweep.
[patch."https://github.com/handl-lang/kit-stdlib"]
handl-kit-stdlib = { path = "crates/handl-kit-stdlib" }

[patch."https://github.com/handl-lang/kit-server"]
handl-kit-server = { path = "crates/handl-kit-server" }


[patch."https://github.com/handl-lang/kit-lang"]
handl-kit-lang = { path = "crates/handl-kit-lang" }

[patch."https://github.com/handl-lang/kit-ffi"]
handl-kit-ffi = { path = "crates/handl-kit-ffi" }
handl-plugin-ffi = { path = "crates/plugin-ffi" }

[patch."https://github.com/handl-lang/exec-tensor"]
# `handl-host-tensor` lives in the exec-tensor repo; local development
# resolves it from the sibling checkout.
handl-host-tensor = { path = "../exec-tensor" }

[patch."https://github.com/handl-lang/host"]
handl-plugin-lib-stdlib = { path = "../host/crates/plugin-lib-stdlib" }
# dev-link: end
handl = { path = "../host" }
handl-bench = { path = "../host/crates/bench" }
handl-ext-tests = { path = "../host/crates/ext-tests" }
handl-kit-arrow-lower = { path = "../host/crates/handl-kit-arrow-lower" }
handl-kit-data = { path = "../host/crates/handl-kit-data" }
handl-runtime = { path = "../host/crates/handl-runtime" }
handl-test-utils = { path = "../host/crates/handl-test-utils" }
handl-host-tooling = { path = "../host/crates/host-tooling" }
handl-platform = { path = "../host/crates/platform" }
handl-platform-tests = { path = "../host/crates/platform-tests" }
handl-plugin-applier = { path = "../host/crates/plugin-applier" }
handl-plugin-compile = { path = "../host/crates/plugin-compile" }
handl-plugin-exec-cache = { path = "../host/crates/plugin-exec-cache" }
handl-plugin-ext-compile = { path = "../host/crates/plugin-ext-compile" }
handl-plugin-ext-detect = { path = "../host/crates/plugin-ext-detect" }
handl-plugin-ext-diag = { path = "../host/crates/plugin-ext-diag" }
handl-plugin-ext-eval = { path = "../host/crates/plugin-ext-eval" }
