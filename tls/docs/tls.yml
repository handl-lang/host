category:
  slug: tls
  title: TLS
module:
  name: tls
  title: TLS
functions:
  version:
    description: Returns TLS library and supported protocol version information.
    details: |-
      `tls.version()` returns an object describing the available TLS support.

      The returned object contains:

      - `library` (string): the name of the active TLS backend (e.g. `"stub"` for the default test backend or `"tokio-rustls"` when `handl-lib-tls-native` is used).
      - `versions` (array<string>): supported TLS protocol versions (`"1.2"` and `"1.3"`).

      This is useful for feature sniffing and debugging TLS capabilities.
    signature: "tls.version() -> object"
    params: []
    return_value: object
    examples:
      - tls.version()
    see: []
  generate_self_signed:
    description: Generate a self-signed TLS certificate for the given host or hosts.
    details: |-
      `tls.generate_self_signed(hosts)` creates a new self-signed X.509 certificate.

      `hosts` may be a single string or an array of strings. Each string becomes a
      DNS subject alternative name on the generated certificate.

      Returns an object containing:

      - `cert` (string): the PEM-encoded X.509 certificate.
      - `key` (string): the PEM-encoded PKCS #8 private key.
      - `fingerprint` (string): the lower-case SHA-256 hex fingerprint of the certificate.

      Examples:

      - `tls.generate_self_signed("localhost")` — certificate for a single host.
      - `tls.generate_self_signed(["localhost", "example.com"])` — certificate for multiple hosts.
    signature: "tls.generate_self_signed(hosts: string | array<string>) -> object"
    params:
      - name: hosts
        type: string | array<string>
        description: the DNS name or names the certificate should be valid for
    return_value: object
    examples:
      - tls.generate_self_signed("localhost")
      - tls.generate_self_signed(["localhost", "example.com"])
    see: []
  parse_cert:
    description: Parse PEM-encoded certificates and return basic validity information.
    details: |-
      `tls.parse_cert(pem)` parses a PEM string and returns an object.

      The returned object contains:

      - `count` (number): the number of certificates found.
      - `valid` (boolean): `true` if at least one certificate was parsed successfully.

      An empty string or input without certificate blocks returns `{ count: 0, valid: false }`.
      Malformed PEM raises an error.
    signature: "tls.parse_cert(pem: string) -> object"
    params:
      - name: pem
        type: string
        description: the PEM-encoded certificate or certificate chain to parse
    return_value: object
    examples:
      - tls.parse_cert("-----BEGIN CERTIFICATE-----\nMIIDXTCCAkWg...\n-----END CERTIFICATE-----\n")
    see: []
  fingerprint:
    description: Compute the SHA-256 fingerprint of the first certificate in a PEM blob.
    details: |-
      `tls.fingerprint(pem)` extracts the first certificate from the supplied PEM string
      and returns its SHA-256 digest encoded as a lower-case hex string.

      This is commonly used to identify or pin certificates. The returned string is
      64 hexadecimal characters long.

      Raises an error if the PEM contains no certificates or if the certificate data
      cannot be decoded.
    signature: "tls.fingerprint(pem: string) -> string"
    params:
      - name: pem
        type: string
        description: the PEM-encoded certificate to fingerprint
    return_value: string
    examples:
      - tls.fingerprint("-----BEGIN CERTIFICATE-----\nMIIDXTCCAkWg...\n-----END CERTIFICATE-----\n")
    see: []
  client_config:
    description: Build a TLS client configuration and return a configuration id.
    details: |-
      `tls.client_config(roots, cert?, key?)` builds a client trust store from a list of
      PEM-encoded root certificates and optionally loads a client certificate for mutual TLS.

      - `roots` (array<string>): PEM-encoded certificates to trust. At least one root is required.
      - `cert` (string | null): optional PEM-encoded client certificate.
      - `key` (string | null): optional PEM-encoded client private key. Required when `cert` is provided.

      Returns a numeric `config_id` that can be passed to `tls.connect`.
    signature: "tls.client_config(roots: array<string>, cert?: string, key?: string) -> number"
    params:
      - name: roots
        type: array<string>
        description: PEM-encoded root certificates to trust
      - name: cert
        type: string | null
        description: optional PEM-encoded client certificate
      - name: key
        type: string | null
        description: optional PEM-encoded client private key
    return_value: number
    examples:
      - tls.client_config([root_pem])
      - tls.client_config([root_pem], client_cert, client_key)
    see: []
  server_config:
    description: Build a TLS server configuration and return a configuration id.
    details: |-
      `tls.server_config(cert, key)` builds a server configuration from a PEM-encoded
      certificate and its private key.

      - `cert` (string): PEM-encoded certificate or certificate chain.
      - `key` (string): PEM-encoded private key.

      Returns a numeric `config_id` that can be passed to `tls.accept`.
    signature: "tls.server_config(cert: string, key: string) -> number"
    params:
      - name: cert
        type: string
        description: PEM-encoded certificate or certificate chain
      - name: key
        type: string
        description: PEM-encoded private key
    return_value: number
    examples:
      - tls.server_config(cert_pem, key_pem)
    see: []
  connect:
    description: Open a TLS client connection to a remote host and port.
    details: |-
      `tls.connect(host, port, config_id)` opens a TLS client connection using the
      client configuration identified by `config_id`.

      - `host` (string): the DNS name or IP of the server. This is also used for certificate hostname verification.
      - `port` (number): the TCP port to connect to.
      - `config_id` (number): a configuration id returned by `tls.client_config`.

      Returns a numeric `conn_id` that can be used with `tls.read`, `tls.write`, and `tls.close_conn`.
    signature: "tls.connect(host: string, port: number, config_id: number) -> number"
    params:
      - name: host
        type: string
        description: the remote host to connect to
      - name: port
        type: number
        description: the remote port to connect to
      - name: config_id
        type: number
        description: a client configuration id from tls.client_config
    return_value: number
    examples:
      - tls.connect("example.com", 443, client_config_id)
    see: []
  accept:
    description: Listen for an incoming TLS client connection on an address and port.
    details: |-
      `tls.accept(addr, port, config_id)` binds a TCP listener to `addr:port`, accepts the
      first incoming connection, and completes the TLS handshake using the server
      configuration identified by `config_id`.

      - `addr` (string): the local address to bind to (e.g. `"0.0.0.0"`).
      - `port` (number): the local TCP port to listen on.
      - `config_id` (number): a server configuration id returned by `tls.server_config`.

      Returns a numeric `conn_id` that can be used with `tls.read`, `tls.write`, and `tls.close_conn`.
    signature: "tls.accept(addr: string, port: number, config_id: number) -> number"
    params:
      - name: addr
        type: string
        description: the local address to bind to
      - name: port
        type: number
        description: the local TCP port to listen on
      - name: config_id
        type: number
        description: a server configuration id from tls.server_config
    return_value: number
    examples:
      - tls.accept("0.0.0.0", 8443, server_config_id)
    see: []
  read:
    description: Read up to a given number of bytes from a TLS connection.
    details: |-
      `tls.read(conn_id, len)` reads up to `len` bytes from the TLS connection identified
      by `conn_id` and returns the bytes as a UTF-8 string.

      - `conn_id` (number): the connection to read from.
      - `len` (number): the maximum number of bytes to read.

      Returns the read bytes as a string. The returned string may be shorter than `len`.
    signature: "tls.read(conn_id: number, len: number) -> string"
    params:
      - name: conn_id
        type: number
        description: the connection to read from
      - name: len
        type: number
        description: the maximum number of bytes to read
    return_value: string
    examples:
      - tls.read(conn_id, 1024)
    see: []
  write:
    description: Write a string to a TLS connection.
    details: |-
      `tls.write(conn_id, data)` writes `data` to the TLS connection identified by `conn_id`.

      - `conn_id` (number): the connection to write to.
      - `data` (string): the data to write.
    signature: "tls.write(conn_id: number, data: string) -> null"
    params:
      - name: conn_id
        type: number
        description: the connection to write to
      - name: data
        type: string
        description: the data to write
    return_value: "null"
    examples:
      - tls.write(conn_id, "hello")
    see: []
  close_conn:
    description: Close a TLS connection and free its resources.
    details: |-
      `tls.close_conn(conn_id)` closes the connection identified by `conn_id`.

      - `conn_id` (number): the connection to close.
    signature: "tls.close_conn(conn_id: number) -> null"
    params:
      - name: conn_id
        type: number
        description: the connection to close
    return_value: "null"
    examples:
      - tls.close_conn(conn_id)
    see: []
  close_listener:
    description: Close a previously opened listener.
    details: |-
      `tls.close_listener(listener_id)` closes the listener identified by `listener_id`.
      The exact behavior depends on the active TLS backend.

      - `listener_id` (number): the listener to close.
    signature: "tls.close_listener(listener_id: number) -> null"
    params:
      - name: listener_id
        type: number
        description: the listener to close
    return_value: "null"
    examples:
      - tls.close_listener(listener_id)
    see: []
