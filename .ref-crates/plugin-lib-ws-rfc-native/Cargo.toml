[package]
name = "handl-plugin-lib-ws-rfc-native"
version.workspace = true
edition.workspace = true
description = "Native RFC 6455 WebSocket client/server using tokio-tungstenite."

[features]
default = ["client", "server"]
client = []
server = []

[dependencies]
handl-platform = { path = "../../crates/platform" }
handl-plugin-module = { path = "../../crates/plugin-module" }
handl-plugin-lib-handl = { workspace = true }
handl-plugin-ext-eval = { path = "../../crates/plugin-ext-eval" }
handl-plugin-lib-ws-rfc.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
futures-util = "0.3"
url = "2"

[dev-dependencies]
rcgen = "0.13"
